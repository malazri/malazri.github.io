<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Step URL & Code Extractor</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 20px auto; padding: 15px; background-color: #f3f4f6; }
        .container { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); }
        .btn-group { display: flex; flex-direction: row; gap: 12px; justify-content: space-between; width: 100%; }
        
        button { background-color: #10b981; color: white; padding: 14px 16px; border: none; border-radius: 4px; cursor: pointer; font-size: 15px; font-weight: bold; flex: 1; min-width: 0; transition: background 0.2s; text-align: center; }
        button:hover { background-color: #059669; }
        button:disabled { background-color: #9ca3af; cursor: not-allowed; }
        
        #status { margin-top: 20px; font-weight: bold; color: #4b5563; line-height: 1.5; }
        .output-card { margin-top: 25px; padding: 20px; background-color: #f9fafb; border: 1px solid #e5e7eb; border-radius: 6px; display: none; }
        
        /* Dates Box Styles */
        .dates-box { 
            background: #fef3c7; 
            padding: 15px; 
            border-right: 5px solid #f59e0b; 
            border-radius: 4px; 
            font-weight: bold; 
            margin-bottom: 20px; 
            color: #92400e; 
            direction: rtl; 
            font-size: 16px;
            line-height: 1.6;
            display: none;
        }
        .dates-content {
            display: flex;
            flex-wrap: wrap; 
            gap: 30px; 
        }

        .code-box { background: #eff6ff; padding: 14px; border-left: 5px solid #10b981; border-radius: 4px; word-break: break-all; font-weight: bold; margin-top: 10px; }
        a { color: #3b82f6; text-decoration: none; font-weight: bold; }
        a:hover { text-decoration: underline; }
        
        .image-container { text-align: center; margin-top: 15px; }
        .extracted-img { max-width: 100%; height: auto; border: 1px solid #d1d5db; border-radius: 6px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        h2 { margin-top: 0; font-size: 22px; }
        h4 { margin-top: 0; color: #1f2937; }

        /* Custom Dialog (Alert) Styles */
        dialog {
            border: none;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            padding: 20px;
            width: 90%;
            max-width: 400px;
            text-align: center;
        }
        dialog::backdrop {
            background: rgba(0,0,0,0.5);
        }
        #dialogUrlInput {
            width: 100%;
            padding: 10px;
            margin: 15px 0;
            border: 1px solid #d1d5db;
            border-radius: 4px;
            box-sizing: border-box;
            font-family: monospace;
            background-color: #f9fafb;
        }
        .dialog-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        @media (max-width: 600px) {
            body { margin: 10px auto; padding: 10px; }
            .container { padding: 15px; }
            .btn-group { flex-direction: column; }
            button { width: 100%; font-size: 16px; }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Get the AirmaxTV Code:</h2>

        <div class="btn-group">
        <!-- NEW 3-Step Extraction for OTT -->
        <button class="fetch-btn" onclick="runExtractionPipeline(event, 'https://www.vviruslove.com/%d9%83%d9%8a%d9%81-%d8%aa%d9%81%d8%b9%d9%84-%d9%82%d9%86%d9%88%d8%a7%d8%aa-iptv-%d8%b9%d9%84%d9%89-%d8%a7%d9%84%d8%aa%d8%b7%d8%a8%d9%8a%d9%82-ottplayer-%d9%85%d8%ac%d8%a7%d9%86%d8%a7/', 'اضغط هنا لزيارة صفحة الأكواد الرسمية للتطبيق')">Get OTT code</button>
        
        <!-- NEW 3-Step Extraction for Airmax -->
        <button class="fetch-btn" onclick="runExtractionPipeline(event, 'https://www.vviruslove.com/%d8%aa%d9%81%d8%b9%d9%8a%d9%84-%d9%83%d9%88%d8%af-%d8%aa%d8%b7%d8%a8%d9%8a%d9%82-airmax-live-%d9%84%d9%85%d8%af%d9%89-%d8%a7%d9%84%d8%ad%d9%8a%d8%a7%d9%87-%d9%84%d9%85%d8%b4%d8%a7%d9%87%d8%af%d8%a9/', 'اضغط هنا لزيارة صفحة الأكواد الرسمية للتطبيق')">Get AirmaxTV Live Code</button>
        
        <!-- Standard 2-Step Extraction for ssiptv -->
        <button class="fetch-btn" onclick="runExtractionPipeline(event, 'https://www.vviruslove.com/5-%d9%83%d9%88%d8%af-%d8%aa%d9%81%d8%b9%d9%8a%d9%84-code-ss-player-2026-2025-2/')">ssiptv code</button>
    </div>

    <div id="status"></div>

    <div id="outputCard" class="output-card">
        <div id="datesResultSection" class="dates-box">
            <div class="dates-content">
                <span id="updateDateDisplay"></span>
                <span id="nextUpdateDisplay"></span>
            </div>
        </div>

        <div id="extractedUrlDisplay" style="text-align: center; margin-bottom: 20px;"></div>

        <div id="imageResultSection">
            <div class="image-container">
                <img id="extractedImageDisplay" class="extracted-img" src="" alt="Loading Image...">
            </div>
        </div>

        <div id="linkResultSection" style="display: none;">
            <h4>Extracted Code/M3U Link:</h4>
            <div class="code-box">
                <span id="extractedLinkDisplay"></span>
            </div>
        </div>
    </div>
</div>

<!-- Native HTML Dialog acting as a custom alert -->
<dialog id="customAlertDialog">
    <h3 style="margin-top: 0; color: #1f2937;">Extracted URL</h3>
    <input type="text" id="dialogUrlInput" readonly>
    <div class="dialog-buttons">
        <button onclick="copyFromDialog(event)" style="background-color: #3b82f6;">Copy Link</button>
        <button onclick="closeDialog()" style="background-color: #6b7280;">Close</button>
    </div>
</dialog>

<script>
// --- Dialog / Alert Functions ---
function showDialog(url) {
    const dialog = document.getElementById('customAlertDialog');
    document.getElementById('dialogUrlInput').value = url;
    dialog.showModal();
}

function copyFromDialog(event) {
    const input = document.getElementById('dialogUrlInput');
    input.select();
    input.setSelectionRange(0, 99999);
    document.execCommand('copy');
    
    const btn = event.target;
    const originalText = btn.innerText;
    btn.innerText = "Copied!";
    btn.style.backgroundColor = "#10b981";
    
    setTimeout(() => {
        btn.innerText = originalText;
        btn.style.backgroundColor = "#3b82f6";
    }, 1500);
}

function closeDialog() {
    document.getElementById('customAlertDialog').close();
}

// --- Main Extraction Logic ---
// Notice the new targetAnchorText parameter (it defaults to null)
async function runExtractionPipeline(event, startUrl, targetAnchorText = null) {
    event.preventDefault();

    // PASTE YOUR CLOUDFLARE WORKER URL HERE (Make sure it ends in ?url= )
    const workerProxyUrl = 'https://code.3ma-creative.workers.dev/?url=';

    const buttons = document.querySelectorAll('.fetch-btn');
    const statusDiv = document.getElementById('status');
    const outputCard = document.getElementById('outputCard');
    const urlDisplay = document.getElementById('extractedUrlDisplay');
    const imgDisplay = document.getElementById('extractedImageDisplay');
    const linkDisplay = document.getElementById('extractedLinkDisplay');
    
    const datesSection = document.getElementById('datesResultSection');
    const imageSection = document.getElementById('imageResultSection');
    const linkSection = document.getElementById('linkResultSection');

    // Reset layout states
    buttons.forEach(btn => btn.disabled = true);
    outputCard.style.display = "none";
    datesSection.style.display = "none";
    imageSection.style.display = "none";
    linkSection.style.display = "none";
    statusDiv.style.color = '#4b5563';
    urlDisplay.innerHTML = '';

    try {
        let rootUrl = startUrl;
        
        // --- STEP 0: Find Dynamic Root URL (If requested) ---
        if (targetAnchorText) {
            statusDiv.innerText = "[Step 0/3] Fetching permanent page to find the latest link...";
            let preResponse = await fetch(workerProxyUrl + encodeURIComponent(startUrl));
            if (!preResponse.ok) throw new Error('Failed to load the permanent page. Check Worker URL.');
            
            let preHtml = await preResponse.text();
            
            const preParser = new DOMParser();
            const preDoc = preParser.parseFromString(preHtml, 'text/html');
            const allLinks = preDoc.querySelectorAll('a');
            
            let foundLink = null;
            for (let a of allLinks) {
                // We use .includes() so it still matches even if emojis render weirdly
                if (a.textContent.includes(targetAnchorText)) {
                    foundLink = a.getAttribute('href');
                    break;
                }
            }

            if (!foundLink) {
                throw new Error("Could not find the link containing the text: " + targetAnchorText);
            }
            
            rootUrl = foundLink; // Update the rootUrl to the newly found dynamic link
        }

        // --- STEP 1: Fetch Root Page ---
        statusDiv.innerText = targetAnchorText ? "[Step 1/3] Connecting to the latest index page..." : "[Step 1/2] Connecting to index page...";

        let response = await fetch(workerProxyUrl + encodeURIComponent(rootUrl));
        if (!response.ok) throw new Error('Primary stream failed.');

        let htmlContent = await response.text();
        const urlRegex = /data-weekly-url=["']([^"']+)["']/;
        const urlMatch = htmlContent.match(urlRegex);

        if (!urlMatch || !urlMatch[1]) {
            throw new Error("Could not discover 'data-weekly-url' structural token.");
        }

        const extractedWeeklyUrl = urlMatch[1];

        // --- STEP 2: Fetch the Extracted URL ---
        statusDiv.innerText = targetAnchorText ? "[Step 2/3] Target found! Loading secondary page..." : "[Step 2/2] Target found! Loading secondary page structure...";

        response = await fetch(workerProxyUrl + encodeURIComponent(extractedWeeklyUrl));
        if (!response.ok) throw new Error('Secondary page stream failed.');

        let secondaryHtmlContent = await response.text();

        // --- STEP 3: Fallback extraction engine ---
        const parser = new DOMParser();
        const doc = parser.parseFromString(secondaryHtmlContent, 'text/html');
        
        // --- EXTRACTION A: DATES ---
        const rawText = doc.body.textContent;
        const updateMatch = rawText.match(/تاريخ التحديث[\s\S]*?\d{4}\/\d{2}\/\d{2}[\s\S]*?يوم\s*[\u0600-\u06FF]+/);
        const nextUpdateMatch = rawText.match(/التحديث القادم[\s\S]*?\d{4}\/\d{2}\/\d{2}[\s\S]*?يوم\s*[\u0600-\u06FF]+/);

        if (updateMatch || nextUpdateMatch) {
            document.getElementById('updateDateDisplay').innerText = updateMatch ? updateMatch[0].replace(/\s+/g, ' ').trim() : '';
            document.getElementById('nextUpdateDisplay').innerText = nextUpdateMatch ? nextUpdateMatch[0].replace(/\s+/g, ' ').trim() : '';
            datesSection.style.display = "block";
        }

        // --- EXTRACTION B: LINKS OR IMAGES ---
        const phpRegex = /(https?:\/\/[^\s"'><]+get\.php[^\s"'><]*)/i;
        const phpMatch = secondaryHtmlContent.match(phpRegex);

        if (phpMatch && phpMatch[1]) {
            const phpUrl = phpMatch[1];
            linkDisplay.innerHTML = `<a href="${phpUrl}" target="_blank">${phpUrl}</a>`;
            linkSection.style.display = "block";
        } else {
            const targetImgElement = doc.querySelector('img[alt="كود التفعيل"]');

            if (!targetImgElement || !targetImgElement.getAttribute('src')) {
                throw new Error('Image activation code could not be found.');
            }

            imgDisplay.src = targetImgElement.getAttribute('src');
            imageSection.style.display = "block";
        }

        // Render success
        statusDiv.style.color = '#10b981';
        statusDiv.innerText = "Pipeline complete!";
        
        urlDisplay.innerHTML = `<button onclick="showDialog('${extractedWeeklyUrl}')" style="background-color: #3b82f6; width: auto; padding: 12px 24px;">Show & Copy Extracted Link</button>`;
        
        outputCard.style.display = "block";

    } catch (error) {
        statusDiv.style.color = '#ef4444';
        statusDiv.innerText = "Execution broken: " + error.message;
    } finally {
        buttons.forEach(btn => btn.disabled = false);
    }
}
</script>

</body>
</html>
