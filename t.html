<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ahwak TV - Debug Mode</title>
    <style>
        :root {
            --bg-color: #0a0a0a;
            --card-bg: #1a1a1a;
            --accent-color: #e50914;
            --text-color: #ffffff;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            overflow: hidden;
        }

        /* DEBUG CONSOLE STYLING */
        #debug-log {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 150px;
            background: rgba(0, 0, 0, 0.9);
            color: #00ff00;
            font-family: monospace;
            font-size: 12px;
            z-index: 10000;
            overflow-y: scroll;
            border-bottom: 2px solid #444;
            padding: 10px;
            pointer-events: none; /* Allows clicking through if needed */
        }

        .container { padding: 40px; margin-top: 150px; } /* Offset for debug bar */
        header { margin-bottom: 30px; }
        .episode-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
        .card { background: var(--card-bg); border-radius: 10px; padding: 15px; text-align: center; border: 4px solid transparent; transition: all 0.2s ease; }
        .card img { width: 100%; border-radius: 5px; }
        .card.focused { transform: scale(1.1); border-color: white; background: #333; }
        #player-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: black; z-index: 100; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

<div id="debug-log">
    <div>[System] Logger Started. Waiting for errors...</div>
</div>

<div class="container">
    <header>
        <h1>شباب البومب 14 (Debug Mode)</h1>
        <p id="status">جاري فحص النظام...</p>
    </header>
    <div id="grid" class="episode-grid"></div>
</div>

<div id="player-overlay">
    <iframe id="video-frame" src="" allowfullscreen></iframe>
</div>

<script>
    // --- 1. THE DEBUGGER LOGIC ---
    var debugLog = document.getElementById('debug-log');
    function logToTV(msg, isError) {
        var div = document.createElement('div');
        div.style.color = isError ? '#ff4444' : '#00ff00';
        div.innerText = '[' + new Date().toLocaleTimeString() + '] ' + msg;
        debugLog.appendChild(div);
        debugLog.scrollTop = debugLog.scrollHeight;
    }

    // Catch Errors
    window.onerror = function(msg, url, line) {
        logToTV("ERR: " + msg + " on line " + line, true);
        return false;
    };

    // Override Console.log
    var oldLog = console.log;
    console.log = function() {
        var args = Array.prototype.slice.call(arguments);
        logToTV(args.join(' '), false);
        oldLog.apply(console, arguments);
    };

    // --- 2. THE APP LOGIC (ES5 CONVERTED) ---
    var PROXY = "https://cors-anywhere.herokuapp.com/"; 
    var TARGET_URL = "https://tye.ahwaktv.net/?s=%D8%B4%D8%A8%D8%A7%D8%A8+%D8%A7%D9%84%D8%A8%D9%88%D9%85%D8%A8+14";
    var episodes = [];
    var currentIndex = 0;

    function fetchEpisodes() {
        console.log("Fetching data from proxy...");
        fetch(PROXY + TARGET_URL)
            .then(function(response) { return response.text(); })
            .then(function(html) {
                var parser = new DOMParser();
                var doc = parser.parseFromString(html, 'text/html');
                var items = doc.querySelectorAll('.PostItem'); 
                
                if (items.length === 0) console.log("Warning: No items found. Check selector.");

                for (var i = 0; i < items.length; i++) {
                    var item = items[i];
                    var link = item.querySelector('a').href;
                    var title = item.querySelector('h2').innerText;
                    var img = item.querySelector('img').src;
                    episodes.push({ title: title, link: link, img: img });
                }
                renderGrid();
                console.log("Found " + episodes.length + " episodes.");
            })
            .catch(function(err) {
                console.log("Fetch Error: " + err.message);
            });
    }

    function renderGrid() {
        var grid = document.getElementById('grid');
        var html = '';
        for (var i = 0; i < episodes.length; i++) {
            var focused = (i === 0) ? 'focused' : '';
            html += '<div class="card ' + focused + '" data-index="' + i + '">' +
                    '<img src="' + episodes[i].img + '">' +
                    '<div>' + episodes[i].title + '</div>' +
                    '</div>';
        }
        grid.innerHTML = html;
    }

    document.addEventListener('keydown', function(e) {
        console.log("Key Pressed: " + e.keyCode + " (" + e.key + ")");
        
        var cards = document.querySelectorAll('.card');
        if (cards.length === 0) return;

        cards[currentIndex].classList.remove('focused');

        if (e.key === 'ArrowRight') currentIndex = (currentIndex + 1) % cards.length;
        else if (e.key === 'ArrowLeft') currentIndex = (currentIndex - 1 + cards.length) % cards.length;
        else if (e.key === 'Enter' || e.keyCode === 13) {
            console.log("Opening: " + episodes[currentIndex].title);
            // Open player logic here...
        }

        cards[currentIndex].classList.add('focused');
        cards[currentIndex].scrollIntoView({ behavior: 'smooth', block: 'center' });
    });

    // Start
    fetchEpisodes();
</script>

</body>
</html>
