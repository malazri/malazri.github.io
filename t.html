<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlAzri TV Dashboard v1.5</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary-red: #e50914; --bg-dark: #050505; --panel-bg: #111; --card-w: 140px; --card-h: 200px; }
        
        body { 
            background-color: var(--bg-dark); color: white; font-family: 'Segoe UI', sans-serif; 
            margin: 0; padding: 0; overflow: hidden; height: 100vh;
            display: grid;
            grid-template-rows: 70px 240px 1fr; /* Header, Discovery-Area, Main-Area */
            grid-template-columns: 1fr 300px;    /* Middle(Player), Side(Episodes) */
        }

        /* --- Global Focus --- */
        *:focus { outline: 3px solid var(--primary-red) !important; transform: scale(1.02); z-index: 10; transition: transform 0.1s; }

        /* --- Header --- */
        header { 
            grid-row: 1; grid-column: 1 / span 2;
            background: #000; display: flex; align-items: center; justify-content: space-between;
            padding: 0 30px; border-bottom: 1px solid #222;
        }
        .brand { color: var(--primary-red); font-size: 1.8rem; font-weight: 900; cursor: pointer; }
        .search-box { background: #222; border-radius: 5px; padding: 5px 15px; display: flex; align-items: center; width: 400px; }
        .search-box input { background: transparent; border: none; color: white; width: 100%; outline: none; font-size: 1.1rem; }

        /* --- TOP SECTION: Discovery Area --- */
        .top-section { 
            grid-row: 2; grid-column: 1 / span 2;
            background: #0a0a0a; overflow-x: auto; white-space: nowrap;
            padding: 10px 20px; border-bottom: 1px solid #222;
            display: flex; gap: 20px; align-items: center;
        }
        .row-group { display: inline-flex; flex-direction: column; vertical-align: top; }
        .row-group-title { font-size: 0.9rem; color: #888; margin-bottom: 8px; font-weight: bold; border-right: 3px solid var(--primary-red); padding-right: 8px; }

        /* --- SIDE SECTION: Episodes --- */
        .side-section { 
            grid-row: 3; grid-column: 2;
            background: var(--panel-bg); border-right: 1px solid #222;
            display: flex; flex-direction: column; overflow-y: auto; padding: 10px;
        }
        .side-title { padding: 10px; font-weight: bold; border-bottom: 1px solid #333; margin-bottom: 10px; color: var(--primary-red); font-size: 1.1rem;}

        /* --- MIDDLE SECTION: Player --- */
        .middle-section { 
            grid-row: 3; grid-column: 1;
            background: #000; display: flex; flex-direction: column; position: relative;
        }
        #main-video { width: 100%; height: 100%; background: #000; }

        /* --- Cards UI --- */
        .card { 
            display: inline-block; min-width: var(--card-w); height: var(--card-h); 
            background: #1a1a1a; border-radius: 6px; overflow: hidden; 
            cursor: pointer; position: relative; flex-shrink: 0; margin-left: 15px;
        }
        .card img { width: 100%; height: 100%; object-fit: cover; }
        .card-label { 
            position: absolute; bottom: 0; width: 100%; background: rgba(0,0,0,0.85); 
            font-size: 0.75rem; text-align: center; padding: 5px 0; white-space: normal;
        }

        .ep-item { 
            padding: 15px; background: #1a1a1a; margin-bottom: 10px; border-radius: 4px; 
            cursor: pointer; font-size: 0.95rem; border-right: 4px solid transparent;
        }
        .ep-item:focus { border-right-color: var(--primary-red); background: #222; }

        /* --- Resume Overlay --- */
        .resume-overlay {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.95); display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 100; display: none;
        }

        .btn-action { background: var(--primary-red); color: white; border: none; padding: 12px 25px; border-radius: 4px; cursor: pointer; font-weight: bold; margin: 5px; font-size: 1rem; }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
    </style>
</head>
<body>

<header>
    <div class="brand" onclick="location.reload()" tabindex="0">ALAZRI TV</div>
    <div class="search-box">
        <i class="fas fa-search" style="margin-left:10px; color:#666;"></i>
        <input type="text" id="search-input" placeholder="ابحث عن فيلم أو مسلسل..." tabindex="0">
    </div>
    <div tabindex="0" onclick="refreshDiscoveryArea()" style="cursor:pointer; padding: 10px;">
        <i class="fas fa-sync-alt" style="color:#aaa;"></i>
    </div>
</header>

<div class="top-section" id="discovery-area">
    <div class="row-group" id="group-search" style="display:none;">
        <div class="row-group-title">نتائج البحث</div>
        <div id="content-search" style="display:flex;"></div>
    </div>

    <div class="row-group" id="group-history">
        <div class="row-group-title">واصل المشاهدة</div>
        <div id="content-history" style="display:flex;"></div>
    </div>

    <div class="row-group" id="group-favs">
        <div class="row-group-title">المفضلة</div>
        <div id="content-favs" style="display:flex;"></div>
    </div>
</div>

<div class="side-section">
    <div class="side-title" id="series-title">اختر مسلسلاً</div>
    <button id="fav-btn" class="btn-action" style="display:none; width: 100%; margin-bottom:15px;" onclick="handleFavoriteAction()" tabindex="0">
        <i id="fav-icon" class="far fa-heart"></i> أضف للمفضلة
    </button>
    <div id="episode-list"></div>
</div>

<div class="middle-section">
    <video id="main-video" controls tabindex="0"></video>
    
    <div id="resume-ui" class="resume-overlay">
        <h2>إكمال المشاهدة؟</h2>
        <p id="resume-msg" style="color:#aaa; font-size:1.1rem;"></p>
        <div style="margin-top:20px;">
            <button class="btn-action" onclick="confirmResume(true)" tabindex="0">نعم، إكمال</button>
            <button class="btn-action" style="background:#444" onclick="confirmResume(false)" tabindex="0">البدء من جديد</button>
        </div>
    </div>

    <div style="padding:15px; background: linear-gradient(transparent, black); position:absolute; bottom:0; width:100%;">
        <div id="video-title" style="font-weight:bold; color:var(--primary-red); font-size:1.2rem;">جاهز للتشغيل</div>
    </div>
</div>

<script>
    var PROXY = function(url) { return "https://corsproxy.io/?" + encodeURIComponent(url); };
    var BASE = "https://ak.sv";
    var FAV_KEY = "alazri_favs_v2";
    var HIST_KEY = "alazri_full_hist_v2";
    var state = { currentSeries: null, currentLink: null, savedPos: 0 };
    var video = document.getElementById('main-video');

    function getFavs() { var d = localStorage.getItem(FAV_KEY); return d ? JSON.parse(d) : []; }
    function getFullHist() { var d = localStorage.getItem(HIST_KEY); return d ? JSON.parse(d) : []; }

    // --- Enhanced Discovery Logic ---
    function refreshDiscoveryArea() {
        // 1. Render Continue Watching
        var hist = getFullHist();
        var histGrid = document.getElementById('content-history');
        if(hist.length > 0) {
            document.getElementById('group-history').style.display = 'inline-flex';
            histGrid.innerHTML = hist.slice(0, 10).map(function(item) {
                return '<div class="card" tabindex="0" onclick=\'handleAction(' + JSON.stringify(item).replace(/'/g, "&apos;") + ')\'><img src="'+item.img+'"><div class="card-label">'+item.title+'</div></div>';
            }).join('');
        } else { document.getElementById('group-history').style.display = 'none'; }

        // 2. Render Favorites
        var favs = getFavs();
        var favGrid = document.getElementById('content-favs');
        if(favs.length > 0) {
            document.getElementById('group-favs').style.display = 'inline-flex';
            favGrid.innerHTML = favs.map(function(item) {
                return '<div class="card" tabindex="0" onclick=\'handleAction(' + JSON.stringify(item).replace(/'/g, "&apos;") + ')\'><img src="'+item.img+'"><div class="card-label">'+item.title+'</div></div>';
            }).join('');
        } else { document.getElementById('group-favs').style.display = 'none'; }
    }

    async function startSearch(q) {
        if(!q) return;
        var res = await fetch(PROXY(BASE + "/search?q=" + q));
        var doc = new DOMParser().parseFromString(await res.text(), 'text/html');
        var unique = new Map();
        doc.querySelectorAll('.entry-box, .subject-item, a[href*="/movie/"], a[href*="/series/"]').forEach(function(el) {
            var a = el.tagName === 'A' ? el : el.querySelector('a');
            var img = el.querySelector('img');
            if(a && img) {
                var link = a.href.indexOf('http') !== -1 ? a.href : BASE + a.getAttribute('href');
                if(!unique.has(link)) unique.set(link, { title: img.alt, link: link, img: img.dataset.src || img.src, isSeries: link.indexOf('/series/') !== -1 });
            }
        });
        document.getElementById('group-search').style.display = 'inline-flex';
        document.getElementById('content-search').innerHTML = Array.from(unique.values()).map(function(item) {
            return '<div class="card" tabindex="0" onclick=\'handleAction(' + JSON.stringify(item).replace(/'/g, "&apos;") + ')\'><img src="'+item.img+'"><div class="card-label">'+item.title+'</div></div>';
        }).join('');
        document.getElementById('content-search').querySelector('.card').focus();
    }

    async function loadEpisodes(item) {
        state.currentSeries = item;
        document.getElementById('series-title').innerText = item.title;
        document.getElementById('fav-btn').style.display = 'block';
        updateFavBtnUI();
        
        var res = await fetch(PROXY(item.link));
        var doc = new DOMParser().parseFromString(await res.text(), 'text/html');
        var uniqueEps = new Map();
        doc.querySelectorAll('a[href*="/episode/"]').forEach(function(a) {
            var link = a.href.indexOf('http') !== -1 ? a.href : BASE + a.getAttribute('href');
            if(!uniqueEps.has(link)) uniqueEps.set(link, { title: a.innerText.trim(), link: link, img: item.img });
        });
        
        document.getElementById('episode-list').innerHTML = Array.from(uniqueEps.values()).map(function(ep) {
            return '<div class="ep-item" tabindex="0" onclick=\'fetchAndPlay(' + JSON.stringify(ep).replace(/'/g, "&apos;") + ')\'>'+ep.title+'</div>';
        }).join('');
    }

    async function fetchAndPlay(item, title_manual) {
        var link = item.link;
        var title = title_manual || item.title;
        state.currentLink = link;
        document.getElementById('video-title').innerText = "جاري جلب الرابط...";
        document.getElementById('resume-ui').style.display = 'none';
        video.pause();

        try {
            var html = await (await fetch(PROXY(link))).text();
            var m = html.match(/go\.ak\.sv\/link\/([a-zA-Z0-9]+)/);
            var dl = await (await fetch(PROXY(link.replace('/episode/', '/download/'+m[1]+'/')))).text();
            var mp4 = new DOMParser().parseFromString(dl, 'text/html').querySelector('a[href*=".mp4"]');
            
            if(mp4) {
                video.src = mp4.href;
                document.getElementById('video-title').innerText = title;
                
                // Track History
                updateGlobalHistory(item);

                // Check Resume
                var hList = getFullHist();
                var record = hList.find(function(x){ return x.link === link; });
                if(record && record.pos > 10) {
                    state.savedPos = record.pos;
                    document.getElementById('resume-msg').innerText = "تم الوصول إلى الدقيقة " + Math.floor(record.pos/60);
                    document.getElementById('resume-ui').style.display = 'flex';
                    document.getElementById('resume-ui').querySelector('button').focus();
                } else { video.play(); }
            }
        } catch(e) { console.error(e); }
    }

    function updateGlobalHistory(item) {
        var h = getFullHist();
        // Remove duplicate
        h = h.filter(function(x) { return x.link !== item.link; });
        // Add to top
        h.unshift({ title: item.title, link: item.link, img: item.img, pos: 0, ts: Date.now() });
        localStorage.setItem(HIST_KEY, JSON.stringify(h.slice(0, 20)));
        refreshDiscoveryArea();
    }

    function confirmResume(yes) {
        document.getElementById('resume-ui').style.display = 'none';
        if(yes) video.currentTime = state.savedPos;
        video.play();
        video.focus();
    }

    function handleFavoriteAction() {
        var favs = getFavs();
        var index = favs.findIndex(function(f) { return f.link === state.currentSeries.link; });
        if(index > -1) favs.splice(index, 1); else favs.push(state.currentSeries);
        localStorage.setItem(FAV_KEY, JSON.stringify(favs));
        updateFavBtnUI();
        refreshDiscoveryArea();
    }

    function updateFavBtnUI() {
        var isFav = getFavs().some(function(f) { return f.link === state.currentSeries.link; });
        document.getElementById('fav-icon').className = isFav ? "fas fa-heart" : "far fa-heart";
        document.getElementById('fav-btn').style.background = isFav ? "#e50914" : "#333";
    }

    function handleAction(i) { if(i.isSeries) loadEpisodes(i); else fetchAndPlay(i); }
    
    // Auto-save progress into the specific history object
    setInterval(function(){
        if(state.currentLink && !video.paused) {
            var h = getFullHist();
            var record = h.find(function(x){ return x.link === state.currentLink; });
            if(record) {
                record.pos = Math.floor(video.currentTime);
                localStorage.setItem(HIST_KEY, JSON.stringify(h));
            }
        }
    }, 10000);

    document.getElementById('search-input').onkeydown = function(e) { if(e.key==='Enter') startSearch(this.value); };
    window.onload = refreshDiscoveryArea;
</script>
</body>
</html>
