<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Android TV JS Debugger</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #121212;
            color: white;
            font-family: sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* The "App" Area */
        #app-viewport {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-bottom: 2px solid #444;
        }

        .button {
            padding: 20px 40px;
            background: #007bff;
            border: none;
            color: white;
            font-size: 20px;
            cursor: pointer;
            border-radius: 8px;
        }

        .button:focus {
            background: #28a745;
            outline: 5px solid white;
        }

        /* The "Debug" Area */
        #debug-console {
            height: 40%;
            background: #000;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            overflow-y: auto;
            padding: 10px;
            box-sizing: border-box;
        }

        .log-entry { margin-bottom: 4px; border-bottom: 1px solid #222; }
        .log-error { color: #ff4444; font-weight: bold; }
        .log-warn { color: #ffbb33; }
    </style>
</head>
<body>

    <div id="app-viewport">
        <h1>TV JS Tester</h1>
        <p>Use your Remote (OK/Enter) on the button below:</p>
        <button id="test-btn" class="button">Click Me / Press OK</button>
    </div>

    <div id="debug-console">
        <div class="log-entry">[System] Console Initialized...</div>
    </div>

    <script>
        // 1. VISUAL LOGGER SETUP
        // Using var for legacy TV compatibility
        var consoleElement = document.getElementById('debug-console');

        function screenLog(message, type) {
            var entry = document.createElement('div');
            entry.className = 'log-entry' + (type ? ' log-' + type : '');
            entry.innerText = '[' + new Date().toLocaleTimeString() + '] ' + message;
            consoleElement.appendChild(entry);
            consoleElement.scrollTop = consoleElement.scrollHeight;
        }

        // 2. CATCH GLOBAL ERRORS (The "Why is it not working" catcher)
        window.onerror = function(msg, url, lineNo, columnNo, error) {
            var errorDetail = msg + ' (Line: ' + lineNo + ')';
            screenLog('RUNTIME ERROR: ' + errorDetail, 'error');
            return false;
        };

        // 3. OVERRIDE STANDARD LOGS
        var originalLog = console.log;
        console.log = function() {
            var args = Array.prototype.slice.call(arguments);
            screenLog(args.join(' '));
            originalLog.apply(console, args);
        };

        // 4. TEST LOGIC
        var btn = document.getElementById('test-btn');
        
        // Focus the button automatically for TV Remote usage
        btn.focus();

        btn.onclick = function() {
            console.log("Button Clicked via Mouse/Touch!");
        };

        // Standard TV Remote "OK" button listener
        window.addEventListener('keydown', function(e) {
            console.log("Key Pressed. Code: " + e.keyCode);
            
            // KeyCode 13 is usually "Enter/OK"
            if (e.keyCode === 13) {
                console.log("OK/Enter Pressed!");
                triggerTestError();
            }
        });

        function triggerTestError() {
            console.log("Attempting to call a non-existent function to test error catching...");
            // This will trigger window.onerror
            nonExistentFunction();
        }

        console.log("Ready! Use your remote to interact.");
    </script>
</body>
</html>
