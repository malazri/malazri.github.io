<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AlAzri TV - Debug Fix</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { --primary-red: #e50914; --bg-dark: #0a0a0a; --card-w: 160px; --card-h: 100px; }
        body { background-color: var(--bg-dark); color: white; font-family: sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

        #tv-debug {
            position: fixed; bottom: 0; left: 0; width: 100%; height: 150px;
            background: rgba(0,0,0,0.95); color: #00ff00; font-family: monospace;
            font-size: 12px; z-index: 9999; overflow-y: auto; border-top: 3px solid var(--primary-red);
            padding: 10px; pointer-events: none; box-sizing: border-box;
        }

        .fixed-header { position: fixed; top: 0; left: 0; right: 0; z-index: 3000; background: #000; padding: 12px 4%; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222; }
        .brand { color: var(--primary-red); font-weight: 900; font-size: 1.5rem; outline: none; cursor: pointer; }
        
        .brand:focus, .card:focus, .btn-auth:focus, .btn-google:focus { 
            outline: 4px solid white !important; transform: scale(1.05); background: rgba(255,255,255,0.2);
        }

        .content-area { flex: 1; overflow-y: auto; padding: 100px 20px 170px 20px; }
        .row-title { font-size: 1.1rem; font-weight: bold; border-right: 4px solid var(--primary-red); padding-right: 10px; margin-bottom: 10px; }
        .row-content { display: flex; gap: 15px; overflow-x: auto; padding: 10px 5px; }

        .card { min-width: var(--card-w); height: var(--card-h); background: #1a1a1a; border-radius: 8px; position: relative; cursor: pointer; flex-shrink: 0; outline: none; }
        .card img { width: 100%; height: 100%; object-fit: cover; border-radius: 8px; }
        .card-label { position: absolute; bottom: 0; width: 100%; background: rgba(0,0,0,0.8); font-size: 0.75rem; text-align: center; padding: 5px; }
    </style>
</head>
<body>

<div id="tv-debug">
    <div>[System] Starting Bootstrap...</div>
</div>

<div class="fixed-header">
    <div class="brand" tabindex="1" onclick="location.reload()">ALAZRI</div>
    <div class="header-actions">
        <button id="google-btn" tabindex="2" onclick="loginWithGoogle()" style="padding:10px 20px; background:white; color:black; font-weight:bold; border-radius:5px;">دخول بجوجل</button>
        <button id="logout-btn" tabindex="3" onclick="handleLogout()" style="display:none; padding:10px 20px; background:red; color:white; font-weight:bold; border-radius:5px;">خروج</button>
    </div>
</div>

<main class="content-area">
    <div class="row">
        <div class="row-title">الحلقات المقترحة</div>
        <div class="row-content" id="grid-main"></div>
    </div>
</main>

<script>
    // 1. نظام التسجيل الفوري
    var debugLog = document.getElementById('tv-debug');
    function log(msg, color) {
        var d = document.createElement('div');
        d.style.color = color || '#00ff00';
        d.innerText = '[' + new Date().toLocaleTimeString() + '] ' + msg;
        debugLog.appendChild(d);
        debugLog.scrollTop = debugLog.scrollHeight;
    }

    // 2. التحقق من تحميل المكتبات
    window.onload = function() {
        log("Checking Supabase Library...");
        if (typeof supabase === 'undefined') {
            log("FAILED: Supabase script not loaded. Trying backup source...", "#ff4444");
            loadBackupScript();
        } else {
            log("SUCCESS: Supabase is ready.");
            initApp();
        }
    };

    function loadBackupScript() {
        var script = document.createElement('script');
        script.src = "https://unpkg.com/@supabase/supabase-js@2.48.1/dist/umd/supabase.js";
        script.onload = function() {
            log("Backup source loaded successfully!");
            initApp();
        };
        script.onerror = function() {
            log("FATAL ERROR: All sources failed. Check TV Internet or Proxy.", "#ff0000");
        };
        document.head.appendChild(script);
    }

    // 3. إعدادات قاعدة البيانات
    var SB_URL = "https://hksxehxhdlzqmzrqspjc.supabase.co";
    var SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imhrc3hlaHhoZGx6cW16cnFzcGpjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE2NTI2MzYsImV4cCI6MjA4NzIyODYzNn0.IrMUz0wss2qoJEXqD6Q2hlXa5J13i-_2VYxAUM_R5tY";
    var db = null;

    function initApp() {
        try {
            db = supabase.createClient(SB_URL, SB_KEY);
            log("Database client created.");
            checkUser();
        } catch (e) {
            log("Init Error: " + e.message, "#ff4444");
        }

        // بطاقة اختبار للتأكد من أن الشاشة تعمل
        var grid = document.getElementById('grid-main');
        grid.innerHTML = '<div class="card" tabindex="10" onclick="log(\'Card clicked!\')"><img src="https://via.placeholder.com/160x100/333/fff?text=Test"><div class="card-label">اختبار المحتوى</div></div>';
    }

    // 4. وظائف الهوية
    window.loginWithGoogle = function() {
        if (!db) { log("Error: Database not ready", "#ff4444"); return; }
        log("Redirecting to Auth...");
        db.auth.signInWithOAuth({
            provider: 'google',
            options: { redirectTo: window.location.href }
        }).then(function(res) {
            if (res.error) log("Login Error: " + res.error.message, "#ff4444");
        });
    };

    window.handleLogout = function() {
        db.auth.signOut().then(function() { location.reload(); });
    };

    function checkUser() {
        db.auth.getSession().then(function(res) {
            if (res.data.session) {
                log("Logged in as: " + res.data.session.user.email);
                document.getElementById('google-btn').style.display = 'none';
                document.getElementById('logout-btn').style.display = 'block';
            } else {
                log("User: Guest");
            }
        });
    }

    // تتبع أخطاء المتصفح العامة
    window.onerror = function(m, u, l) { log("Runtime Err: " + m + " (Line " + l + ")", "#ff4444"); };
</script>

</body>
</html>
