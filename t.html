<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AlAzri TV - Debug Mode</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { --primary-red: #e50914; --bg-dark: #0a0a0a; --card-w: 160px; --card-h: 100px; }
        
        body { background-color: var(--bg-dark); color: white; font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

        /* DEBUG CONSOLE - يظهر دائماً */
        #tv-debug {
            position: fixed; bottom: 0; left: 0; width: 100%; height: 100px;
            background: rgba(0, 0, 0, 0.9); color: #00ff00; font-family: monospace;
            font-size: 11px; z-index: 9999; overflow-y: auto; border-top: 2px solid #e50914;
            padding: 5px; pointer-events: none;
        }

        .fixed-header { 
            position: fixed; top: 0; left: 0; right: 0; z-index: 3000; 
            background: #000; padding: 12px 4%; 
            display: flex; justify-content: space-between; align-items: center; 
            border-bottom: 1px solid #222;
        }

        .brand { color: var(--primary-red); font-weight: 900; font-size: 1.5rem; cursor: pointer; outline: none; }

        /* تنسيق التركيز للمتصفحات (الريموت كنترول) */
        .card:focus, .brand:focus, .header-icon:focus, .btn-auth:focus, .btn-google:focus {
            outline: 4px solid white !important;
            transform: scale(1.05);
            z-index: 10;
        }

        .content-area { flex: 1; overflow-y: auto; padding: 80px 20px 110px 20px; }

        .row { display: none; margin-bottom: 30px; }
        .row.visible { display: block; }
        .row-title { font-size: 1.1rem; font-weight: bold; border-right: 4px solid var(--primary-red); padding-right: 10px; }
        .row-content { display: flex; gap: 15px; overflow-x: auto; padding: 10px 5px; }

        .card { min-width: var(--card-w); height: var(--card-h); background: #1a1a1a; border-radius: 8px; position: relative; cursor: pointer; flex-shrink: 0; outline: none; border: 2px solid transparent; }
        .card img { width: 100%; height: 100%; object-fit: cover; border-radius: 8px; }
        .card-label { position: absolute; bottom: 0; width: 100%; background: rgba(0,0,0,0.8); font-size: 0.7rem; text-align: center; padding: 5px; }

        #player-container { display: none; width: 100%; max-width: 1000px; margin: 0 auto 30px auto; background: #000; border-radius: 12px; overflow: hidden; border: 1px solid #333; }
        video { width: 100%; aspect-ratio: 16/9; outline: none; }
    </style>
</head>
<body>

<div id="tv-debug">
    <div>[System] Debugger Active...</div>
</div>

<div class="fixed-header">
    <div class="brand" tabindex="1" onclick="location.reload()">ALAZRI</div>
    <div class="header-actions">
        <i class="fas fa-search header-icon" tabindex="2" onclick="toggleSearch()"></i>
        <button class="btn-google" id="google-btn" tabindex="3" onclick="loginWithGoogle()">دخول</button>
    </div>
</div>

<main class="content-area">
    <div class="row" id="row-search">
        <div class="row-header">
            <div class="row-title">نتائج البحث</div>
        </div>
        <div class="row-content" id="grid-search"></div>
    </div>

    <div class="row visible" id="row-episodes">
        <div class="row-title" id="episodes-label">الحلقات</div>
        <div class="row-content" id="grid-episodes"></div>
    </div>

    <div id="player-container">
        <video id="main-video" controls tabindex="10"></video>
    </div>
</main>

<script>
    // --- 1. DEBUG LOGIC ---
    var debugBox = document.getElementById('tv-debug');
    function log(msg, color) {
        var div = document.createElement('div');
        div.style.color = color || '#00ff00';
        div.innerText = '[' + new Date().toLocaleTimeString() + '] ' + msg;
        debugBox.appendChild(div);
        debugBox.scrollTop = debugBox.scrollHeight;
    }

    // Capture standard logs
    var oldLog = console.log;
    console.log = function() {
        var args = Array.prototype.slice.call(arguments);
        log(args.join(' '));
        oldLog.apply(console, args);
    };

    window.onerror = function(msg, url, line) {
        log("ERROR: " + msg + " (Line: " + line + ")", "#ff4444");
        return false;
    };

    // --- 2. TV NAVIGATION (D-PAD) ---
    document.addEventListener('keydown', function(e) {
        var active = document.activeElement;
        log("Key: " + e.keyCode + " | Focus: " + active.tagName);

        if (e.keyCode === 13) { // Enter
            if(active) active.click();
        }
        
        // الانتقال التلقائي البسيط بالمتصفح يعمل بـ Tab، 
        // لكن في التلفاز يفضل استخدام الأسهم لتغيير الـ Focus
    });

    // --- 3. APP LOGIC ---
    var SB_URL = "https://hksxehxhdlzqmzrqspjc.supabase.co";
    var SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imhrc3hlaHhoZGx6cW16cnFzcGpjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE2NTI2MzYsImV4cCI6MjA4NzIyODYzNn0.IrMUz0wss2qoJEXqD6Q2hlXa5J13i-_2VYxAUM_R5tY";
    var db = supabase.createClient(SB_URL, SB_KEY);
    var PROXY = function(url) { return "https://corsproxy.io/?" + encodeURIComponent(url); };
    var BASE = "https://ak.sv";

    function fetchAndPlay(link, title) {
        log("Fetching link: " + title);
        document.getElementById('player-container').style.display = 'block';
        var videoElem = document.getElementById('main-video');
        
        fetch(PROXY(link))
            .then(function(res) { return res.text(); })
            .then(function(html) {
                log("HTML Loaded. Searching for source...");
                // استخراج الرابط بطريقة متوافقة مع المتصفحات القديمة
                var match = html.match(/go\.ak\.sv\/link\/([a-zA-Z0-9]+)/);
                if(match) {
                    log("ID Found: " + match[1]);
                    // تكملة منطق التشغيل هنا
                } else {
                    log("Failed to find video source", "#ffbb33");
                }
            })
            .catch(function(err) { log("Fetch error: " + err, "#ff4444"); });
    }

    // تهيئة البيانات التجريبية
    function init() {
        log("AlAzri TV Dashboard Ready.");
        // إضافة tabindex للعناصر لضمان قابليتها للتركيز بالريموت
        var grid = document.getElementById('grid-episodes');
        grid.innerHTML = '<div class="card" tabindex="5" onclick="log(\'Clicked!\')"><img src="https://via.placeholder.com/160x100"><div class="card-label">حلقة تجريبية</div></div>';
    }

    init();
</script>

</body>
</html>
