<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlAzri TV v1.8</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary-red: #e50914; --bg-dark: #050505; --panel-bg: #111; --card-w: 130px; --card-h: 185px; }
        body { background-color: var(--bg-dark); color: white; font-family: 'Segoe UI', sans-serif; margin: 0; overflow: hidden; height: 100vh; display: grid; grid-template-rows: 65px 200px 1fr; grid-template-columns: 300px 1fr; }

        header { grid-row: 1; grid-column: 1 / span 2; background: #000; display: flex; align-items: center; justify-content: space-between; padding: 0 25px; border-bottom: 1px solid #222; }
        .brand { color: var(--primary-red); font-size: 1.6rem; font-weight: 900; }
        .header-controls { display: flex; gap: 15px; }
        .toggle-btn { cursor: pointer; color: #888; font-size: 0.85rem; padding: 6px 12px; border-radius: 4px; background: #222; border: none; }
        .toggle-btn.active { color: white; background: var(--primary-red); }
        .search-box { background: #222; border-radius: 5px; padding: 5px 12px; display: flex; align-items: center; width: 280px; }
        .search-box input { background: transparent; border: none; color: white; width: 100%; outline: none; }

        .top-section { grid-row: 2; grid-column: 1 / span 2; background: #0a0a0a; overflow-x: auto; white-space: nowrap; padding: 10px 20px; border-bottom: 1px solid #222; display: flex; gap: 20px; }
        .row-group { display: inline-flex; flex-direction: column; }
        .row-group-title { font-size: 0.8rem; color: #666; margin-bottom: 10px; font-weight: bold; border-right: 3px solid var(--primary-red); padding-right: 8px; }

        .side-section { grid-row: 3; grid-column: 1; background: var(--panel-bg); border-left: 1px solid #222; overflow-y: auto; padding: 15px; }
        .side-title { padding-bottom: 10px; font-weight: bold; color: var(--primary-red); border-bottom: 1px solid #333; margin-bottom: 15px; }

        .middle-section { grid-row: 3; grid-column: 2; background: #000; display: flex; flex-direction: column; position: relative; }
        #main-video { width: 100%; flex: 1; background: #000; }

        .player-status-bar { background: #000; padding: 12px 20px; display: flex; justify-content: space-between; font-size: 0.85rem; border-top: 1px solid #222; color: #aaa; }
        .player-status-bar b { color: var(--primary-red); }

        .ep-item { padding: 12px; background: #1a1a1a; margin-bottom: 8px; border-radius: 4px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .ep-item.active-ep { background: #300; border-right: 4px solid var(--primary-red); color: white; font-weight: bold; }
        .ep-item:focus { outline: 3px solid var(--primary-red); background: #333; }

        .card { display: inline-block; min-width: var(--card-w); height: var(--card-h); background: #1a1a1a; border-radius: 6px; overflow: hidden; cursor: pointer; position: relative; margin-left: 15px; flex-shrink: 0; }
        .card img { width: 100%; height: 100%; object-fit: cover; }
        .card-label { position: absolute; bottom: 0; width: 100%; background: rgba(0,0,0,0.85); font-size: 0.75rem; text-align: center; padding: 5px 0; white-space: normal; }

        .resume-overlay { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.9); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; display: none; }
        .btn-action { background: var(--primary-red); color: white; border: none; padding: 12px 20px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        
        *:focus { outline: 3px solid var(--primary-red) !important; }
    </style>
</head>
<body>

<header>
    <div class="brand">ALAZRI TV</div>
    <div class="header-controls">
        <button class="toggle-btn active" id="btn-hist" onclick="toggleRow('group-history', this)" tabindex="0">المتابعة</button>
        <button class="toggle-btn active" id="btn-fav" onclick="toggleRow('group-favs', this)" tabindex="0">المفضلة</button>
        <div class="search-box"><input type="text" id="search-input" placeholder="بحث عن فيلم/مسلسل..." tabindex="0"></div>
    </div>
</header>

<div class="top-section" id="discovery">
    <div class="row-group" id="group-history">
        <div class="row-group-title">واصل المشاهدة</div>
        <div id="content-history" style="display:flex;"></div>
    </div>
    <div class="row-group" id="group-favs">
        <div class="row-group-title">المفضلة</div>
        <div id="content-favs" style="display:flex;"></div>
    </div>
    <div class="row-group" id="group-search" style="display:none;">
        <div class="row-group-title">نتائج البحث</div>
        <div id="content-search" style="display:flex;"></div>
    </div>
</div>

<div class="side-section">
    <div class="side-title" id="series-title">اختر مسلسلاً</div>
    <button id="fav-btn" class="btn-action" style="display:none; width: 100%; margin-bottom:15px;" onclick="handleFavoriteAction()" tabindex="0">أضف للمفضلة</button>
    <div id="episode-list"></div>
</div>

<div class="middle-section">
    <video id="main-video" controls tabindex="0"></video>
    
    <div id="resume-ui" class="resume-overlay">
        <h2>إكمال المشاهدة؟</h2>
        <p id="resume-msg"></p>
        <div style="margin-top:15px;">
            <button class="btn-action" onclick="confirmResume(true)" tabindex="0">نعم، إكمال</button>
            <button class="btn-action" style="background:#444; margin-right:10px;" onclick="confirmResume(false)" tabindex="0">البدء من جديد</button>
        </div>
    </div>

    <div class="player-status-bar">
        <div><i class="fas fa-play"></i> <span id="v-title">جاهز</span></div>
        <div id="v-meta">آخر مشاهدة: -- | الموقف: --</div>
    </div>
</div>

<script>
    var PROXY = function(url) { return "https://corsproxy.io/?" + encodeURIComponent(url); };
    var BASE = "https://ak.sv";
    var state = { currentSeries: null, currentLink: null, savedPos: 0 };
    var video = document.getElementById('main-video');

    function getFavs() { return JSON.parse(localStorage.getItem('alazri_favs') || '[]'); }
    function getHist() { return JSON.parse(localStorage.getItem('alazri_hist') || '[]'); }

    // Restore Toggle Functionality
    function toggleRow(id, btn) {
        var el = document.getElementById(id);
        if(el.style.display === 'none') {
            el.style.display = 'inline-flex';
            btn.classList.add('active');
        } else {
            el.style.display = 'none';
            btn.classList.remove('active');
        }
    }

    function refreshTop() {
        var h = getHist();
        document.getElementById('content-history').innerHTML = h.slice(0, 10).map(i => 
            `<div class="card" tabindex="0" onclick='handleAction(${JSON.stringify(i).replace(/'/g, "&apos;")})'><img src="${i.img}"><div class="card-label">${i.title}</div></div>`
        ).join('');
        
        var f = getFavs();
        document.getElementById('content-favs').innerHTML = f.map(i => 
            `<div class="card" tabindex="0" onclick='handleAction(${JSON.stringify(i).replace(/'/g, "&apos;")})'><img src="${i.img}"><div class="card-label">${i.title}</div></div>`
        ).join('');
    }

    async function startSearch(q) {
        if(!q) return;
        var res = await fetch(PROXY(BASE + "/search?q=" + q));
        var doc = new DOMParser().parseFromString(await res.text(), 'text/html');
        var unique = new Map();
        doc.querySelectorAll('a[href*="/movie/"], a[href*="/series/"]').forEach(a => {
            var img = a.querySelector('img');
            if(img) {
                var link = a.href.includes('http') ? a.href : BASE + a.getAttribute('href');
                if(!unique.has(link)) unique.set(link, { title: img.alt, link: link, img: img.dataset.src || img.src, isSeries: link.includes('/series/') });
            }
        });
        document.getElementById('group-search').style.display = 'inline-flex';
        document.getElementById('content-search').innerHTML = Array.from(unique.values()).map(i => 
            `<div class="card" tabindex="0" onclick='handleAction(${JSON.stringify(i).replace(/'/g, "&apos;")})'><img src="${i.img}"><div class="card-label">${i.title}</div></div>`
        ).join('');
    }

    async function loadEpisodes(item) {
        state.currentSeries = item;
        document.getElementById('series-title').innerText = item.title;
        document.getElementById('fav-btn').style.display = 'block';
        updateFavBtnUI();

        var res = await fetch(PROXY(item.link));
        var doc = new DOMParser().parseFromString(await res.text(), 'text/html');
        var uniqueEps = new Map();
        doc.querySelectorAll('a[href*="/episode/"]').forEach(a => {
            var link = a.href.includes('http') ? a.href : BASE + a.getAttribute('href');
            if(!uniqueEps.has(link)) uniqueEps.set(link, { title: a.innerText.trim(), link: link, img: item.img });
        });

        renderEpList(Array.from(uniqueEps.values()));
    }

    function renderEpList(eps) {
        document.getElementById('episode-list').innerHTML = eps.map(ep => {
            var active = state.currentLink === ep.link;
            return `<div class="ep-item ${active?'active-ep':''}" tabindex="0" onclick='fetchAndPlay(${JSON.stringify(ep).replace(/'/g, "&apos;")})'>
                <span>${ep.title}</span> ${active?'<i class="fas fa-play-circle"></i>':''}
            </div>`;
        }).join('');
    }

    async function fetchAndPlay(item) {
        state.currentLink = item.link;
        document.getElementById('v-title').innerText = item.title;
        document.getElementById('resume-ui').style.display = 'none';
        video.pause();

        // Update Metadata UI
        var record = getHist().find(x => x.link === item.link);
        if(record) {
            var d = new Date(record.ts).toLocaleDateString('ar-EG');
            document.getElementById('v-meta').innerHTML = `آخر مشاهدة: <b>${d}</b> | الموقف: <b>${Math.floor(record.pos/60)} دقيقة</b>`;
        }

        try {
            var html = await (await fetch(PROXY(item.link))).text();
            var m = html.match(/go\.ak\.sv\/link\/([a-zA-Z0-9]+)/);
            var dl = await (await fetch(PROXY(item.link.replace('/episode/', '/download/'+m[1]+'/')))).text();
            var mp4 = new DOMParser().parseFromString(dl, 'text/html').querySelector('a[href*=".mp4"]');
            
            if(mp4) {
                video.src = mp4.href;
                saveToHistory(item);
                if(record && record.pos > 15) {
                    state.savedPos = record.pos;
                    document.getElementById('resume-msg').innerText = "لقد شاهدت " + Math.floor(record.pos/60) + " دقيقة سابقاً.";
                    document.getElementById('resume-ui').style.display = 'flex';
                } else { video.play(); }
                if(state.currentSeries) renderEpList([]); // Force refresh active state
                loadEpisodes(state.currentSeries || item);
            }
        } catch(e) { console.error(e); }
    }

    function saveToHistory(item) {
        var h = getHist().filter(x => x.link !== item.link);
        h.unshift({ title: item.title, link: item.link, img: item.img, pos: 0, ts: Date.now() });
        localStorage.setItem('alazri_hist', JSON.stringify(h.slice(0, 20)));
        refreshTop();
    }

    function confirmResume(yes) {
        document.getElementById('resume-ui').style.display = 'none';
        if(yes) video.currentTime = state.savedPos;
        video.play();
    }

    function handleFavoriteAction() {
        var favs = getFavs();
        var idx = favs.findIndex(f => f.link === state.currentSeries.link);
        if(idx > -1) favs.splice(idx, 1); else favs.push(state.currentSeries);
        localStorage.setItem('alazri_favs', JSON.stringify(favs));
        updateFavBtnUI();
        refreshTop();
    }

    function updateFavBtnUI() {
        var isF = getFavs().some(f => f.link === state.currentSeries.link);
        document.getElementById('fav-btn').innerText = isF ? "إزالة من المفضلة" : "أضف للمفضلة";
        document.getElementById('fav-btn').style.background = isF ? "#444" : var(--primary-red);
    }

    function handleAction(i) { if(i.isSeries) loadEpisodes(i); else fetchAndPlay(i); }

    // Auto-Save Loop
    setInterval(() => {
        if(state.currentLink && !video.paused) {
            var h = getHist();
            var r = h.find(x => x.link === state.currentLink);
            if(r) { r.pos = Math.floor(video.currentTime); r.ts = Date.now(); localStorage.setItem('alazri_hist', JSON.stringify(h)); }
        }
    }, 10000);

    // Remote Mapping
    window.addEventListener('keydown', (e) => {
        if(e.keyCode === 32) { video.paused ? video.play() : video.pause(); e.preventDefault(); }
        if(e.keyCode === 37) video.currentTime -= 15;
        if(e.keyCode === 39) video.currentTime += 15;
    });

    document.getElementById('search-input').onkeydown = e => { if(e.key==='Enter') startSearch(e.target.value); };
    window.onload = refreshTop;
</script>
</body>
</html>
