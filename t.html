<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AlAzri TV - Debug Mode</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { --primary-red: #e50914; --bg-dark: #0a0a0a; --card-w: 220px; --card-h: 130px; }
        
        body { background-color: var(--bg-dark); color: white; font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

        /* DEBUGGER STYLE */
        #tv-console {
            position: fixed; bottom: 0; left: 0; width: 100%; height: 120px;
            background: rgba(0,0,0,0.9); color: #0f0; font-family: monospace;
            font-size: 12px; z-index: 9999; overflow-y: auto; border-top: 2px solid #444;
            display: none; padding: 10px; pointer-events: none;
        }

        .fixed-header { 
            position: fixed; top: 0; left: 0; right: 0; z-index: 3000; 
            background: #000; padding: 12px 4%; 
            display: flex; justify-content: space-between; align-items: center; 
            border-bottom: 1px solid #222;
        }

        .brand { color: var(--primary-red); font-weight: 900; font-size: 1.5rem; outline: none; }
        .brand:focus { color: white; transform: scale(1.1); }

        .content-area { flex: 1; overflow-y: auto; padding: 100px 20px 150px 20px; }

        .row { display: none; margin-bottom: 30px; }
        .row.visible { display: block; }
        .row-content { display: flex; gap: 20px; overflow-x: hidden; padding: 20px 5px; }

        /* TV FOCUS STYLE */
        .card { 
            min-width: var(--card-w); height: var(--card-h); background: #1a1a1a; 
            border-radius: 8px; position: relative; cursor: pointer; flex-shrink: 0; 
            border: 4px solid transparent; transition: all 0.2s ease;
            outline: none; /* Hide default browser focus */
        }
        .card.focused { 
            border-color: white; transform: scale(1.1); z-index: 10;
            box-shadow: 0 0 20px rgba(255,255,255,0.4);
        }
        
        .card img { width: 100%; height: 100%; object-fit: cover; border-radius: 4px; }
        .card-label { position: absolute; bottom: 0; width: 100%; background: rgba(0,0,0,0.8); font-size: 0.8rem; text-align: center; padding: 5px; }

        #player-container { display: none; width: 100%; max-width: 1000px; margin: 0 auto 30px auto; background: #000; border-radius: 12px; overflow: hidden; }
        video { width: 100%; aspect-ratio: 16/9; outline: none; }
        video:focus { border: 3px solid var(--primary-red); }
    </style>
</head>
<body>

<div id="tv-console"></div>

<div class="fixed-header">
    <div class="brand" tabindex="1">ALAZRI TV</div>
    <div class="header-actions" style="color:#aaa; font-size: 0.8rem;">
        اضغط (Menu/Blue) للديبيج | استخدم الأزرار للتنقل
    </div>
</div>

<main class="content-area" id="main-scroll">
    <div class="row" id="row-search">
        <div class="row-title">نتائج البحث</div>
        <div class="row-content" id="grid-search"></div>
    </div>

    <div class="row visible" id="row-episodes">
        <div class="row-title" id="episodes-label">الحلقات الأخيرة</div>
        <div class="row-content" id="grid-episodes"></div>
    </div>

    <div id="player-container">
        <video id="main-video" controls tabindex="10"></video>
    </div>
</main>

<script>
    // --- 1. TV DEBUGGER LOGIC ---
    var consoleEl = document.getElementById('tv-console');
    function tvLog(msg, isErr) {
        var line = document.createElement('div');
        line.style.color = isErr ? '#ff4444' : '#0f0';
        line.innerText = '[' + new Date().toLocaleTimeString() + '] ' + msg;
        consoleEl.appendChild(line);
        consoleEl.scrollTop = consoleEl.scrollHeight;
    }

    // Capture all console logs and errors
    var oldLog = console.log;
    console.log = function() { tvLog(Array.prototype.slice.call(arguments).join(' ')); oldLog.apply(console, arguments); };
    window.onerror = function(m, u, l) { tvLog("ERR: " + m + " Line: " + l, true); return false; };

    // --- 2. SPATIAL NAVIGATION (D-PAD) ---
    var currentFocusIndex = 0;
    var focusableElements = [];

    function updateFocusable() {
        // Collect all visible cards and interactive elements
        var cards = document.querySelectorAll('.card, .brand, video');
        focusableElements = Array.prototype.slice.call(cards).filter(function(el) {
            return el.offsetParent !== null; // Only visible elements
        });
    }

    document.addEventListener('keydown', function(e) {
        // Toggle Console with a key (usually 'Menu' or a specific code on TV)
        if (e.keyCode === 406 || e.key === 'F9') { // Example codes
            consoleEl.style.display = consoleEl.style.display === 'none' ? 'block' : 'none';
        }

        updateFocusable();
        var oldIndex = currentFocusIndex;

        if (e.keyCode === 39) currentFocusIndex++; // Right
        if (e.keyCode === 37) currentFocusIndex--; // Left
        if (e.keyCode === 40) currentFocusIndex += 4; // Down (approx row change)
        if (e.keyCode === 38) currentFocusIndex -= 4; // Up

        // Boundaries
        if (currentFocusIndex < 0) currentFocusIndex = 0;
        if (currentFocusIndex >= focusableElements.length) currentFocusIndex = focusableElements.length - 1;

        // Apply Focus
        focusableElements.forEach(function(el) { el.classList.remove('focused'); });
        var activeEl = focusableElements[currentFocusIndex];
        if (activeEl) {
            activeEl.classList.add('focused');
            activeEl.focus();
            activeEl.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'center' });
        }

        // Trigger Click on Enter
        if (e.keyCode === 13) {
            console.log("Enter pressed on: " + activeEl.className);
            activeEl.click();
        }
    });

    // --- 3. UPDATED CORE LOGIC (ES5 COMPATIBLE) ---
    var SB_URL = "https://hksxehxhdlzqmzrqspjc.supabase.co";
    var SB_KEY = "..."; // Keep your key
    var db = supabase.createClient(SB_URL, SB_KEY);
    var PROXY = function(url) { return "https://corsproxy.io/?" + encodeURIComponent(url); };

    function fetchAndPlay(link, title) {
        console.log("Attempting to play: " + title);
        document.getElementById('player-container').style.display = 'block';
        var video = document.getElementById('main-video');
        
        fetch(PROXY(link))
            .then(function(res) { return res.text(); })
            .then(function(html) {
                // Simplified regex for older TV browsers
                var idMatch = html.match(/link\/([a-zA-Z0-9]+)/);
                if (idMatch) {
                    console.log("Found Video ID: " + idMatch[1]);
                    // Continue your download logic here...
                } else {
                    console.log("Video ID not found in HTML");
                }
            })
            .catch(function(err) { console.log("Fetch Fail: " + err); });
    }

    // Initialize
    console.log("App Started. Controller ready.");
    updateFocusable();
</script>
</body>
</html>
