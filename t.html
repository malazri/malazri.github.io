<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AlAzri TV v1.7</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary-red: #e50914; --bg-dark: #050505; --panel-bg: #0f0f0f; --card-w: 120px; --card-h: 170px; }
        body { background-color: var(--bg-dark); color: white; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; overflow: hidden; height: 100vh; display: grid; grid-template-rows: 60px 210px 1fr; grid-template-columns: 320px 1fr; }

        /* Full Screen Override */
        body.is-fullscreen { grid-template-rows: 0 0 1fr; grid-template-columns: 0 1fr; }
        body.is-fullscreen header, body.is-fullscreen .top-section, body.is-fullscreen .side-section { display: none !important; }

        *:focus { outline: 3px solid var(--primary-red) !important; transform: scale(1.02); z-index: 10; }

        header { grid-row: 1; grid-column: 1 / span 2; background: #000; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; border-bottom: 1px solid #222; }
        .brand { color: var(--primary-red); font-size: 1.5rem; font-weight: 900; }
        .header-controls { display: flex; gap: 15px; align-items: center; }
        .toggle-btn { cursor: pointer; color: #888; font-size: 0.8rem; padding: 5px 10px; border-radius: 4px; background: #1a1a1a; }
        .toggle-btn.active { color: white; background: var(--primary-red); }
        .search-box { background: #222; border-radius: 5px; padding: 5px 12px; display: flex; align-items: center; width: 250px; }
        .search-box input { background: transparent; border: none; color: white; width: 100%; outline: none; }

        .top-section { grid-row: 2; grid-column: 1 / span 2; background: #080808; overflow-x: auto; white-space: nowrap; padding: 10px; border-bottom: 1px solid #222; display: flex; gap: 20px; }
        .row-group { display: inline-flex; flex-direction: column; vertical-align: top; }
        .row-group-title { font-size: 0.8rem; color: #aaa; margin-bottom: 8px; font-weight: bold; border-right: 3px solid var(--primary-red); padding-right: 8px; }

        .side-section { grid-row: 3; grid-column: 1; background: var(--panel-bg); border-left: 1px solid #222; display: flex; flex-direction: column; overflow-y: auto; padding: 10px; }
        .side-title { padding: 8px; font-weight: bold; color: var(--primary-red); border-bottom: 1px solid #222; margin-bottom: 10px; }

        .middle-section { grid-row: 3; grid-column: 2; background: #000; position: relative; overflow: hidden; }
        #main-video { width: 100%; height: 100%; }

        /* Active Episode Styling */
        .ep-item { padding: 12px; background: #1a1a1a; margin-bottom: 8px; border-radius: 4px; cursor: pointer; font-size: 0.9rem; border-right: 4px solid transparent; display: flex; justify-content: space-between; align-items: center; }
        .ep-item.active-ep { border-right-color: var(--primary-red); background: #220000; color: var(--primary-red); font-weight: bold; }
        .ep-item:focus { border-right-color: var(--primary-red); background: #333; }

        /* HUD & Fullscreen Trigger */
        .player-hud-top { position: absolute; top: 0; left: 0; right: 0; padding: 20px; background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent); z-index: 5; display: flex; justify-content: space-between; }
        .fs-btn { background: rgba(255,255,255,0.1); border: none; color: white; padding: 8px; border-radius: 4px; cursor: pointer; }

        .resume-overlay { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.95); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; display: none; }
        .btn-action { background: var(--primary-red); color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-weight: bold; margin: 5px; }

        .card { display: inline-block; min-width: var(--card-w); height: var(--card-h); background: #1a1a1a; border-radius: 4px; overflow: hidden; cursor: pointer; position: relative; margin-left: 12px; }
        .card img { width: 100%; height: 100%; object-fit: cover; }
        .card-label { position: absolute; bottom: 0; width: 100%; background: rgba(0,0,0,0.8); font-size: 0.7rem; text-align: center; padding: 4px 0; }
    </style>
</head>
<body>

<header>
    <div class="brand">ALAZRI TV</div>
    <div class="header-controls">
        <div class="toggle-btn active" onclick="toggleRow('group-history')" tabindex="0">المتابعة</div>
        <div class="toggle-btn active" onclick="toggleRow('group-favs')" tabindex="0">المفضلة</div>
        <div class="search-box"><input type="text" id="search-input" placeholder="بحث..." tabindex="0"></div>
    </div>
</header>

<div class="top-section" id="discovery-area">
    <div class="row-group" id="group-history"><div class="row-group-title">واصل المشاهدة</div><div id="content-history" style="display:flex;"></div></div>
    <div class="row-group" id="group-favs"><div class="row-group-title">المفضلة</div><div id="content-favs" style="display:flex;"></div></div>
    <div class="row-group" id="group-search" style="display:none;"><div class="row-group-title">نتائج البحث</div><div id="content-search" style="display:flex;"></div></div>
</div>

<div class="side-section">
    <div class="side-title" id="series-title">قائمة الحلقات</div>
    <button id="fav-btn" class="btn-action" style="display:none; width: 100%; margin-bottom:10px;" onclick="handleFavoriteAction()" tabindex="0">أضف للمفضلة</button>
    <div id="episode-list"></div>
</div>

<div class="middle-section" id="middle-p">
    <div class="player-hud-top">
        <div id="video-title" style="font-size:1.2rem; font-weight:bold; color:var(--primary-red);">يرجى اختيار محتوى</div>
        <button class="fs-btn" onclick="toggleCinemaMode()" tabindex="0"><i class="fas fa-expand"></i> ملء الشاشة</button>
    </div>
    <video id="main-video" controls tabindex="0"></video>
    <div id="resume-ui" class="resume-overlay">
        <h2>إكمال المشاهدة؟</h2>
        <p id="resume-msg" style="color:#aaa;"></p>
        <button class="btn-action" onclick="confirmResume(true)" tabindex="0">إكمال</button>
        <button class="btn-action" style="background:#444" onclick="confirmResume(false)" tabindex="0">إلغاء</button>
    </div>
</div>

<script>
    var PROXY = function(url) { return "https://corsproxy.io/?" + encodeURIComponent(url); };
    var BASE = "https://ak.sv";
    var FAV_KEY = "alazri_favs_v2";
    var HIST_KEY = "alazri_full_hist_v2";
    var state = { currentSeries: null, currentLink: null, savedPos: 0 };
    var video = document.getElementById('main-video');

    function getFavs() { var d = localStorage.getItem(FAV_KEY); return d ? JSON.parse(d) : []; }
    function getFullHist() { var d = localStorage.getItem(HIST_KEY); return d ? JSON.parse(d) : []; }

    // --- Cinema Mode (Full Body Overlay) ---
    function toggleCinemaMode() {
        document.body.classList.toggle('is-fullscreen');
        var btn = document.querySelector('.fs-btn');
        btn.innerHTML = document.body.classList.contains('is-fullscreen') ? '<i class="fas fa-compress"></i> خروج' : '<i class="fas fa-expand"></i> ملء الشاشة';
        video.focus();
    }

    // --- Remote Control Mapping ---
    window.addEventListener('keydown', function(e) {
        if (!state.currentLink) return;
        switch(e.keyCode) {
            case 179: // Play/Pause Media Key
            case 32:  // Space
                video.paused ? video.play() : video.pause(); break;
            case 417: // Fast Forward
            case 39:  // Right Arrow
                video.currentTime += 15; break;
            case 412: // Rewind
            case 37:  // Left Arrow
                video.currentTime -= 15; break;
            case 461: // Back (WebOS/Tizen)
            case 27:  // Escape
                if(document.body.classList.contains('is-fullscreen')) toggleCinemaMode(); break;
        }
    });

    function refreshDiscoveryArea() {
        var h = getFullHist();
        document.getElementById('content-history').innerHTML = h.slice(0, 10).map(function(item) {
            return '<div class="card" tabindex="0" onclick=\'handleAction(' + JSON.stringify(item).replace(/'/g, "&apos;") + ')\'><img src="'+item.img+'"><div class="card-label">'+item.title+'</div></div>';
        }).join('');
        var f = getFavs();
        document.getElementById('content-favs').innerHTML = f.map(function(item) {
            return '<div class="card" tabindex="0" onclick=\'handleAction(' + JSON.stringify(item).replace(/'/g, "&apos;") + ')\'><img src="'+item.img+'"><div class="card-label">'+item.title+'</div></div>';
        }).join('');
    }

    async function startSearch(q) {
        if(!q) return;
        var res = await fetch(PROXY(BASE + "/search?q=" + q));
        var doc = new DOMParser().parseFromString(await res.text(), 'text/html');
        var unique = new Map();
        doc.querySelectorAll('.entry-box, .subject-item, a[href*="/movie/"], a[href*="/series/"]').forEach(function(el) {
            var a = el.tagName === 'A' ? el : el.querySelector('a');
            var img = el.querySelector('img');
            if(a && img) {
                var link = a.href.indexOf('http') !== -1 ? a.href : BASE + a.getAttribute('href');
                if(!unique.has(link)) unique.set(link, { title: img.alt, link: link, img: img.dataset.src || img.src, isSeries: link.indexOf('/series/') !== -1 });
            }
        });
        document.getElementById('group-search').style.display = 'inline-flex';
        document.getElementById('content-search').innerHTML = Array.from(unique.values()).map(function(item) {
            return '<div class="card" tabindex="0" onclick=\'handleAction(' + JSON.stringify(item).replace(/'/g, "&apos;") + ')\'><img src="'+item.img+'"><div class="card-label">'+item.title+'</div></div>';
        }).join('');
    }

    async function loadEpisodes(item) {
        state.currentSeries = item;
        document.getElementById('series-title').innerText = item.title;
        document.getElementById('fav-btn').style.display = 'block';
        var res = await fetch(PROXY(item.link));
        var doc = new DOMParser().parseFromString(await res.text(), 'text/html');
        var eps = [];
        doc.querySelectorAll('a[href*="/episode/"]').forEach(function(a) {
            var link = a.href.indexOf('http') !== -1 ? a.href : BASE + a.getAttribute('href');
            eps.push({ title: a.innerText.trim(), link: link, img: item.img });
        });
        renderEpisodeList(eps);
    }

    function renderEpisodeList(eps) {
        document.getElementById('episode-list').innerHTML = eps.map(function(ep) {
            var isActive = state.currentLink === ep.link;
            return '<div class="ep-item ' + (isActive ? 'active-ep' : '') + '" tabindex="0" onclick=\'fetchAndPlay(' + JSON.stringify(ep).replace(/'/g, "&apos;") + ')\'>' +
                   '<span>' + ep.title + '</span>' + (isActive ? '<i class="fas fa-play-circle"></i>' : '') + '</div>';
        }).join('');
    }

    async function fetchAndPlay(item) {
        state.currentLink = item.link;
        document.getElementById('video-title').innerText = item.title;
        document.getElementById('resume-ui').style.display = 'none';
        
        // Refresh UI to show playing icon
        if(state.currentSeries) loadEpisodes(state.currentSeries);

        try {
            var html = await (await fetch(PROXY(item.link))).text();
            var m = html.match(/go\.ak\.sv\/link\/([a-zA-Z0-9]+)/);
            var dl = await (await fetch(PROXY(item.link.replace('/episode/', '/download/'+m[1]+'/')))).text();
            var mp4 = new DOMParser().parseFromString(dl, 'text/html').querySelector('a[href*=".mp4"]');
            
            if(mp4) {
                video.src = mp4.href;
                updateGlobalHistory(item);
                var h = getFullHist();
                var record = h.find(function(x){ return x.link === item.link; });
                if(record && record.pos > 15) {
                    state.savedPos = record.pos;
                    document.getElementById('resume-msg').innerText = "متابعة من الدقيقة " + Math.floor(record.pos/60);
                    document.getElementById('resume-ui').style.display = 'flex';
                    document.getElementById('resume-ui').querySelector('button').focus();
                } else { video.play(); }
            }
        } catch(e) { console.error(e); }
    }

    function updateGlobalHistory(item) {
        var h = getFullHist();
        h = h.filter(function(x) { return x.link !== item.link; });
        h.unshift({ title: item.title, link: item.link, img: item.img, pos: 0, ts: Date.now() });
        localStorage.setItem(HIST_KEY, JSON.stringify(h.slice(0, 20)));
        refreshDiscoveryArea();
    }

    function confirmResume(yes) {
        document.getElementById('resume-ui').style.display = 'none';
        if(yes) video.currentTime = state.savedPos;
        video.play(); video.focus();
    }

    function handleAction(i) { if(i.isSeries) loadEpisodes(i); else fetchAndPlay(i); }
    document.getElementById('search-input').onkeydown = function(e) { if(e.key==='Enter') startSearch(this.value); };
    
    setInterval(function(){
        if(state.currentLink && !video.paused) {
            var h = getFullHist();
            var r = h.find(function(x){ return x.link === state.currentLink; });
            if(r) { r.pos = Math.floor(video.currentTime); localStorage.setItem(HIST_KEY, JSON.stringify(h)); }
        }
    }, 10000);

    window.onload = refreshDiscoveryArea;
</script>
</body>
</html>
