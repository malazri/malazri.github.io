<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Cup Live Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        /* Premium Stadium Gradient */
        .bg-stadium {
            background: radial-gradient(circle at top, #1e293b 0%, #0f172a 40%, #022c22 100%);
        }
        /* Premium Glassmorphism */
        .card-bg {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }
        /* Text Gradients */
        .text-gradient {
            background: linear-gradient(to right, #4ade80, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        /* --- WIDGET MODE OVERRIDES --- */
        body.widget-mode {
            background: transparent;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            margin: 0;
        }
        body.widget-mode #app-container {
            width: 100%;
            height: 100%;
            max-width: none;
            border-radius: 1.5rem;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
        }
        /* Separation logic between web views and widget views */
        body.widget-mode #web-app-view {
            display: none !important;
        }
        #widget-view {
            display: none;
        }
        body.widget-mode #widget-view {
            display: flex !important;
        }
        
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 antialiased selection:bg-green-500 selection:text-white">

    <div id="app-container" class="max-w-md mx-auto bg-stadium min-h-screen relative flex flex-col transition-all duration-300">
        
        <div id="web-app-view" class="flex flex-col h-full">
            <header class="flex items-center justify-between p-5 pt-8">
                <div>
                    <h1 class="text-2xl font-extrabold tracking-widest text-gradient">WORLD CUP</h1>
                    <p class="text-[10px] text-gray-400 uppercase tracking-widest mt-1">Live Tracker</p>
                </div>
                <div class="flex items-center gap-2 bg-gray-900/80 px-3 py-1.5 rounded-full border border-gray-700/50 shadow-inner">
                    <div id="sync-dot" class="w-2 h-2 rounded-full bg-yellow-500 animate-pulse"></div>
                    <span id="sync-indicator" class="text-[10px] font-semibold text-gray-300">Syncing...</span>
                </div>
            </header>

            <main class="flex-1 overflow-y-auto px-5 pb-6 space-y-6">
                <section id="countdown-section" class="card-bg rounded-2xl p-5 text-center transition-opacity duration-500 hidden">
                    <h2 class="text-[10px] font-bold text-green-400 mb-3 uppercase tracking-[0.2em]">Tournament Starts In</h2>
                    <div class="flex justify-center gap-3 text-center">
                        <div class="bg-gray-900/50 rounded-lg p-2 w-16">
                            <div id="cd-days" class="text-3xl font-extrabold">00</div>
                            <div class="text-[9px] text-gray-400 font-semibold tracking-wider mt-1">DAYS</div>
                        </div>
                        <div class="text-2xl font-bold text-gray-600 self-center pb-4">:</div>
                        <div class="bg-gray-900/50 rounded-lg p-2 w-16">
                            <div id="cd-hours" class="text-3xl font-extrabold">00</div>
                            <div class="text-[9px] text-gray-400 font-semibold tracking-wider mt-1">HRS</div>
                        </div>
                        <div class="text-2xl font-bold text-gray-600 self-center pb-4">:</div>
                        <div class="bg-gray-900/50 rounded-lg p-2 w-16">
                            <div id="cd-minutes" class="text-3xl font-extrabold">00</div>
                            <div class="text-[9px] text-gray-400 font-semibold tracking-wider mt-1">MIN</div>
                        </div>
                    </div>
                </section>

                <section id="live-match-container" class="card-bg rounded-2xl relative overflow-hidden">
                    <div class="p-5 text-center text-sm text-gray-400">Loading live arena...</div>
                </section>

                <section id="schedule-section" class="card-bg rounded-2xl p-3">
                    <div class="flex bg-gray-900/80 rounded-lg p-1 mb-4 border border-white/5 relative">
                        <button id="tab-upcoming" onclick="switchTab('upcoming')" class="flex-1 text-xs font-bold py-2 rounded-md transition-all text-white bg-gray-700/80 shadow border border-gray-600/50">Upcoming</button>
                        <button id="tab-played" onclick="switchTab('played')" class="flex-1 text-xs font-bold py-2 rounded-md transition-all text-gray-500 hover:text-gray-300">Played</button>
                    </div>
                    <div class="flex justify-between items-center mb-3 px-2">
                        <button id="btn-prev-day" onclick="prevDay()" class="text-gray-400 hover:text-white p-1 transition-colors"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg></button>
                        <span id="schedule-date" class="text-xs font-bold text-green-400 tracking-widest uppercase">Loading...</span>
                        <button id="btn-next-day" onclick="nextDay()" class="text-gray-400 hover:text-white p-1 transition-colors"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg></button>
                    </div>
                    <div id="schedule-list" class="space-y-1 min-h-[150px]">
                        <div class="text-center text-sm text-gray-500 py-6">Fetching matches...</div>
                    </div>
                </section>
            </main>
        </div>

        <main id="widget-view" class="flex-col h-full w-full p-4">
            
            <header class="flex items-center justify-between mb-3 flex-shrink-0">
                <h1 class="text-[13px] font-extrabold tracking-widest text-gradient">WORLD CUP</h1>
                <button onclick="fetchData()" class="p-1.5 bg-gray-800/80 rounded-full border border-gray-700 hover:bg-gray-700 transition-colors shadow">
                    <svg class="w-3.5 h-3.5 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                    </svg>
                </button>
            </header>

            <div id="widget-next-match" class="flex-shrink-0 mb-3">
                <div class="text-xs text-gray-500 text-center py-2">Loading next match...</div>
            </div>

            <div class="flex-1 flex flex-col min-h-0">
                <h2 class="text-[9px] font-bold text-gray-500 uppercase tracking-widest mb-2 px-1">Upcoming Schedule</h2>
                <div id="widget-upcoming-list" class="flex-1 overflow-y-auto space-y-2 pr-1">
                    <div class="text-[10px] text-gray-600 text-center py-2">Fetching matches...</div>
                </div>
            </div>
            
        </main>
    </div>

    <script>
        const API_TOKEN = '5c236d2d03c044f0a17c02d29117df74'; 
        const TARGET_API = 'https://api.football-data.org/v4/competitions/WC/matches';
        const BASE_URL = 'https://cors-anywhere.herokuapp.com/' + TARGET_API;
        const TOURNAMENT_START = new Date('2026-06-11T16:00:00Z'); 

        let currentTab = 'upcoming'; 
        let tabDays = { upcoming: [], played: [] }; 
        let currentDayIndices = { upcoming: 0, played: 0 };
        window.nextMatchTimestamp = null; 

        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('view') === 'widget') {
                document.body.classList.add('widget-mode');
            }

            initClocks(); 
            fetchData();
            setInterval(fetchData, 60000);
        });

        function updateSyncStatus(status, colorClass) {
            const indicator = document.getElementById('sync-indicator');
            const dot = document.getElementById('sync-dot');
            if(indicator) indicator.innerText = status;
            if(dot) dot.className = `w-2 h-2 rounded-full ${colorClass}`;
        }

        async function fetchData() {
            updateSyncStatus("Syncing...", "bg-yellow-500 animate-pulse");

            const cachedData = localStorage.getItem('wc_matches_data');
            const cachedTime = localStorage.getItem('wc_data_timestamp');
            const now = new Date().getTime();

            if (cachedData && cachedTime && (now - cachedTime < 120000)) {
                renderUI(JSON.parse(cachedData));
                updateSyncStatus("Live (Cached)", "bg-green-500");
                return;
            }

            if (!API_TOKEN || API_TOKEN === 'YOUR_FOOTBALL_DATA_API_KEY') {
                showError("Please insert your API_TOKEN in the code.");
                return;
            }

            try {
                const response = await fetch(BASE_URL, {
                    headers: { 'X-Auth-Token': API_TOKEN }
                });
                
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                
                const data = await response.json();
                
                localStorage.setItem('wc_matches_data', JSON.stringify(data));
                localStorage.setItem('wc_data_timestamp', now.toString());
                
                renderUI(data);
                updateSyncStatus("Live Connected", "bg-green-500 shadow-[0_0_8px_#22c55e]");

            } catch (error) {
                console.error("Fetch Error:", error);
                if (cachedData) {
                    renderUI(JSON.parse(cachedData));
                    updateSyncStatus("Offline Cache", "bg-gray-500");
                } else {
                    updateSyncStatus("Error", "bg-red-500");
                    showError(`Connection blocked. <a href="https://cors-anywhere.herokuapp.com/corsdemo" target="_blank" class="text-blue-400 font-bold underline">Unlock temporary access here</a> and refresh.`);
                }
            }
        }

        function renderUI(data) {
            const matches = data.matches || [];
            
            const liveMatches = matches.filter(m => m.status === 'IN_PLAY' || m.status === 'PAUSED');
            const upcomingMatches = matches.filter(m => m.status === 'TIMED' || m.status === 'SCHEDULED')
                                           .sort((a, b) => new Date(a.utcDate) - new Date(b.utcDate));
            
            renderLiveMatch(liveMatches[0] || null, upcomingMatches[0] || null); 
            processScheduleData(matches);
            renderScheduleView();
            
            if (document.body.classList.contains('widget-mode')) {
                renderWidgetView(liveMatches[0], upcomingMatches);
            }
        }

        function processScheduleData(matches) {
            let upcomingGroups = {};
            let playedGroups = {};

            matches.forEach(match => {
                const matchTime = new Date(match.utcDate);
                const logicalDate = new Date(matchTime.getTime() - (5 * 60 * 60 * 1000));
                const dateKey = logicalDate.toISOString().split('T')[0];

                if (match.status === 'FINISHED') {
                    if (!playedGroups[dateKey]) playedGroups[dateKey] = { sortDate: logicalDate, matches: [] };
                    playedGroups[dateKey].matches.push(match);
                } else {
                    if (!upcomingGroups[dateKey]) upcomingGroups[dateKey] = { sortDate: logicalDate, matches: [] };
                    upcomingGroups[dateKey].matches.push(match);
                }
            });

            tabDays.upcoming = Object.values(upcomingGroups).sort((a, b) => a.sortDate - b.sortDate);
            tabDays.played = Object.values(playedGroups).sort((a, b) => b.sortDate - a.sortDate);
        }

        function switchTab(tab) {
            currentTab = tab;
            renderScheduleView();
        }

        function prevDay() {
            if (currentDayIndices[currentTab] > 0) {
                currentDayIndices[currentTab]--;
                renderScheduleView();
            }
        }

        function nextDay() {
            if (currentDayIndices[currentTab] < tabDays[currentTab].length - 1) {
                currentDayIndices[currentTab]++;
                renderScheduleView();
            }
        }

        function renderScheduleView() {
            const container = document.getElementById('schedule-list');
            const dateLabel = document.getElementById('schedule-date');
            if(!container || !dateLabel) return;
            
            const btnPrev = document.getElementById('btn-prev-day');
            const btnNext = document.getElementById('btn-next-day');
            const tabUp = document.getElementById('tab-upcoming');
            const tabPl = document.getElementById('tab-played');

            if (currentTab === 'upcoming') {
                tabUp.className = "flex-1 text-xs font-bold py-2 rounded-md transition-all text-white bg-gray-700/80 shadow-md border border-gray-500/50";
                tabPl.className = "flex-1 text-xs font-bold py-2 rounded-md transition-all text-gray-500 hover:text-gray-300";
            } else {
                tabPl.className = "flex-1 text-xs font-bold py-2 rounded-md transition-all text-white bg-gray-700/80 shadow-md border border-gray-500/50";
                tabUp.className = "flex-1 text-xs font-bold py-2 rounded-md transition-all text-gray-500 hover:text-gray-300";
            }

            const daysData = tabDays[currentTab];
            const idx = currentDayIndices[currentTab];

            if (!daysData || daysData.length === 0) {
                dateLabel.innerText = "NO MATCHES";
                container.innerHTML = `<div class="text-center text-xs text-gray-500 py-8 font-semibold">No matches found.</div>`;
                btnPrev.style.visibility = 'hidden';
                btnNext.style.visibility = 'hidden';
                return;
            }

            const currentDayGroup = daysData[idx];
            dateLabel.innerText = currentDayGroup.sortDate.toLocaleDateString([], { weekday: 'long', month: 'short', day: 'numeric' });
            
            btnPrev.style.visibility = idx > 0 ? 'visible' : 'hidden';
            btnNext.style.visibility = idx < daysData.length - 1 ? 'visible' : 'hidden';

            container.innerHTML = currentDayGroup.matches.map(match => {
                const localTime = new Date(match.utcDate).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                let timeOrScore = match.status === 'FINISHED' ? 
                    `<span class="font-extrabold text-white text-sm">${match.score.fullTime.home} - ${match.score.fullTime.away}</span>` : 
                    `<span class="font-mono font-semibold text-green-400">${localTime}</span>`;
                const hCrest = match.homeTeam.crest ? `<img src="${match.homeTeam.crest}" class="w-6 h-6 object-contain" />` : '';
                const aCrest = match.awayTeam.crest ? `<img src="${match.awayTeam.crest}" class="w-6 h-6 object-contain" />` : '';

                return `
                    <div class="flex items-center justify-between p-3 rounded-xl hover:bg-white/5 transition-colors border-b border-white/5 last:border-0">
                        <div class="flex items-center gap-3 w-[40%] justify-end">
                            <span class="text-xs font-bold text-gray-300 truncate">${match.homeTeam.shortName || match.homeTeam.name}</span>
                            ${hCrest}
                        </div>
                        <div class="flex flex-col items-center justify-center w-[20%]">
                            <div class="text-xs bg-gray-900/80 px-2 py-1.5 rounded border border-gray-700/50 min-w-[50px] text-center shadow-inner">
                                ${timeOrScore}
                            </div>
                        </div>
                        <div class="flex items-center gap-3 w-[40%] justify-start">
                            ${aCrest}
                            <span class="text-xs font-bold text-gray-300 truncate">${match.awayTeam.shortName || match.awayTeam.name}</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderLiveMatch(match, nextMatch = null) {
            const container = document.getElementById('live-match-container');
            if (!container) return;

            if (!match) {
                window.nextMatchTimestamp = nextMatch ? new Date(nextMatch.utcDate).getTime() : null;
                
                let nextMatchCard = '';
                if (nextMatch) {
                    const hName = nextMatch.homeTeam.tla || nextMatch.homeTeam.shortName || 'TBD';
                    const aName = nextMatch.awayTeam.tla || nextMatch.awayTeam.shortName || 'TBD';
                    const hCrest = nextMatch.homeTeam.crest ? `<img src="${nextMatch.homeTeam.crest}" class="w-8 h-8 object-contain" />` : `<div class="w-8 h-8 bg-gray-800 rounded-full flex items-center justify-center text-[10px] font-bold">${hName}</div>`;
                    const aCrest = nextMatch.awayTeam.crest ? `<img src="${nextMatch.awayTeam.crest}" class="w-8 h-8 object-contain" />` : `<div class="w-8 h-8 bg-gray-800 rounded-full flex items-center justify-center text-[10px] font-bold">${aName}</div>`;
                    
                    nextMatchCard = `
                        <div class="mt-4 bg-gray-900/80 border border-white/5 rounded-xl px-4 py-3 flex flex-col items-center shadow-lg w-full max-w-[280px]">
                            <span class="text-[9px] text-gray-400 font-bold uppercase tracking-[0.2em] mb-3">Up Next</span>
                            <div class="flex items-center justify-between w-full mb-3 px-2">
                                <div class="flex flex-col items-center gap-1.5 w-[40%]">
                                    ${hCrest}
                                    <span class="text-[10px] font-bold text-gray-300 truncate w-full text-center">${hName}</span>
                                </div>
                                <span class="text-[9px] text-gray-600 font-black">VS</span>
                                <div class="flex flex-col items-center gap-1.5 w-[40%]">
                                    ${aCrest}
                                    <span class="text-[10px] font-bold text-gray-300 truncate w-full text-center">${aName}</span>
                                </div>
                            </div>
                            <div class="next-match-timer text-[13px] font-mono font-black text-green-400 tracking-widest bg-black/40 px-3 py-1.5 rounded border border-green-500/10 w-full text-center shadow-inner">
                                Calculating...
                            </div>
                        </div>
                    `;
                }

                container.innerHTML = `
                    <div class="p-6 flex flex-col items-center justify-center min-h-[140px]">
                        <div class="w-8 h-8 mb-2 text-gray-600"><svg fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z"/></svg></div>
                        <h2 class="text-[11px] font-extrabold text-gray-500 uppercase tracking-[0.2em]">No Matches Live</h2>
                        ${nextMatchCard}
                    </div>
                `;
                return;
            }

            window.nextMatchTimestamp = null; 
            const homeImage = match.homeTeam.crest ? `<img src="${match.homeTeam.crest}" class="w-12 h-12 object-contain drop-shadow-lg" />` : `<div class="w-12 h-12 bg-gray-800 rounded-full flex items-center justify-center font-bold text-lg">${match.homeTeam.tla}</div>`;
            const awayImage = match.awayTeam.crest ? `<img src="${match.awayTeam.crest}" class="w-12 h-12 object-contain drop-shadow-lg" />` : `<div class="w-12 h-12 bg-gray-800 rounded-full flex items-center justify-center font-bold text-lg">${match.awayTeam.tla}</div>`;

            container.innerHTML = `
                <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-red-600 to-red-400"></div>
                <div class="p-5">
                    <div class="flex justify-between items-center mb-6">
                        <span class="text-[10px] font-bold text-red-400 uppercase tracking-widest bg-red-900/30 px-2 py-1 rounded-sm border border-red-500/30 flex items-center gap-2">
                            <span class="relative flex h-2 w-2"><span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span><span class="relative inline-flex rounded-full h-2 w-2 bg-red-500"></span></span>
                            Live Arena
                        </span>
                        <span class="text-[10px] text-gray-400 font-semibold tracking-wider">${match.competition?.name || 'World Cup'}</span>
                    </div>
                    <div class="flex items-center justify-between px-2">
                        <div class="flex flex-col items-center w-1/3">
                            ${homeImage}
                            <span class="text-xs font-bold mt-3 text-center truncate w-full">${match.homeTeam.tla || match.homeTeam.name}</span>
                        </div>
                        <div class="flex flex-col items-center w-1/3 px-2">
                            <div class="text-4xl font-black tracking-tighter text-white drop-shadow-md">${match.score.fullTime.home ?? 0} - ${match.score.fullTime.away ?? 0}</div>
                            <div class="text-[10px] text-green-400 font-bold mt-2 uppercase tracking-widest">${match.status}</div>
                        </div>
                        <div class="flex flex-col items-center w-1/3">
                            ${awayImage}
                            <span class="text-xs font-bold mt-3 text-center truncate w-full">${match.awayTeam.tla || match.awayTeam.name}</span>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderWidgetView(liveMatch, upcomingMatches) {
            const nextMatchBox = document.getElementById('widget-next-match');
            const upcomingList = document.getElementById('widget-upcoming-list');
            if (!nextMatchBox || !upcomingList) return;

            const nextMatch = upcomingMatches[0] || null;
            
            if (liveMatch) {
                window.nextMatchTimestamp = null;
                const hName = liveMatch.homeTeam.tla || liveMatch.homeTeam.shortName;
                const aName = liveMatch.awayTeam.tla || liveMatch.awayTeam.shortName;
                const hScore = liveMatch.score.fullTime.home ?? 0;
                const aScore = liveMatch.score.fullTime.away ?? 0;

                nextMatchBox.innerHTML = `
                    <div class="bg-gradient-to-br from-red-900/40 to-gray-900/80 rounded-xl p-3 border border-red-500/20 shadow-lg">
                        <div class="flex justify-between items-center mb-2">
                            <span class="text-[8px] font-bold text-red-400 uppercase tracking-widest flex items-center gap-1"><span class="w-1.5 h-1.5 bg-red-500 rounded-full animate-pulse"></span> LIVE</span>
                            <span class="text-[8px] text-gray-400">${liveMatch.status}</span>
                        </div>
                        <div class="flex justify-between items-center">
                            <span class="text-sm font-bold text-white">${hName}</span>
                            <span class="text-lg font-black text-white bg-black/30 px-2 rounded">${hScore} - ${aScore}</span>
                            <span class="text-sm font-bold text-white">${aName}</span>
                        </div>
                    </div>
                `;
            } else if (nextMatch) {
                window.nextMatchTimestamp = new Date(nextMatch.utcDate).getTime();
                const hName = nextMatch.homeTeam.tla || nextMatch.homeTeam.shortName || 'TBD';
                const aName = nextMatch.awayTeam.tla || nextMatch.awayTeam.shortName || 'TBD';
                const hCrest = nextMatch.homeTeam.crest ? `<img src="${nextMatch.homeTeam.crest}" class="w-6 h-6 object-contain" />` : '';
                const aCrest = nextMatch.awayTeam.crest ? `<img src="${nextMatch.awayTeam.crest}" class="w-6 h-6 object-contain" />` : '';

                nextMatchBox.innerHTML = `
                    <div class="bg-gray-800/60 rounded-xl p-3 border border-white/5 shadow-lg flex flex-col items-center">
                        <div class="flex items-center justify-between w-full mb-2">
                            <div class="flex items-center gap-2 w-[40%] justify-end">
                                <span class="text-xs font-bold text-gray-200">${hName}</span>
                                ${hCrest}
                            </div>
                            <span class="text-[10px] text-gray-500 font-bold mx-1">v</span>
                            <div class="flex items-center gap-2 w-[40%] justify-start">
                                ${aCrest}
                                <span class="text-xs font-bold text-gray-200">${aName}</span>
                            </div>
                        </div>
                        <div class="next-match-timer text-[11px] font-mono font-bold text-green-400 bg-gray-950/50 px-3 py-1 rounded-md border border-white/5 shadow-inner">
                            Calculating...
                        </div>
                    </div>
                `;
            } else {
                nextMatchBox.innerHTML = `<div class="text-xs text-gray-500 text-center bg-gray-800/40 py-3 rounded-xl border border-white/5">No scheduled matches.</div>`;
            }

            const upcomingListHTML = upcomingMatches.slice(1, 5).map(match => {
                const day = new Date(match.utcDate).toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' });
                const time = new Date(match.utcDate).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                const hCrest = match.homeTeam.crest ? `<img src="${match.homeTeam.crest}" class="w-4 h-4" />` : '';
                const aCrest = match.awayTeam.crest ? `<img src="${match.awayTeam.crest}" class="w-4 h-4" />` : '';

                return `
                    <div class="flex items-center justify-between bg-gray-800/40 p-2 rounded-lg border border-white/5">
                        <div class="flex items-center gap-1.5 text-[10px] font-bold text-gray-300 w-[35%] justify-end truncate">
                            ${match.homeTeam.tla || 'TBD'} ${hCrest}
                        </div>
                        <div class="flex flex-col items-center w-[30%]">
                            <span class="text-[8px] text-green-400 font-mono">${time}</span>
                            <span class="text-[7px] text-gray-500 uppercase">${day}</span>
                        </div>
                        <div class="flex items-center gap-1.5 text-[10px] font-bold text-gray-300 w-[35%] justify-start truncate">
                            ${aCrest} ${match.awayTeam.tla || 'TBD'}
                        </div>
                    </div>
                `;
            }).join('');

            upcomingList.innerHTML = upcomingListHTML || `<div class="text-[10px] text-gray-600 text-center">No further upcoming matches.</div>`;
        }

        function initClocks() {
            function updateTick() {
                const now = new Date().getTime();
                
                const tournamentDistance = TOURNAMENT_START.getTime() - now;
                const cdSection = document.getElementById('countdown-section');
                
                if (tournamentDistance < 0) {
                    if (cdSection) cdSection.style.display = 'none'; 
                } else {
                    if (cdSection) {
                        cdSection.style.display = 'block';
                        document.getElementById('cd-days').innerText = Math.floor(tournamentDistance / (1000 * 60 * 60 * 24)).toString().padStart(2, '0');
                        document.getElementById('cd-hours').innerText = Math.floor((tournamentDistance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)).toString().padStart(2, '0');
                        document.getElementById('cd-minutes').innerText = Math.floor((tournamentDistance % (1000 * 60 * 60)) / (1000 * 60)).toString().padStart(2, '0');
                    }
                }

                if (window.nextMatchTimestamp) {
                    const matchDistance = window.nextMatchTimestamp - now;
                    const timerElements = document.querySelectorAll('.next-match-timer');
                    
                    timerElements.forEach(el => {
                        if (matchDistance > 0) {
                            const d = Math.floor(matchDistance / (1000 * 60 * 60 * 24));
                            const h = Math.floor((matchDistance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                            const m = Math.floor((matchDistance % (1000 * 60 * 60)) / (1000 * 60));
                            const s = Math.floor((matchDistance % (1000 * 60)) / 1000);
                            
                            const padH = h.toString().padStart(2, '0');
                            const padM = m.toString().padStart(2, '0');
                            const padS = s.toString().padStart(2, '0');

                            if (d > 0) {
                                el.innerText = `${d}d ${padH}h ${padM}m ${padS}s`;
                            } else {
                                el.innerText = `${padH}h ${padM}m ${padS}s`;
                            }
                        } else {
                            el.innerText = 'LIVE NOW';
                        }
                    });
                }
            }
            setInterval(updateTick, 1000);
            updateTick();
        }

        function showError(msg) {
            const list = document.getElementById('schedule-list');
            const widgetList = document.getElementById('widget-upcoming-list');
            if(list) list.innerHTML = `<div class="text-center text-xs text-red-400 py-4 font-bold">${msg}</div>`;
            if(widgetList) widgetList.innerHTML = `<div class="text-center text-[10px] text-red-400 py-4 font-bold px-2">${msg}</div>`;
        }
    </script>
</body>
</html>
