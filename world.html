<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Cup Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .bg-stadium {
            background: linear-gradient(180deg, #1e293b 0%, #0f172a 40%, #064e3b 100%);
        }
        .card-bg {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(8px);
        }
        
        /* Strict Widget Mode Overrides matching the mockup */
        body.widget-mode {
            background: transparent;
            height: auto;
            overflow: hidden;
            padding: 0;
        }
        body.widget-mode #app-container {
            min-height: auto;
            border-radius: 1.25rem;
            background: linear-gradient(180deg, #1e293b 0%, #064e3b 100%);
            padding: 12px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        body.widget-mode .hide-in-widget { display: none !important; }
        body.widget-mode .show-in-widget { display: block !important; }
    </style>
</head>
<body class="bg-gray-900 text-white font-sans antialiased">

    <div id="app-container" class="max-w-md mx-auto bg-stadium min-h-screen shadow-2xl relative flex flex-col pb-6">
        
        <header class="flex items-center justify-between p-4 hide-in-widget">
            <h1 class="text-xl font-bold tracking-wider">WORLD CUP</h1>
            <span id="sync-indicator" class="text-[10px] text-gray-400 bg-gray-800 px-2 py-1 rounded-full">Syncing...</span>
        </header>

        <header class="hidden show-in-widget mb-2">
            <div class="flex justify-between items-center px-1">
                <h1 class="text-xs font-bold tracking-widest text-gray-300">WORLD CUP WIDGET</h1>
                <span class="w-2 h-2 rounded-full bg-green-400 animate-pulse"></span>
            </div>
        </header>

        <main class="flex-1 px-4 space-y-4">
            
            <section id="countdown-section" class="card-bg rounded-xl border border-gray-700 p-4 text-center hide-in-widget">
                <h2 class="text-xs font-semibold text-gray-400 mb-2 uppercase tracking-widest">Tournament Countdown</h2>
                <div class="flex justify-center gap-4 text-center">
                    <div><div id="cd-days" class="text-3xl font-bold">00</div><div class="text-[10px] text-gray-400">DAYS</div></div>
                    <div class="text-3xl font-bold text-gray-600">:</div>
                    <div><div id="cd-hours" class="text-3xl font-bold">00</div><div class="text-[10px] text-gray-400">HOURS</div></div>
                    <div class="text-3xl font-bold text-gray-600">:</div>
                    <div><div id="cd-minutes" class="text-3xl font-bold">00</div><div class="text-[10px] text-gray-400">MINS</div></div>
                    <div class="text-3xl font-bold text-gray-600">:</div>
                    <div><div id="cd-seconds" class="text-3xl font-bold">00</div><div class="text-[10px] text-gray-400">SECS</div></div>
                </div>
            </section>

            <section id="live-match-section" class="card-bg rounded-xl border border-gray-700 p-4 relative overflow-hidden">
                <div id="live-match-data">
                    <div class="text-center text-xs text-gray-400 py-4">Checking live matches...</div>
                </div>
            </section>

            <div id="widget-extras" class="hidden show-in-widget space-y-3">
                </div>

            <section id="schedule-section" class="card-bg rounded-xl border border-gray-700 p-4 hide-in-widget">
                <h2 class="text-xs font-semibold text-gray-400 mb-3 uppercase tracking-widest">Match Schedule</h2>
                <div id="grouped-schedule-container" class="space-y-4">
                    <div class="text-center text-xs text-gray-400 py-4">Loading fixtures...</div>
                </div>
            </section>

        </main>
    </div>

    <script>
        // --- CONFIGURATION ---
        // Switch BASE_URL to your Cloudflare Worker URL when deployed to eliminate CORS completely
        const API_TOKEN = '5c236d2d03c044f0a17c02d29117df74'; 
        const TARGET_ENDPOINT = 'https://api.football-data.org/v4/competitions/WC/matches';
        const BASE_URL = 'https://cors-anywhere.herokuapp.com/' + TARGET_ENDPOINT;
        
        // Target Opener Date
        const TOURNAMENT_START = new Date('2026-06-11T16:00:00Z'); 

        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('view') === 'widget') {
                document.body.classList.add('widget-mode');
            }

            initCountdown();
            fetchData();
            setInterval(fetchData, 45000); // Poll live data every 45 seconds
        });

        async function fetchData() {
            const indicator = document.getElementById('sync-indicator');
            if(indicator) indicator.innerText = "Syncing...";

            const cachedData = localStorage.getItem('wc_live_payload');
            const cachedTime = localStorage.getItem('wc_payload_ts');
            const now = new Date().getTime();

            // Cache fallback protection (2-minute window)
            if (cachedData && cachedTime && (now - cachedTime < 120000)) {
                processAndRender(JSON.parse(cachedData));
                if(indicator) indicator.innerText = "Cached";
                return;
            }

            try {
                const headers = API_TOKEN && !BASE_URL.includes('workers.dev') ? { 'X-Auth-Token': API_TOKEN } : {};
                const response = await fetch(BASE_URL, { headers });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                
                const data = await response.json();
                localStorage.setItem('wc_live_payload', JSON.stringify(data));
                localStorage.setItem('wc_payload_ts', now.toString());
                
                processAndRender(data);
                if(indicator) indicator.innerText = "Live Connected";
            } catch (error) {
                console.error("Data fetch exception:", error);
                if (cachedData) {
                    processAndRender(JSON.parse(cachedData));
                    if(indicator) indicator.innerText = "Offline Cache";
                } else {
                    document.getElementById('grouped-schedule-container').innerHTML = 
                        `<div class="text-center text-xs text-red-400 py-2">Failed to load real-time data layer.</div>`;
                }
            }
        }

        function processAndRender(data) {
            const matches = data.matches || [];
            
            // Filter states
            const liveMatches = matches.filter(m => m.status === 'IN_PLAY' || m.status === 'PAUSED');
            const upcomingMatches = matches.filter(m => m.status === 'TIMED' || m.status === 'SCHEDULED');

            // 1. Render Live Match Card
            renderLiveCard(liveMatches[0] || null);

            // 2. Render Main App Schedule Grouped strictly by Date
            if (!document.body.classList.contains('widget-mode')) {
                renderGroupedSchedule(matches);
            } else {
                // 3. Render Widget View additions
                renderWidgetExtras(upcomingMatches[0] || null);
            }
        }

        function renderLiveCard(match) {
            const container = document.getElementById('live-match-data');
            const section = document.getElementById('live-match-section');
            if (!container) return;

            if (!match) {
                section.className = "card-bg rounded-xl border border-gray-700 p-4 relative overflow-hidden";
                container.innerHTML = `
                    <div class="flex justify-between items-center mb-1">
                        <h2 class="text-xs font-semibold text-gray-400 uppercase tracking-widest">Live Match</h2>
                        <span class="text-[10px] text-gray-500 font-mono">None Active</span>
                    </div>
                    <div class="text-center text-xs text-gray-500 py-3">No matches are live at this moment.</div>
                `;
                return;
            }

            // High contrast status for live view
            section.className = "card-bg rounded-xl border-2 border-red-500 p-4 relative overflow-hidden";
            container.innerHTML = `
                <div class="flex justify-between items-center mb-3">
                    <h2 class="text-xs font-bold text-red-400 uppercase tracking-widest">LIVE NOW</h2>
                    <span class="flex h-2 w-2 relative">
                        <span class="animate-ping absolute inline-flex h-2 w-2 rounded-full bg-red-400 opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-2 w-2 bg-red-500"></span>
                    </span>
                </div>
                <div class="flex items-center justify-between">
                    <div class="w-1/3 text-center font-bold text-sm tracking-wide">${match.homeTeam.tla || match.homeTeam.name}</div>
                    <div class="w-1/3 text-center">
                        <div class="text-3xl font-black tracking-wider text-white">${match.score.fullTime.home ?? 0} - ${match.score.fullTime.away ?? 0}</div>
                        <div class="text-[9px] text-gray-400 font-mono mt-1">Group Stage</div>
                    </div>
                    <div class="w-1/3 text-center font-bold text-sm tracking-wide">${match.awayTeam.tla || match.awayTeam.name}</div>
                </div>
            `;
        }

        function renderGroupedSchedule(matches) {
            const container = document.getElementById('grouped-schedule-container');
            if (!container) return;

            if (matches.length === 0) {
                container.innerHTML = '<div class="text-center text-xs text-gray-500">No matches found.</div>';
                return;
            }

            // Grouping array values by date string
            const groups = {};
            matches.forEach(match => {
                const dateKey = new Date(match.utcDate).toLocaleDateString([], { 
                    weekday: 'long', 
                    month: 'short', 
                    day: 'numeric',
                    year: 'numeric'
                });
                if (!groups[dateKey]) groups[dateKey] = [];
                groups[dateKey].push(match);
            });

            // Build pure structured semantic DOM matching the agreed mockup principles
            let html = '';
            for (const [dateHeader, dayMatches] of Object.entries(groups)) {
                html += `
                    <div class="space-y-2">
                        <div class="text-[11px] font-bold text-green-400 uppercase tracking-wider bg-gray-800/50 py-1 px-2 rounded">${dateHeader}</div>
                        <div class="space-y-2 pl-1">
                `;

                dayMatches.forEach(match => {
                    const matchTime = new Date(match.utcDate).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                    let centralDisplay = `<span class="text-gray-400 font-mono">${matchTime}</span>`;
                    
                    if (match.status === 'FINISHED') {
                        centralDisplay = `<span class="text-green-400 font-bold font-mono bg-green-950/40 px-2 py-0.5 rounded">${match.score.fullTime.home} - ${match.score.fullTime.away}</span>`;
                    } else if (match.status === 'IN_PLAY') {
                        centralDisplay = `<span class="text-red-400 font-bold text-[10px] animate-pulse bg-red-950/40 px-1.5 py-0.5 rounded">LIVE</span>`;
                    }

                    html += `
                        <div class="flex items-center justify-between text-xs border-b border-gray-800/40 pb-2">
                            <div class="w-2/5 text-right font-medium pr-2 truncate">${match.homeTeam.name}</div>
                            <div class="w-1/5 text-center flex justify-center">${centralDisplay}</div>
                            <div class="w-2/5 text-left font-medium pl-2 truncate">${match.awayTeam.name}</div>
                        </div>
                    `;
                });

                html += `</div></div>`;
            }

            container.innerHTML = html;
        }

        function renderWidgetExtras(nextMatch) {
            const container = document.getElementById('widget-extras');
            if (!container) return;

            if (!nextMatch) {
                container.innerHTML = '';
                return;
            }

            const localTime = new Date(nextMatch.utcDate).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            const localDate = new Date(nextMatch.utcDate).toLocaleDateString([], { month: 'short', day: 'numeric' });

            container.innerHTML = `
                <div class="card-bg rounded-lg border border-gray-700 p-2.5 flex justify-between items-center text-xs">
                    <div>
                        <div class="text-[9px] text-gray-400 uppercase tracking-widest mb-0.5">NEXT UP</div>
                        <div class="font-bold text-white">${nextMatch.homeTeam.tla || 'TBD'} vs ${nextMatch.awayTeam.tla || 'TBD'}</div>
                    </div>
                    <div class="text-right">
                        <div class="font-mono text-green-400 font-bold">${localTime}</div>
                        <div class="text-[9px] text-gray-400 font-mono">${localDate}</div>
                    </div>
                </div>
            `;
        }

        function initCountdown() {
            function updateClock() {
                const now = new Date().getTime();
                const distance = TOURNAMENT_START.getTime() - now;

                if (distance < 0) {
                    const cdSection = document.getElementById('countdown-section');
                    if (cdSection) cdSection.innerHTML = '<h2 class="text-sm font-bold text-green-400 tracking-wider py-1">🏆 THE TOURNAMENT IS LIVE! 🏆</h2>';
                    return;
                }

                const daysEl = document.getElementById('cd-days');
                if(!daysEl) return;

                daysEl.innerText = Math.floor(distance / (1000 * 60 * 60 * 24)).toString().padStart(2, '0');
                document.getElementById('cd-hours').innerText = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)).toString().padStart(2, '0');
                document.getElementById('cd-minutes').innerText = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60)).toString().padStart(2, '0');
                document.getElementById('cd-seconds').innerText = Math.floor((distance % (1000 * 60)) / 1000).toString().padStart(2, '0');
            }
            setInterval(updateClock, 1000);
            updateClock();
        }
    </script>
</body>
</html>
