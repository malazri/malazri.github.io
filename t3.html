<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlAzri TV v1.25</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary-red: #e50914; --bg-dark: #050505; --panel-bg: #111; --card-w: 110px; --card-h: 155px; }
        * { box-sizing: border-box; }
        body { background-color: var(--bg-dark); color: white; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
        
        header { height: 60px; background: #000; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; border-bottom: 1px solid #222; flex-shrink: 0; z-index: 1000; }
        .brand { color: var(--primary-red); font-size: 1.3rem; font-weight: 900; }
        .header-controls { display: flex; gap: 10px; align-items: center; }
        
        /* أزرار التحكم في القسم العلوي */
        .top-toggle { background: #222; color: white; border: 1px solid #444; padding: 5px 12px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; }
        .top-toggle:hover { background: var(--primary-red); }

        #top-cont { position: relative; background: #0a0a0a; border-bottom: 1px solid #222; flex-shrink: 0; transition: max-height 0.3s ease-out, opacity 0.3s; overflow: hidden; max-height: 250px; opacity: 1; }
        #top-cont.hidden { max-height: 0; opacity: 0; border-bottom: none; }

        .top-section { display: flex; gap: 15px; padding: 10px 45px; overflow-x: auto; white-space: nowrap; scroll-behavior: smooth; }
        .top-section::-webkit-scrollbar { display: none; }

        .main-layout { display: grid; grid-template-columns: 320px 1fr; flex: 1; overflow: hidden; }
        
        /* حاوية قائمة الحلقات */
        .side-container { background: var(--panel-bg); border-left: 1px solid #222; display: none; flex-direction: column; overflow: hidden; }
        .side-container.has-content { display: flex; }
        .side-section { flex: 1; overflow-y: auto; padding: 15px; }
        /* شريط تمرير نحيف */
        .side-section::-webkit-scrollbar { width: 6px; }
        .side-section::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }

        .middle-section { background: #000; display: flex; flex-direction: column; overflow: hidden; position: relative; }
        .player-wrapper { flex: 1; position: relative; display: flex; align-items: center; justify-content: center; background: #000; overflow: hidden; }
        #main-video { max-width: 100%; max-height: 100%; width: 100%; height: 100%; object-fit: contain; }

        .player-header { padding: 10px 20px; background: #000; border-bottom: 1px solid #111; color: var(--primary-red); font-weight: bold; }
        .player-footer { padding: 10px 20px; background: #000; border-top: 1px solid #111; font-size: 0.75rem; color: #666; display: flex; justify-content: space-between; }

        .ep-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; background: #1a1a1a; margin-bottom: 6px; border-radius: 4px; cursor: pointer; font-size: 0.85rem; color: #ccc; transition: 0.2s; }
        .ep-item:hover { background: #252525; }
        .ep-item.active-ep { background: #300; border-right: 4px solid var(--primary-red); color: white; }
        .ep-progress { font-size: 0.7rem; color: #888; font-family: monospace; }

        .card { display: inline-block; min-width: var(--card-w); height: var(--card-h); background: #1a1a1a; border-radius: 4px; overflow: hidden; cursor: pointer; position: relative; margin-left: 12px; }
        .card img { width: 100%; height: 100%; object-fit: cover; }
        .card-label { position: absolute; bottom: 0; width: 100%; background: rgba(0,0,0,0.85); font-size: 0.6rem; text-align: center; padding: 4px; }

        @media (max-width: 768px) {
            body { overflow-y: auto; height: auto; }
            .main-layout { display: flex; flex-direction: column; }
            .middle-section { height: 60vw; min-height: 250px; }
            .side-container { height: auto; max-height: 400px; }
        }
    </style>
</head>
<body>

<header>
    <div class="brand">ALAZRI TV</div>
    <div class="header-controls">
        <button class="top-toggle" id="toggle-top-btn" onclick="manualToggleTop()"><i class="fas fa-minus"></i></button>
        <button class="btn-google" id="login-btn" onclick="loginWithGoogle()">دخول</button>
        <button class="btn-logout" id="logout-btn" onclick="handleLogout()" style="display:none;">خروج</button>
        <div class="search-box" style="background:#222; padding:4px 10px; border-radius:4px;"><input type="text" id="search-input" placeholder="بحث..." style="background:none; border:none; color:white; outline:none;"></div>
    </div>
</header>

<div id="top-cont">
    <div class="top-section" id="discovery">
        <div id="content-favs" style="display:flex;"></div>
        <div id="content-search" style="display:flex;"></div>
    </div>
</div>

<div class="main-layout">
    <div class="side-container" id="side-panel">
        <div class="side-section">
            <div id="series-title" style="color:var(--primary-red); font-weight:bold; margin-bottom:15px; border-bottom:1px solid #222; padding-bottom:10px;"></div>
            <button id="fav-btn" style="display:none; width:100%; margin-bottom:10px; background:var(--primary-red); color:white; border:none; padding:8px; border-radius:4px; cursor:pointer;" onclick="handleFavoriteAction()"></button>
            <div id="episode-list"></div>
        </div>
    </div>
    <div class="middle-section">
        <div class="player-header" id="v-title">اختر فيديو للمشاهدة</div>
        <div class="player-wrapper">
            <video id="main-video" controls></video>
            <div id="resume-ui" style="position:absolute; background:rgba(0,0,0,0.9); padding:20px; display:none; flex-direction:column; align-items:center; border:1px solid var(--primary-red); border-radius:8px;">
                <p id="resume-msg"></p>
                <div>
                    <button onclick="confirmResume(true)" style="background:var(--primary-red); color:white; border:none; padding:8px 20px; border-radius:4px; cursor:pointer;">إكمال</button>
                    <button onclick="confirmResume(false)" style="background:#444; color:white; border:none; padding:8px 20px; border-radius:4px; margin-right:10px; cursor:pointer;">البدء من الأول</button>
                </div>
            </div>
        </div>
        <div class="player-footer">
            <div>التاريخ: <span id="meta-date">--</span></div>
            <div>الموقف: <span id="meta-pos">--</span></div>
        </div>
    </div>
</div>

<script>
    const SB_URL = "https://hksxehxhdlzqmzrqspjc.supabase.co";
    const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imhrc3hlaHhoZGx6cW16cnFzcGpjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE2NTI2MzYsImV4cCI6MjA4NzIyODYzNn0.IrMUz0wss2qoJEXqD6Q2hlXa5J13i-_2VYxAUM_R5tY";
    const db = supabase.createClient(SB_URL, SB_KEY);
    const PROXY = url => "https://corsproxy.io/?" + encodeURIComponent(url);
    const BASE = "https://ak.sv";
    
    let state = { user: null, currentSeries: null, currentLink: null, savedPos: 0, favs: [], history: [] };
    const video = document.getElementById('main-video');

    function fmtTime(s) { if(!s || isNaN(s)) return ""; let m = Math.floor(s/60), sec = Math.floor(s%60); return (m<10?"0"+m:m)+":"+(sec<10?"0"+sec:sec); }

    function manualToggleTop() {
        const top = document.getElementById('top-cont');
        const btn = document.getElementById('toggle-top-btn');
        const isHidden = top.classList.toggle('hidden');
        btn.innerHTML = isHidden ? '<i class="fas fa-plus"></i>' : '<i class="fas fa-minus"></i>';
    }

    async function checkUser() {
        const { data: { session } } = await db.auth.getSession();
        if(session?.user) {
            state.user = session.user;
            document.getElementById('login-btn').style.display = 'none';
            document.getElementById('logout-btn').style.display = 'inline-block';
            await loadUserHistory();
            await refreshTop();
            setInterval(syncProgressToDB, 10000);
        }
    }

    async function loadUserHistory() {
        if(!state.user) return;
        const { data } = await db.from('watch_history').select('episode_link, last_position').eq('user_id', state.user.id);
        state.history = data || [];
    }

    async function loginWithGoogle() { await db.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: window.location.href } }); }
    async function handleLogout() { await db.auth.signOut(); location.reload(); }

    async function loadEpisodes(item) {
        state.currentSeries = item;
        document.getElementById('series-title').innerText = item.title;
        document.getElementById('fav-btn').style.display = 'block';
        updateFavBtnUI();
        
        const res = await fetch(PROXY(item.link));
        const doc = new DOMParser().parseFromString(await res.text(), 'text/html');
        const eps = [];
        doc.querySelectorAll('a[href*="/episode/"]').forEach(a => {
            const link = a.href.includes('http') ? a.href : BASE + a.getAttribute('href');
            if(!eps.find(e => e.link === link)) eps.push({ link: link, title: a.innerText.trim() });
        });

        if(eps.length > 0) {
            document.getElementById('side-panel').classList.add('has-content');
            renderEpisodeList(eps, item.img);
        }
    }

    function renderEpisodeList(eps, img) {
        document.getElementById('episode-list').innerHTML = eps.map(e => {
            const hist = state.history.find(h => h.episode_link === e.link);
            const timeStr = hist ? fmtTime(hist.last_position) : "";
            const activeClass = state.currentLink === e.link ? 'active-ep' : '';
            return `
                <div class="ep-item ${activeClass}" onclick='fetchAndPlay(${JSON.stringify({title:e.title, link:e.link, img:img}).replace(/'/g, "&apos;")})'>
                    <span>${e.title}</span>
                    <span class="ep-progress">${timeStr}</span>
                </div>`;
        }).join('');
    }

    async function fetchAndPlay(item) {
        // إخفاء الجزء العلوي تلقائياً عند التشغيل
        document.getElementById('top-cont').classList.add('hidden');
        document.getElementById('toggle-top-btn').innerHTML = '<i class="fas fa-plus"></i>';

        state.currentLink = item.link; 
        document.getElementById('v-title').innerText = item.title;
        video.pause(); video.src = "";
        document.getElementById('resume-ui').style.display = 'none';

        const hist = state.history.find(h => h.episode_link === item.link);
        if(hist && hist.last_position > 15) {
            state.savedPos = hist.last_position;
            document.getElementById('resume-msg').innerText = "هل تريد الإكمال من " + fmtTime(hist.last_position) + "؟";
            document.getElementById('resume-ui').style.display = 'flex';
        }

        try {
            const html = await (await fetch(PROXY(item.link))).text();
            const idMatch = html.match(/go\.ak\.sv\/link\/([a-zA-Z0-9]+)/);
            if(idMatch) {
                const pathSuffix = item.link.split(/\/(movie|episode)\//)[2] || "";
                const dlUrl = BASE + "/download/" + idMatch[1] + "/" + pathSuffix;
                const dlHtml = await (await fetch(PROXY(dlUrl))).text();
                const mp4Match = dlHtml.match(/href="([^"]+\.mp4[^"]*)"/i);
                if(mp4Match) {
                    video.src = mp4Match[1].startsWith('/') ? BASE + mp4Match[1] : mp4Match[1];
                    if(!hist || hist.last_position <= 15) video.play();
                    // تحديث القائمة لتعليم الحلقة النشطة
                    if(state.currentSeries) loadEpisodes(state.currentSeries);
                }
            }
        } catch(e) { console.error("Error loading video", e); }
    }

    async function syncProgressToDB() {
        if(state.user && state.currentLink && !video.paused) {
            const pos = Math.floor(video.currentTime);
            if(pos > 5) {
                await db.from('watch_history').upsert({ user_id: state.user.id, episode_link: state.currentLink, last_position: pos, updated_at: new Date() }, { onConflict: 'user_id, episode_link' });
                await loadUserHistory(); // تحديث السجل المحلي
                document.getElementById('meta-pos').innerText = fmtTime(pos);
            }
        }
    }

    async function refreshTop() {
        if(!state.user) return;
        const { data } = await db.from('favorites').select('series_data').eq('user_id', state.user.id);
        state.favs = data ? data.map(f => f.series_data) : [];
        document.getElementById('content-favs').innerHTML = state.favs.map(i => `<div class="card" onclick='handleAction(${JSON.stringify(i).replace(/'/g, "&apos;")})'><img src="${i.img}"><div class="card-label">${i.title}</div></div>`).join('');
    }

    async function handleAction(i) {
        if(i.link.includes('/movie/')) {
            document.getElementById('side-panel').classList.remove('has-content');
            fetchAndPlay(i);
        } else { loadEpisodes(i); }
    }

    async function handleFavoriteAction() {
        const isF = state.favs.some(f => f.link === state.currentSeries.link);
        if(isF) { await db.from('favorites').delete().eq('user_id', state.user.id).filter('series_data->>link', 'eq', state.currentSeries.link); }
        else { await db.from('favorites').insert([{ user_id: state.user.id, series_data: state.currentSeries }]); }
        await refreshTop(); updateFavBtnUI();
    }

    function updateFavBtnUI() {
        const b = document.getElementById('fav-btn');
        const isF = state.favs.some(f => f.link === state.currentSeries.link);
        b.innerText = isF ? "إزالة من المفضلة" : "إضافة للمفضلة";
        b.style.background = isF ? "#444" : "var(--primary-red)";
    }

    async function startSearch(q) {
        if(!q) return;
        const res = await fetch(PROXY(`${BASE}/search?q=${q}`));
        const doc = new DOMParser().parseFromString(await res.text(), 'text/html');
        document.getElementById('content-search').innerHTML = "";
        doc.querySelectorAll('a[href*="/movie/"], a[href*="/series/"]').forEach(a => {
            const img = a.querySelector('img');
            if(img) {
                const item = { title: img.alt, link: a.href.includes('http') ? a.href : BASE + a.getAttribute('href'), img: img.src };
                document.getElementById('content-search').innerHTML += `<div class="card" onclick='handleAction(${JSON.stringify(item).replace(/'/g, "&apos;")})'><img src="${item.img}"><div class="card-label">${item.title}</div></div>`;
            }
        });
    }

    function confirmResume(y) { document.getElementById('resume-ui').style.display = 'none'; if(y) video.currentTime = state.savedPos; video.play(); }
    document.getElementById('search-input').onkeydown = e => { if(e.key==='Enter') startSearch(e.target.value); };
    window.onload = checkUser;
</script>
</body>
</html>
