<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlAzri TV v1.18 (Supabase Edition)</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { --main-red: #e50914; --dark-bg: #060606; --card-bg: #141414; }
        body { background: var(--dark-bg); color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; overflow-x: hidden; }
        
        /* Navbar */
        .navbar { position: fixed; top: 0; width: 100%; height: 70px; background: rgba(0,0,0,0.9); display: flex; align-items: center; justify-content: space-between; padding: 0 4%; z-index: 2000; border-bottom: 1px solid #222; }
        .logo { color: var(--main-red); font-size: 28px; font-weight: 900; cursor: pointer; text-decoration: none; }
        
        .nav-tools { display: flex; align-items: center; gap: 20px; }
        .search-box { background: #1a1a1a; border: 1px solid #333; padding: 8px 15px; border-radius: 20px; display: flex; align-items: center; }
        .search-box input { background: transparent; border: none; color: white; outline: none; width: 180px; }
        
        /* Auth Buttons */
        .auth-btn { background: var(--main-red); color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .google-login { background: white; color: black; display: flex; align-items: center; gap: 8px; }

        /* Main Content */
        .container { padding: 90px 4% 50px 4%; }
        
        .section-title { font-size: 22px; margin-bottom: 20px; border-right: 4px solid var(--main-red); padding-right: 15px; display: flex; justify-content: space-between; align-items: center; }
        
        .grid-scroll { display: flex; gap: 15px; overflow-x: auto; padding-bottom: 20px; scroll-behavior: smooth; }
        .grid-scroll::-webkit-scrollbar { height: 6px; }
        .grid-scroll::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }

        .item-card { min-width: 180px; position: relative; cursor: pointer; transition: 0.3s; }
        .item-card:hover { transform: scale(1.05); z-index: 10; }
        .item-card img { width: 100%; height: 260px; object-fit: cover; border-radius: 8px; }
        .item-card .title { position: absolute; bottom: 0; width: 100%; background: rgba(0,0,0,0.8); padding: 8px; font-size: 13px; text-align: center; border-radius: 0 0 8px 8px; }

        /* Player Overlay */
        .player-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 3000; }
        .player-header { padding: 15px 4%; display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.5); }
        .close-player { font-size: 30px; cursor: pointer; color: #fff; }

        video { width: 100%; height: calc(100vh - 120px); }

        .history-badge { background: #333; padding: 5px 10px; font-size: 12px; border-radius: 4px; color: #ffc107; margin-top: 10px; display: none; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<nav class="navbar">
    <a href="#" class="logo" onclick="location.reload()">ALAZRI TV</a>
    <div class="nav-tools">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="ابحث عن فيلم أو مسلسل..." onkeydown="if(event.key==='Enter') startSearch()">
            <i class="fas fa-search" onclick="startSearch()"></i>
        </div>
        <div id="user-area">
            <button class="auth-btn google-login" id="loginBtn" onclick="login()">
                <img src="https://www.google.com/favicon.ico" width="16"> دخول
            </button>
            <button class="auth-btn hidden" id="logoutBtn" onclick="logout()">خروج</button>
        </div>
    </div>
</nav>

<div class="container">
    <div id="search-section" class="hidden">
        <div class="section-title">نتائج البحث <i class="fas fa-times" onclick="closeSearch()" style="cursor:pointer"></i></div>
        <div class="grid-scroll" id="searchGrid"></div>
    </div>

    <div id="fav-section" class="hidden">
        <div class="section-title">قائمتي المفضلّة</div>
        <div class="grid-scroll" id="favGrid"></div>
    </div>

    <div id="episodes-section" class="hidden">
        <div class="section-title">
            <span id="seriesTitle">الحلقات</span>
            <button class="auth-btn" style="background:#222" onclick="toggleFav()">
                <i id="favIcon" class="far fa-heart"></i>
            </button>
        </div>
        <div class="grid-scroll" id="episodeGrid"></div>
    </div>
</div>

<div class="player-overlay" id="playerOverlay">
    <div class="player-header">
        <div id="videoTitle">اسم الفيديو</div>
        <div class="close-player" onclick="closePlayer()">&times;</div>
    </div>
    <video id="mainVideo" controls autoplay></video>
    <div style="padding: 0 4%;">
        <div id="historyMsg" class="history-badge"></div>
    </div>
</div>

<script>
    // إعدادات Supabase
    const SB_URL = "https://hksxehxhdlzqmzrqspjc.supabase.co";
    const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imhrc3hlaHhoZGx6cW16cnFzcGpjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE2NTI2MzYsImV4cCI6MjA4NzIyODYzNn0.IrMUz0wss2qoJEXqD6Q2hlXa5J13i-_2VYxAUM_R5tY";
    const db = supabase.createClient(SB_URL, SB_KEY);
    
    const PROXY = (url) => `https://corsproxy.io/?${encodeURIComponent(url)}`;
    const BASE = "https://ak.sv";
    
    let currentUser = null;
    let currentItem = null; // المسلسل أو الفيلم الحالي
    let favorites = [];

    // --- نظام المستخدم ---
    async function checkUser() {
        const { data: { session } } = await db.auth.getSession();
        if (session?.user) {
            currentUser = session.user;
            document.getElementById('loginBtn').classList.add('hidden');
            document.getElementById('logoutBtn').classList.remove('hidden');
            loadFavorites();
            setInterval(syncProgress, 10000);
        }
    }

    async function login() { await db.auth.signInWithOAuth({ provider: 'google' }); }
    async function logout() { await db.auth.signOut(); location.reload(); }

    // --- المفضلات ---
    async function loadFavorites() {
        const { data } = await db.from('favorites').select('series_data').eq('user_id', currentUser.id);
        if (data) {
            favorites = data.map(d => d.series_data);
            renderFavorites();
        }
    }

    function renderFavorites() {
        const grid = document.getElementById('favGrid');
        if (favorites.length > 0) {
            document.getElementById('fav-section').classList.remove('hidden');
            grid.innerHTML = favorites.map(item => createCard(item)).join('');
        }
    }

    async function toggleFav() {
        if (!currentUser) return alert("يرجى تسجيل الدخول للمضافة للمفضلة");
        const isFav = favorites.some(f => f.link === currentItem.link);
        if (isFav) {
            await db.from('favorites').delete().eq('user_id', currentUser.id).filter('series_data->>link', 'eq', currentItem.link);
            favorites = favorites.filter(f => f.link !== currentItem.link);
        } else {
            await db.from('favorites').insert([{ user_id: currentUser.id, series_data: currentItem }]);
            favorites.push(currentItem);
        }
        updateFavIcon();
        renderFavorites();
    }

    function updateFavIcon() {
        const isFav = favorites.some(f => f.link === currentItem.link);
        document.getElementById('favIcon').className = isFav ? "fas fa-heart" : "far fa-heart";
    }

    // --- البحث والتشغيل ---
    async function startSearch() {
        const q = document.getElementById('searchInput').value;
        if (!q) return;
        const res = await fetch(PROXY(`${BASE}/search?q=${q}`));
        const html = await res.text();
        const doc = new DOMParser().parseFromString(html, 'text/html');
        
        const results = [];
        doc.querySelectorAll('a[href*="/movie/"], a[href*="/series/"]').forEach(a => {
            const img = a.querySelector('img');
            if (img) {
                results.push({
                    title: img.alt || "بدون عنوان",
                    link: a.href.includes('http') ? a.href : BASE + a.getAttribute('href'),
                    img: img.dataset.src || img.src,
                    isSeries: a.href.includes('/series/')
                });
            }
        });

        const grid = document.getElementById('searchGrid');
        grid.innerHTML = results.map(item => createCard(item)).join('');
        document.getElementById('search-section').classList.remove('hidden');
    }

    function createCard(item) {
        const data = btoa(unescape(encodeURIComponent(JSON.stringify(item))));
        return `
            <div class="item-card" onclick="handleItem('${data}')">
                <img src="${item.img}">
                <div class="title">${item.title}</div>
            </div>
        `;
    }

    async function handleItem(encodedData) {
        const item = JSON.parse(decodeURIComponent(escape(atob(encodedData))));
        currentItem = item;
        if (item.isSeries) {
            loadEpisodes(item);
        } else {
            playVideo(item.link, item.title);
        }
    }

    async function loadEpisodes(item) {
        document.getElementById('episodes-section').classList.remove('hidden');
        document.getElementById('seriesTitle').innerText = item.title;
        updateFavIcon();
        
        const html = await (await fetch(PROXY(item.link))).text();
        const doc = new DOMParser().parseFromString(html, 'text/html');
        const eps = [];
        doc.querySelectorAll('a[href*="/episode/"]').forEach(a => {
            eps.push({ title: a.innerText.trim(), link: a.href.includes('http') ? a.href : BASE + a.getAttribute('href') });
        });

        document.getElementById('episodeGrid').innerHTML = eps.map(ep => `
            <div class="item-card" style="min-width:140px;" onclick="playVideo('${ep.link}', '${ep.title}')">
                <div class="title" style="position:relative; background:var(--card-bg); border-radius:4px;">${ep.title}</div>
            </div>
        `).join('');
    }

    async function playVideo(link, title) {
        const player = document.getElementById('mainVideo');
        const overlay = document.getElementById('playerOverlay');
        const historyMsg = document.getElementById('historyMsg');
        
        overlay.style.display = 'block';
        document.getElementById('videoTitle').innerText = title;
        window.currentPlayingLink = link;

        // التحقق من سجل المشاهدة في Supabase
        let startTime = 0;
        if (currentUser) {
            const { data } = await db.from('watch_history').select('*').eq('user_id', currentUser.id).eq('episode_link', link).maybeSingle();
            if (data) {
                startTime = data.last_position;
                historyMsg.innerText = `ستستأنف المشاهدة من دقيقة ${Math.floor(startTime/60)}`;
                historyMsg.style.display = 'inline-block';
            }
        }

        try {
            const html = await (await fetch(PROXY(link))).text();
            const id = html.match(/go\.ak\.sv\/link\/([a-zA-Z0-9]+)/)?.[1];
            
            // استخدام /download/ دائماً للمسلسلات والأفلام
            const dlUrl = link.replace('/episode/', '/download/').replace('/movie/', '/download/').replace(/\/download\/$/, `/download/${id}/`);
            
            const dlHtml = await (await fetch(PROXY(dlUrl))).text();
            const mp4 = new DOMParser().parseFromString(dlHtml, 'text/html').querySelector('a[href*=".mp4"]')?.href;
            
            if (mp4) {
                player.src = mp4;
                player.onloadedmetadata = () => {
                    if (startTime > 5) player.currentTime = startTime;
                    player.play();
                };
            }
        } catch (e) { alert("خطأ في جلب الرابط"); }
    }

    async function syncProgress() {
        const video = document.getElementById('mainVideo');
        if (currentUser && window.currentPlayingLink && !video.paused) {
            const pos = Math.floor(video.currentTime);
            if (pos > 10) {
                await db.from('watch_history').upsert({
                    user_id: currentUser.id,
                    episode_link: window.currentPlayingLink,
                    last_position: pos,
                    updated_at: new Date()
                }, { onConflict: 'user_id, episode_link' });
            }
        }
    }

    function closePlayer() {
        const v = document.getElementById('mainVideo');
        v.pause();
        v.src = "";
        document.getElementById('playerOverlay').style.display = 'none';
    }
    
    function closeSearch() { document.getElementById('search-section').classList.add('hidden'); }

    checkUser();
</script>
</body>
</html>
