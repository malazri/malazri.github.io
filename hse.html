<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>HSE Induction | Oil &amp; Gas Site Access</title>
<meta name="description" content="Mobile HSE induction and digital pass system for site access." />

<!-- ============================================================
     Tailwind CSS (Play CDN) — utility classes, no build step.
     Custom brand colors are registered so classes like
     bg-hse-yellow / text-hse-navy work throughout app.js.
     ============================================================ -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          "hse-navy": "#0F1B2B",
          "hse-yellow": "#F2B705",
          "hse-red": "#C53030",
          "hse-green": "#2F855A"
        }
      }
    }
  };
</script>

<!-- Font Awesome — icon set used across slides, quiz, and admin UI -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />

<!-- Google Fonts — Barlow Condensed for headings, Barlow for body copy -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet" />

<!-- Project stylesheet: custom theme, cards, pass, admin layout -->
<link rel="stylesheet" href="style.css" />
</head>

<body>

  <!-- ============================================================
       APP SHELL
       #app-shell is the visual "device frame": capped width on
       mobile, widened via body.admin-mode when the Admin
       Dashboard is active (see style.css).
       ============================================================ -->
  <div id="app-shell">

    <!-- Header: brand (tap to return to welcome) + hidden admin entry -->
    <header class="app-header">
      <button id="app-title-btn" class="brand" aria-label="Return to induction start">
        <i class="fa-solid fa-hard-hat"></i>
        <span>HSE Induction</span>
      </button>
      <button id="admin-entry-btn" class="admin-gear-btn" aria-label="Admin access">
        <i class="fa-solid fa-gear"></i>
      </button>
    </header>

    <!-- SPA mount point — app.js swaps everything inside this on each render() -->
    <main id="app-root"></main>

  </div>

  <!-- ============================================================
       SCRIPTS — order matters: data.js seeds window.DEFAULT_DATA,
       app.js consumes it once the DOM is ready.
       ============================================================ -->
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
