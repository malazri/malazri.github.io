<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FC 26 Tournament Wizard</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Force explicit viewport constraints to prevent mobile browser chrome scrolling bugs */
        html, body { height: 100%; max-height: 100%; overflow: hidden; position: fixed; width: 100%; }
        
        /* Custom scrollbar to keep layout premium and minimal */
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 99px; }
        ::-webkit-scrollbar-thumb:hover { background: #10b981; }

        /* Knockout tree connection node indicators for Desktop view */
        @media (min-width: 1024px) {
            .tree-column { width: 240px; min-width: 240px; }
            .tree-connector::after {
                content: ''; position: absolute; right: -16px; top: 50%;
                width: 16px; height: 2px; background: #334155;
            }
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased selection:bg-emerald-500 selection:text-slate-950">

    <!-- FIXED APPARATUS CORE SHELL FRAME Container -->
    <div class="fixed inset-0 w-full h-full p-3 flex flex-col justify-between box-border">
        
        <!-- HEADER COMPONENT -->
        <header class="bg-slate-900 border border-slate-800 h-12 md:h-14 rounded-xl flex items-center justify-between px-3 md:px-4 shadow-md shrink-0">
            <h1 class="text-xs md:text-base font-black tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-cyan-400">
                🎮 FC 26 WIZARD
            </h1>
            
            <!-- Wizard Badge Steps -->
            <div class="flex items-center space-x-1 md:space-x-3 text-[10px] md:text-[11px] font-bold">
                <div id="badge-1" class="px-1.5 py-0.5 rounded bg-emerald-500 text-slate-950 transition-all duration-300">1. Setup</div>
                <div class="text-slate-700 text-[8px]"><i class="fa-solid fa-chevron-right"></i></div>
                <div id="badge-2" class="px-1.5 py-0.5 rounded bg-slate-800 text-slate-500 transition-all duration-300">2. Pool</div>
                <div class="text-slate-700 text-[8px]"><i class="fa-solid fa-chevron-right"></i></div>
                <div id="badge-3" class="px-1.5 py-0.5 rounded bg-slate-800 text-slate-500 transition-all duration-300">3. Squads</div>
                <div class="text-slate-700 text-[8px]"><i class="fa-solid fa-chevron-right"></i></div>
                <div id="badge-4" class="px-1.5 py-0.5 rounded bg-slate-800 text-slate-500 transition-all duration-300">4. Fixtures</div>
            </div>
        </header>

        <!-- MAIN VIEWPORT STAGE CONTAINER (Expanded dynamically between fixed header and footer elements) -->
        <div class="flex-1 my-2.5 bg-slate-900/40 border border-slate-800/80 rounded-2xl p-3 md:p-5 shadow-2xl flex flex-col overflow-hidden relative">
            
            <!-- STEP 1: PLAYERS INPUT & SQUAD FORMAT -->
            <div id="step-view-1" class="wizard-step flex flex-col h-full space-y-3 min-h-0">
                <div class="shrink-0">
                    <h2 class="text-xs md:text-base font-bold text-emerald-400"><i class="fa-solid fa-users mr-2"></i>Competitors Layout Setup</h2>
                </div>
                <div class="flex-1 grid grid-cols-1 md:grid-cols-2 gap-3 overflow-hidden min-h-0">
                    <div class="flex flex-col h-full min-h-0">
                        <textarea id="playerNames" class="w-full h-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-slate-200 focus:outline-none focus:border-emerald-500 placeholder-slate-700 resize-none font-mono" oninput="validateStepOne()">Marwan&#10;Amira&#10;Yousef&#10;Ali</textarea>
                    </div>
                    <div class="flex flex-col justify-center space-y-2 shrink-0">
                        <div class="grid grid-cols-1 gap-2">
                            <label class="flex items-center justify-between p-3 bg-slate-950 border border-slate-800 rounded-xl cursor-pointer hover:border-slate-700 transition">
                                <div class="flex items-center space-x-3">
                                    <i class="fa-solid fa-user text-emerald-400 text-sm"></i>
                                    <div class="text-xs font-bold">Singles Matchup (1v1)</div>
                                </div>
                                <input type="radio" name="groupSize" value="1" checked class="accent-emerald-500 w-4 h-4">
                            </label>
                            <label class="flex items-center justify-between p-3 bg-slate-950 border border-slate-800 rounded-xl cursor-pointer hover:border-slate-700 transition">
                                <div class="flex items-center space-x-3">
                                    <i class="fa-solid fa-user-group text-cyan-400 text-sm"></i>
                                    <div class="text-xs font-bold">Co-Op Partnership (2v2)</div>
                                </div>
                                <input type="radio" name="groupSize" value="2" class="accent-emerald-500 w-4 h-4">
                            </label>
                        </div>
                    </div>
                </div>
            </div>

            <!-- STEP 2: TEAM POOL CONTROL STRIPS -->
            <div id="step-view-2" class="wizard-step hidden flex flex-col h-full space-y-2 min-h-0">
                <div class="flex flex-col sm:flex-row justify-between sm:items-center shrink-0 gap-2">
                    <h2 class="text-xs md:text-base font-bold text-emerald-400"><i class="fa-solid fa-shield-halved mr-2"></i>FC 26 Filter Pool</h2>
                    
                    <!-- SOURCE TOGGLE: Predefined vs Custom -->
                    <div class="flex bg-slate-950 p-0.5 rounded-lg border border-slate-800 text-[10px] font-bold">
                        <label class="cursor-pointer relative">
                            <input type="radio" name="poolSource" value="predefined" class="peer sr-only" checked onchange="togglePoolSource()">
                            <div class="px-2 py-0.5 rounded text-slate-500 peer-checked:bg-emerald-500 peer-checked:text-slate-950 transition">Predefined</div>
                        </label>
                        <label class="cursor-pointer relative">
                            <input type="radio" name="poolSource" value="custom" class="peer sr-only" onchange="togglePoolSource()">
                            <div class="px-2 py-0.5 rounded text-slate-500 peer-checked:bg-emerald-500 peer-checked:text-slate-950 transition">Custom Name</div>
                        </label>
                    </div>
                </div>

                <!-- PREDEFINED POOL WRAPPER -->
                <div id="predefinedPoolWrapper" class="flex flex-col flex-1 min-h-0 space-y-2">
                    <div class="flex justify-between items-center shrink-0 gap-2">
                        <div class="flex bg-slate-950 p-0.5 rounded-lg border border-slate-800 text-[9px] md:text-[10px] font-bold">
                            <button onclick="filterTeamType('all')" id="tab-all" class="px-2 py-0.5 rounded bg-emerald-500 text-slate-950 transition">All</button>
                            <button onclick="filterTeamType('club')" id="tab-club" class="px-2 py-0.5 rounded text-slate-400 hover:text-slate-200 transition">Clubs</button>
                            <button onclick="filterTeamType('national')" id="tab-national" class="px-2 py-0.5 rounded text-slate-400 hover:text-slate-200 transition">Nationals</button>
                        </div>
                        <div class="grid grid-cols-3 gap-1 bg-slate-950 p-1 rounded-xl border border-slate-800 text-[9px] md:text-[10px] shrink-0 text-center">
                            <div>All: <button onclick="bulkSelect('all', true)" class="bg-slate-800 hover:bg-emerald-500 px-1 py-0.5 rounded ml-1"><i class="fa-solid fa-check text-[8px]"></i></button><button onclick="bulkSelect('all', false)" class="bg-slate-800 hover:bg-rose-500 px-1 py-0.5 rounded ml-0.5"><i class="fa-solid fa-times text-[8px]"></i></button></div>
                            <div class="border-x border-slate-800">Clubs: <button onclick="bulkSelect('club', true)" class="bg-slate-800 hover:bg-emerald-500 px-1 py-0.5 rounded ml-1"><i class="fa-solid fa-check text-[8px]"></i></button><button onclick="bulkSelect('club', false)" class="bg-slate-800 hover:bg-rose-500 px-1 py-0.5 rounded ml-0.5"><i class="fa-solid fa-times text-[8px]"></i></button></div>
                            <div>Nat: <button onclick="bulkSelect('national', true)" class="bg-slate-800 hover:bg-emerald-500 px-1 py-0.5 rounded ml-1"><i class="fa-solid fa-check text-[8px]"></i></button><button onclick="bulkSelect('national', false)" class="bg-slate-800 hover:bg-rose-500 px-1 py-0.5 rounded ml-0.5"><i class="fa-solid fa-times text-[8px]"></i></button></div>
                        </div>
                    </div>

                    <!-- Checklist scroll area container -->
                    <div class="flex-1 overflow-y-auto bg-slate-950 border border-slate-800 rounded-xl p-2 grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-1 min-h-0" id="teamsListContainer"></div>
                    <div class="text-right text-[9px] text-slate-500 shrink-0">Selected count: <strong id="selectedCount" class="text-emerald-400">0</strong></div>
                </div>

                <!-- CUSTOM POOL WRAPPER -->
                <div id="customPoolWrapper" class="hidden flex-col flex-1 min-h-0 space-y-2">
                    <textarea id="customTeamNames" class="w-full h-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-slate-200 focus:outline-none focus:border-emerald-500 placeholder-slate-700 resize-none font-mono" oninput="validateStepTwo()" placeholder="Enter custom team names here...&#10;One team per line.&#10;&#10;Examples:&#10;Red Dragons&#10;Shadow Knights&#10;AlAzri FC"></textarea>
                    <div class="text-right text-[9px] text-slate-500 shrink-0">Custom count: <strong id="customSelectedCount" class="text-emerald-400">0</strong></div>
                </div>
            </div>

            <!-- STEP 3: ASSIGNED SQUADS SPREADSHEET CARD VIEWS -->
            <div id="step-view-3" class="wizard-step hidden flex flex-col h-full space-y-2 min-h-0">
                <h2 class="text-xs md:text-base font-bold text-cyan-400 shrink-0"><i class="fa-solid fa-dice mr-2"></i>Rerolled Squad Outputs</h2>
                <div id="resultsContainer" class="flex-1 overflow-y-auto grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-1.5 pr-1 min-h-0"></div>
            </div>

            <!-- STEP 4: HARD Knockout visual tree bracket & structures -->
            <div id="step-view-4" class="wizard-step hidden flex flex-col h-full space-y-2 min-h-0">
                <div class="flex flex-col sm:flex-row justify-between sm:items-center shrink-0 gap-2 border-b border-slate-800/60 pb-1.5">
                    <div class="flex items-center space-x-2">
                        <select id="scheduleFormat" onchange="toggleFormatTabVisibilities()" class="bg-slate-950 border border-slate-800 text-xs font-bold text-slate-200 rounded-lg p-1.5 focus:outline-none focus:border-amber-400">
                            <option value="knockout">Knockout (Visual Tree)</option>
                            <option value="league">League (Round Robin)</option>
                            <option value="groups">Group Stage (A / B)</option>
                        </select>
                        <button onclick="generateSchedule()" class="bg-amber-500 hover:bg-amber-600 text-slate-950 text-xs font-black px-3 py-1.5 rounded-lg transition uppercase tracking-wider">
                            Build
                        </button>
                    </div>
                    
                    <!-- Mobile view tabs navigation framework container (Hidden on Desktop) -->
                    <div id="mobileRoundTabs" class="flex lg:hidden bg-slate-950 border border-slate-800 p-0.5 rounded-lg overflow-x-auto text-[9px] font-bold space-x-1 max-w-full"></div>
                </div>

                <!-- Layout Wrapper Frame -->
                <div class="flex-1 overflow-hidden min-h-0 relative">
                    <!-- Standard grid layout scroll engines for League and Groups -->
                    <div id="linearMatchesContainer" class="hidden h-full overflow-y-auto grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-2 pr-1"></div>

                    <!-- Specialized Horizontal Flex Layout specifically engine optimized for Knockout Trees -->
                    <div id="treeMatchesContainer" class="hidden h-full overflow-x-auto overflow-y-hidden lg:flex lg:space-x-8 pb-1 items-stretch"></div>
                </div>
            </div>

        </div>

        <!-- FOOTER CONFIGURATION BUTTON SYSTEM STRIP (Pinned safely into viewport view) -->
        <footer class="h-10 flex justify-between items-center shrink-0 px-1">
            <button id="prevBtn" onclick="moveWizard(-1)" class="invisible bg-slate-900 border border-slate-800 text-slate-200 font-bold text-xs uppercase tracking-wider py-1.5 px-4 rounded-xl transition">
                <i class="fa-solid fa-arrow-left mr-1"></i> Back
            </button>
            <button id="nextBtn" onclick="moveWizard(1)" class="bg-slate-800 text-slate-400 font-bold text-xs uppercase tracking-wider py-1.5 px-4 rounded-xl transition">
                Next <i class="fa-solid fa-arrow-right ml-1"></i>
            </button>
        </footer>

    </div>

    <!-- Engine Script Runtime Configuration -->
    <script>
        const fc26TeamsRaw = [
            { name: "Real Madrid", type: "club" }, { name: "Manchester City", type: "club" },
            { name: "Arsenal", type: "club" }, { name: "FC Barcelona", type: "club" },
            { name: "Liverpool", type: "club" }, { name: "Bayern Munich", type: "club" },
            { name: "Paris Saint-Germain", type: "club" }, { name: "Bayer Leverkusen", type: "club" },
            { name: "Inter Milan", type: "club" }, { name: "Juventus", type: "club" },
            { name: "Borussia Dortmund", type: "club" }, { name: "Atletico Madrid", type: "club" },
            { name: "Manchester United", type: "club" }, { name: "Chelsea", type: "club" },
            { name: "AC Milan", type: "club" }, { name: "Aston Villa", type: "club" },
            { name: "Sporting CP", type: "club" }, { name: "Benfica", type: "club" },
            { name: "Argentina", type: "national" }, { name: "France", type: "national" },
            { name: "Brazil", type: "national" }, { name: "England", type: "national" },
            { name: "Spain", type: "national" }, { name: "Portugal", type: "national" },
            { name: "Germany", type: "national" }, { name: "Italy", type: "national" },
            { name: "Netherlands", type: "national" }, { name: "Morocco", type: "national" },
            { name: "Croatia", type: "national" }, { name: "Uruguay", type: "national" },
            { name: "Japan", type: "national" }, { name: "United States", type: "national" }
        ];

        let currentStep = 1, selectedTeamsMap = {}, currentFilterType = 'all', generatedSquads = [];

        document.addEventListener("DOMContentLoaded", () => {
            fc26TeamsRaw.forEach(t => selectedTeamsMap[t.name] = true);
            renderTeamsList();
            validateStepOne();
        });

        function validateStepOne() {
            const names = document.getElementById("playerNames").value.split('\n').map(n => n.trim()).filter(n => n !== '');
            toggleNextButton(names.length > 0);
        }

        // Toggles between the predefined checkboxes and custom text area
        function togglePoolSource() {
            const isPredefined = document.querySelector('input[name="poolSource"]:checked').value === 'predefined';
            const preDefWrapper = document.getElementById("predefinedPoolWrapper");
            const customWrapper = document.getElementById("customPoolWrapper");

            if (isPredefined) {
                preDefWrapper.classList.remove("hidden"); preDefWrapper.classList.add("flex");
                customWrapper.classList.add("hidden"); customWrapper.classList.remove("flex");
            } else {
                preDefWrapper.classList.add("hidden"); preDefWrapper.classList.remove("flex");
                customWrapper.classList.remove("hidden"); customWrapper.classList.add("flex");
            }
            validateStepTwo();
        }

        function validateStepTwo() {
            const isPredefined = document.querySelector('input[name="poolSource"]:checked').value === 'predefined';
            let activeCount = 0;

            if (isPredefined) {
                activeCount = Object.values(selectedTeamsMap).filter(v => v).length;
                document.getElementById("selectedCount").innerText = activeCount;
            } else {
                const customNames = document.getElementById("customTeamNames").value.split('\n').map(n => n.trim()).filter(n => n !== '');
                activeCount = customNames.length;
                document.getElementById("customSelectedCount").innerText = activeCount;
            }

            toggleNextButton(activeCount > 0);
        }

        function toggleNextButton(active) {
            const btn = document.getElementById("nextBtn");
            btn.disabled = !active;
            if (active) {
                btn.className = "bg-gradient-to-r from-emerald-500 to-cyan-500 text-slate-950 font-black text-xs uppercase tracking-wider py-1.5 px-4 rounded-xl shadow-lg transition opacity-100 cursor-pointer";
            } else {
                btn.className = "bg-slate-800 text-slate-500 font-bold text-xs uppercase tracking-wider py-1.5 px-4 rounded-xl transition opacity-40 cursor-not-allowed";
            }
        }

        function moveWizard(dir) {
            if (currentStep === 2 && dir === 1) runShuffleEngine();
            currentStep += dir;

            document.querySelectorAll(".wizard-step").forEach((view, idx) => {
                if (idx + 1 === currentStep) {
                    view.classList.remove("hidden");
                } else {
                    view.classList.add("hidden");
                }
            });

            const prevBtn = document.getElementById("prevBtn");
            if (currentStep === 1) {
                prevBtn.classList.add("invisible");
            } else {
                prevBtn.classList.remove("invisible");
                prevBtn.className = "bg-slate-900 border border-slate-800 text-slate-200 font-bold text-xs uppercase tracking-wider py-1.5 px-4 rounded-xl transition";
            }
            
            const nextBtn = document.getElementById("nextBtn");
            if (currentStep === 4) {
                nextBtn.classList.add("hidden");
            } else {
                nextBtn.classList.remove("hidden"); 
                if (currentStep === 1) validateStepOne();
                if (currentStep === 2) validateStepTwo();
                if (currentStep === 3) toggleNextButton(true);
            }

            for (let i = 1; i <= 4; i++) {
                document.getElementById(`badge-${i}`).className = i === currentStep 
                    ? "px-1.5 py-0.5 rounded bg-emerald-500 text-slate-950 transition-all duration-300" 
                    : i < currentStep ? "px-1.5 py-0.5 rounded bg-slate-800 text-emerald-400 border border-emerald-500/10" : "px-1.5 py-0.5 rounded bg-slate-800 text-slate-500";
            }
        }

        function renderTeamsList() {
            const container = document.getElementById("teamsListContainer");
            container.innerHTML = "";
            fc26TeamsRaw.forEach(team => {
                if (currentFilterType !== 'all' && team.type !== currentFilterType) return;
                const isChecked = selectedTeamsMap[team.name] ? 'checked' : '';
                container.innerHTML += `
                    <label class="flex items-center justify-between p-1 bg-slate-900 border border-slate-800/60 rounded-lg cursor-pointer hover:border-slate-700 transition select-none text-[10px]">
                        <div class="flex items-center space-x-1.5 overflow-hidden">
                            <input type="checkbox" data-name="${team.name}" ${isChecked} onchange="toggleTeamSelection(this)" class="accent-emerald-500 rounded bg-slate-950 w-3 h-3 shrink-0">
                            <span class="truncate text-slate-300">${team.name}</span>
                        </div>
                    </label>`;
            });
            document.getElementById("selectedCount").innerText = Object.values(selectedTeamsMap).filter(v => v).length;
        }

        function toggleTeamSelection(cb) { selectedTeamsMap[cb.getAttribute("data-name")] = cb.checked; renderTeamsList(); validateStepTwo(); }
        function filterTeamType(t) { currentFilterType = t; ['all','club','national'].forEach(x => document.getElementById(`tab-${x}`).className = x===t ? "px-2 py-0.5 rounded bg-emerald-500 text-slate-950 transition" : "px-2 py-0.5 rounded text-slate-400"); renderTeamsList(); }
        function bulkSelect(type, state) { fc26TeamsRaw.forEach(t => { if(type==='all' || t.type===type) selectedTeamsMap[t.name]=state; }); renderTeamsList(); validateStepTwo(); }
        function shuffleArray(arr) { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; }

        function runShuffleEngine() {
            const names = document.getElementById("playerNames").value.split('\n').map(n => n.trim()).filter(n => n !== '');
            const size = parseInt(document.querySelector('input[name="groupSize"]:checked').value);
            const needed = Math.ceil(names.length / size);
            
            // Collect the active pool dynamically based on user toggle choice
            let activePool = [];
            const isPredefined = document.querySelector('input[name="poolSource"]:checked').value === 'predefined';
            if (isPredefined) {
                activePool = fc26TeamsRaw.filter(t => selectedTeamsMap[t.name]);
            } else {
                const customNames = document.getElementById("customTeamNames").value.split('\n').map(n => n.trim()).filter(n => n !== '');
                activePool = customNames.map(n => ({ name: n, type: 'custom' }));
            }

            const randNames = shuffleArray([...names]);
            generatedSquads = [];
            const container = document.getElementById("resultsContainer");
            container.innerHTML = "";

            for (let i = 0; i < needed; i++) {
                // True random indexing: Allows different people/squads to draw the exact same team randomly
                const randomTeamInstance = activePool[Math.floor(Math.random() * activePool.length)];
                
                const sq = { 
                    id: i + 1, 
                    team: randomTeamInstance, 
                    players: randNames.slice(i * size, (i + 1) * size) 
                };
                generatedSquads.push(sq);
                
                const plMarkup = sq.players.map(p => `<span class="bg-slate-950 px-1.5 py-0.5 rounded text-slate-400 border border-slate-800 text-[10px]">${p}</span>`).join("");
                container.innerHTML += `
                    <div class="bg-slate-950 border border-slate-800 rounded-xl p-2 flex justify-between items-center shadow-inner">
                        <div class="overflow-hidden"><div class="text-[8px] text-slate-600 font-bold tracking-widest">SQUAD ${sq.id}</div><div class="flex gap-1 overflow-hidden truncate mt-0.5">${plMarkup}</div></div>
                        <div class="text-xs font-bold text-emerald-400 shrink-0 ml-2">${sq.team.name}</div>
                    </div>`;
            }
        }

        function toggleFormatTabVisibilities() {
            const f = document.getElementById("scheduleFormat").value;
            const tabContainer = document.getElementById("mobileRoundTabs");
            f === 'knockout' ? tabContainer.classList.remove("hidden") : tabContainer.classList.add("hidden");
        }

        function generateSchedule() {
            if (generatedSquads.length < 2) return alert("Need 2+ squads.");
            const format = document.getElementById("scheduleFormat").value;
            const linearContainer = document.getElementById("linearMatchesContainer");
            const treeContainer = document.getElementById("treeMatchesContainer");
            const mobileTabs = document.getElementById("mobileRoundTabs");

            linearContainer.innerHTML = ""; treeContainer.innerHTML = ""; mobileTabs.innerHTML = "";
            linearContainer.classList.add("hidden"); treeContainer.classList.add("hidden");

            if (format !== 'knockout') {
                linearContainer.classList.remove("hidden");
                if (format === 'league') {
                    let teams = [...generatedSquads]; if (teams.length % 2 !== 0) teams.push(null);
                    for (let r = 0; r < teams.length - 1; r++) {
                        for (let i = 0; i < teams.length / 2; i++) {
                            const h = teams[i], a = teams[teams.length - 1 - i];
                            if (h && a) linearContainer.innerHTML += buildMatchCard(h, a, `Day ${r + 1}`);
                        }
                        teams.splice(1, 0, teams.pop());
                    }
                } else {
                    const mid = Math.ceil(generatedSquads.length / 2);
                    const grps = [{n:'A', d:generatedSquads.slice(0,mid)}, {n:'B', d:generatedSquads.slice(mid)}];
                    grps.forEach(g => {
                        let teams = [...g.d]; if (teams.length % 2 !== 0) teams.push(null);
                        for (let r = 0; r < teams.length - 1; r++) {
                            for (let i = 0; i < teams.length / 2; i++) {
                                const h = teams[i], a = teams[teams.length - 1 - i];
                                if (h && a) linearContainer.innerHTML += buildMatchCard(h, a, `Group ${g.n} - MD ${r + 1}`);
                            }
                            teams.splice(1, 0, teams.pop());
                        }
                    });
                }
                return;
            }

            treeContainer.classList.remove("hidden");
            let roundsData = [];
            let currentRoundSquads = [...generatedSquads];
            let matchIdCounter = 1;

            let r1Matches = [];
            for (let i = 0; i < currentRoundSquads.length; i += 2) {
                r1Matches.push({ id: matchIdCounter++, home: currentRoundSquads[i], away: currentRoundSquads[i+1] || null });
            }
            roundsData.push({ label: "Round 1", matches: r1Matches });

            let prevMatches = r1Matches;
            while (prevMatches.length > 1) {
                let currentRoundMatches = [];
                let label = `Round ${roundsData.length + 1}`;
                if (prevMatches.length === 4) label = "Quarterfinals";
                if (prevMatches.length === 2) label = "Semifinals";

                for (let i = 0; i < prevMatches.length; i += 2) {
                    const m1 = prevMatches[i], m2 = prevMatches[i+1] || null;
                    currentRoundMatches.push({
                        id: matchIdCounter++,
                        home: { isPlaceholder: true, teamName: `Winner M${m1.id}` },
                        away: m2 ? { isPlaceholder: true, teamName: `Winner M${m2.id}` } : null
                    });
                }
                roundsData.push({ label: prevMatches.length === 2 ? "🏆 Final" : label, matches: currentRoundMatches });
                prevMatches = currentRoundMatches;
            }

            roundsData.forEach((round, rIdx) => {
                const roundId = `tree-round-${rIdx}`;
                
                mobileTabs.innerHTML += `
                    <button onclick="switchMobileRound(${rIdx}, ${roundsData.length})" id="tab-btn-${rIdx}" class="px-2 py-0.5 rounded ${rIdx===0 ? 'bg-amber-500 text-slate-950' : 'text-slate-400'} whitespace-nowrap transition">
                        ${round.label}
                    </button>`;

                const col = document.createElement("div");
                col.id = roundId;
                col.className = `tree-column flex flex-col justify-around h-full space-y-3 lg:space-y-0 shrink-0 ${rIdx === 0 ? 'flex' : 'hidden lg:flex'}`;
                
                round.matches.forEach(m => {
                    col.innerHTML += buildMatchCard(m.home, m.away, `Match M${m.id}`, format === 'knockout');
                });
                treeContainer.appendChild(col);
            });
        }

        function switchMobileRound(activeIdx, total) {
            for(let i=0; i<total; i++) {
                const col = document.getElementById(`tree-round-${i}`);
                const btn = document.getElementById(`tab-btn-${i}`);
                if(i === activeIdx) {
                    col.classList.remove("hidden"); col.classList.add("flex");
                    btn.className = "px-2 py-0.5 rounded bg-amber-500 text-slate-950 whitespace-nowrap transition";
                } else {
                    col.classList.add("hidden"); col.classList.remove("flex");
                    btn.className = "px-2 py-0.5 rounded text-slate-400 whitespace-nowrap transition";
                }
            }
        }

        function buildMatchCard(home, away, label, isTreeMode = false) {
            let hTitle = home?.isPlaceholder ? home.teamName : (home?.team?.name || home?.teamName || "TBD");
            let hPl = home?.isPlaceholder ? "TBD" : (home?.players?.map(p=>p).join(" & ") || "");
            let aTitle = !away ? "BYE" : (away.isPlaceholder ? away.teamName : (away.team?.name || away.teamName || "TBD"));
            let aPl = !away ? "Progression" : (away.isPlaceholder ? "TBD" : (away.players?.map(p=>p).join(" & ") || ""));

            const treeUtilityClass = isTreeMode ? "tree-connector" : "";

            return `
            <div class="bg-slate-950/90 border border-slate-800/80 rounded-xl p-2 relative flex flex-col justify-center min-h-[54px] shadow-sm ${treeUtilityClass}">
                <span class="absolute -top-1.5 left-2 bg-slate-900 border border-slate-800 text-amber-400 text-[8px] font-bold px-1.5 py-0.2 rounded">${label}</span>
                <div class="flex justify-between items-center text-[10px] w-full mt-1">
                    <div class="w-[43%] text-left overflow-hidden">
                        <div class="font-bold text-slate-200 truncate">${hTitle}</div>
                        <div class="text-[8px] text-slate-500 truncate mt-0.5">${hPl}</div>
                    </div>
                    <div class="w-[14%] text-center text-[8px] font-black text-slate-700">VS</div>
                    <div class="w-[43%] text-right overflow-hidden">
                        <div class="font-bold text-slate-200 truncate">${aTitle}</div>
                        <div class="text-[8px] text-slate-500 truncate mt-0.5">${aPl}</div>
                    </div>
                </div>
            </div>`;
        }
    </script>
</body>
</html>
