<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Match Tracker & Team Selection</title>
    <style>
        :root {
            --primary: #10b981;
            --primary-hover: #059669;
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: var(--bg-card);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border);
        }

        h2 {
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 1.5rem;
            text-align: center;
            color: var(--text-main);
        }

        .team-selection-block {
            background: rgba(15, 23, 42, 0.4);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
        }

        .block-title {
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--primary);
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* Radio Toggle Styles */
        .source-toggle {
            display: flex;
            gap: 16px;
            margin-bottom: 12px;
        }

        .radio-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            color: var(--text-muted);
            cursor: pointer;
            user-select: none;
        }

        .radio-label input[type="radio"] {
            accent-color: var(--primary);
            margin: 0;
            width: 16px;
            height: 16px;
        }

        .radio-label input[type="radio"]:checked + span {
            color: var(--text-main);
            font-weight: 500;
        }

        /* Form Controls */
        .field-group {
            position: relative;
        }

        select, input[type="text"] {
            width: 100%;
            padding: 10px 12px;
            background-color: var(--bg-dark);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 1rem;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        select:focus, input[type="text"]:focus {
            outline: none;
            border-color: var(--primary);
        }

        .hidden {
            display: none !important;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Match Setup</h2>
    
    <form id="matchForm" onsubmit="handleSubmit(event)">
        <!-- Team 1 Selection -->
        <div class="team-selection-block">
            <div class="block-title">Team 1 (Home)</div>
            
            <div class="source-toggle">
                <label class="radio-label">
                    <input type="radio" name="team1Source" value="predefined" checked onchange="toggleTeamSource(1)">
                    <span>Predefined</span>
                </label>
                <label class="radio-label">
                    <input type="radio" name="team1Source" value="custom" onchange="toggleTeamSource(1)">
                    <span>Custom Name</span>
                </label>
            </div>

            <div class="field-group">
                <select id="team1Dropdown">
                    <option value="" disabled selected>Select a team...</option>
                    <option value="Real Madrid">Real Madrid</option>
                    <option value="Manchester City">Manchester City</option>
                    <option value="Bayern Munich">Bayern Munich</option>
                    <option value="Paris Saint-Germain">Paris Saint-Germain</option>
                    <option value="Barcelona">Barcelona</option>
                </select>
                <input type="text" id="team1Custom" class="hidden" placeholder="Enter custom team name...">
            </div>
        </div>

        <!-- Team 2 Selection -->
        <div class="team-selection-block">
            <div class="block-title">Team 2 (Away)</div>
            
            <div class="source-toggle">
                <label class="radio-label">
                    <input type="radio" name="team2Source" value="predefined" checked onchange="toggleTeamSource(2)">
                    <span>Predefined</span>
                </label>
                <label class="radio-label">
                    <input type="radio" name="team2Source" value="custom" onchange="toggleTeamSource(2)">
                    <span>Custom Name</span>
                </label>
            </div>

            <div class="field-group">
                <select id="team2Dropdown">
                    <option value="" disabled selected>Select a team...</option>
                    <option value="Real Madrid">Real Madrid</option>
                    <option value="Manchester City">Manchester City</option>
                    <option value="Bayern Munich">Bayern Munich</option>
                    <option value="Paris Saint-Germain">Paris Saint-Germain</option>
                    <option value="Barcelona">Barcelona</option>
                </select>
                <input type="text" id="team2Custom" class="hidden" placeholder="Enter custom team name...">
            </div>
        </div>

        <button type="submit">Start Match</button>
    </form>
</div>

<script>
    // Handles toggling visibility between dropdown and text input
    function toggleTeamSource(teamNum) {
        const selectedSource = document.querySelector(`input[name="team${teamNum}Source"]:checked`).value;
        const dropdown = document.getElementById(`team${dropdownField(teamNum)}`);
        const customInput = document.getElementById(`team${customField(teamNum)}`);

        if (selectedSource === 'predefined') {
            document.getElementById(`team${teamNum}Dropdown`).classList.remove('hidden');
            document.getElementById(`team${teamNum}Custom`).classList.add('hidden');
            document.getElementById(`team${teamNum}Custom`).value = ''; // Reset custom input
        } else {
            document.getElementById(`team${teamNum}Dropdown`).classList.add('hidden');
            document.getElementById(`team${teamNum}Custom`).classList.remove('hidden');
            document.getElementById(`team${teamNum}Dropdown`).selectedIndex = 0; // Reset dropdown selection
        }
    }

    // Helper functions for IDs to avoid template literal syntax issues in raw strings
    function dropdownField(num) { return num + 'Dropdown'; }
    function customField(num) { return num + 'Custom'; }

    // Form submission processing
    function handleSubmit(event) {
        event.preventDefault();
        
        let team1Name = '';
        let team2Name = '';

        // Get Team 1 Value
        const team1Source = document.querySelector('input[name="team1Source"]:checked').value;
        if (team1Source === 'predefined') {
            team1Name = document.getElementById('team1Dropdown').value;
        } else {
            team1Name = document.getElementById('team1Custom').value.trim();
        }

        // Get Team 2 Value
        const team2Source = document.querySelector('input[name="team2Source"]:checked').value;
        if (team2Source === 'predefined') {
            team2Name = document.getElementById('team2Dropdown').value;
        } else {
            team2Name = document.getElementById('team2Custom').value.trim();
        }

        // Validation
        if (!team1Name) {
            alert('Please select or enter a name for Team 1.');
            return;
        }
        if (!team2Name) {
            alert('Please select or enter a name for Team 2.');
            return;
        }
        if (team1Name.toLowerCase() === team2Name.toLowerCase()) {
            alert('A team cannot play against itself. Please choose two different names.');
            return;
        }

        // Output results to console log (or handle your navigation/state logic here)
        console.log('Match Initialized:', { team1: team1Name, team2: team2Name });
        alert('Match Started!\n' + team1Name + ' vs ' + team2Name);
    }
</script>

</body>
</html>
