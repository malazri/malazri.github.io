<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FC 26 Squad Shuffler & Tournament Maker</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans antialiased pb-12">

    <!-- Header -->
    <header class="bg-slate-800 border-b border-slate-700 py-6 text-center shadow-lg">
        <h1 class="text-3xl font-extrabold tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-cyan-400">
            🎮 FC 26 TOURNAMENT MAKER
        </h1>
        <p class="text-slate-400 text-sm mt-1">Shuffle players, assign teams, and generate match schedules</p>
    </header>

    <!-- Top Workspace: Setup & Shuffling -->
    <main class="max-w-7xl mx-auto p-4 md:p-8 grid grid-cols-1 lg:grid-cols-3 gap-8">
        
        <!-- Left Column: Inputs -->
        <div class="lg:col-span-1 space-y-6">
            <div class="bg-slate-800 p-5 rounded-xl border border-slate-700 shadow-md">
                <h2 class="text-lg font-bold mb-3 text-emerald-400"><i class="fa-solid fa-users mr-2"></i>1. Enter Players</h2>
                <textarea id="playerNames" rows="5" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-slate-200 focus:outline-none focus:border-emerald-500 placeholder-slate-600" placeholder="Marwan&#10;Amira&#10;Yousef&#10;Ali"></textarea>
            </div>

            <div class="bg-slate-800 p-5 rounded-xl border border-slate-700 shadow-md">
                <h2 class="text-lg font-bold mb-3 text-emerald-400"><i class="fa-solid fa-sliders mr-2"></i>2. Group Format</h2>
                <div class="grid grid-cols-2 gap-3">
                    <label class="flex items-center justify-between p-3 bg-slate-900 border border-slate-700 rounded-lg cursor-pointer hover:border-slate-500 transition">
                        <span class="text-sm font-medium">1v1</span>
                        <input type="radio" name="groupSize" value="1" checked class="accent-emerald-500 w-4 h-4">
                    </label>
                    <label class="flex items-center justify-between p-3 bg-slate-900 border border-slate-700 rounded-lg cursor-pointer hover:border-slate-500 transition">
                        <span class="text-sm font-medium">2v2</span>
                        <input type="radio" name="groupSize" value="2" class="accent-emerald-500 w-4 h-4">
                    </label>
                </div>
            </div>

            <button id="shuffleBtn" class="w-full bg-gradient-to-r from-emerald-500 to-cyan-500 hover:from-emerald-600 hover:to-cyan-600 text-slate-900 font-bold py-4 px-6 rounded-xl shadow-lg transform active:scale-95 transition text-center uppercase tracking-wider text-lg">
                <i class="fa-solid fa-shuffle mr-2"></i> Generate Squads
            </button>
        </div>

        <!-- Middle Column: Team Pool & Bulk Actions -->
        <div class="lg:col-span-1 bg-slate-800 p-5 rounded-xl border border-slate-700 shadow-md flex flex-col h-[calc(100vh-12rem)] min-h-[500px]">
            <div class="mb-4">
                <h2 class="text-lg font-bold text-emerald-400"><i class="fa-solid fa-shield-halved mr-2"></i>3. FC 26 Teams Pool</h2>
                
                <!-- Bulk Selection Actions -->
                <div class="bg-slate-900 border border-slate-700 p-2 rounded-lg mt-3 mb-3 text-xs">
                    <div class="grid grid-cols-3 gap-2 text-center mb-1 font-semibold text-slate-500">
                        <span>All</span><span>Clubs</span><span>Nationals</span>
                    </div>
                    <div class="grid grid-cols-3 gap-2">
                        <div class="flex space-x-1">
                            <button onclick="bulkSelect('all', true)" class="flex-1 bg-slate-700 hover:bg-emerald-600 text-white py-1 rounded transition"><i class="fa-solid fa-check"></i></button>
                            <button onclick="bulkSelect('all', false)" class="flex-1 bg-slate-700 hover:bg-rose-600 text-white py-1 rounded transition"><i class="fa-solid fa-times"></i></button>
                        </div>
                        <div class="flex space-x-1">
                            <button onclick="bulkSelect('club', true)" class="flex-1 bg-slate-700 hover:bg-emerald-600 text-white py-1 rounded transition"><i class="fa-solid fa-check"></i></button>
                            <button onclick="bulkSelect('club', false)" class="flex-1 bg-slate-700 hover:bg-rose-600 text-white py-1 rounded transition"><i class="fa-solid fa-times"></i></button>
                        </div>
                        <div class="flex space-x-1">
                            <button onclick="bulkSelect('national', true)" class="flex-1 bg-slate-700 hover:bg-emerald-600 text-white py-1 rounded transition"><i class="fa-solid fa-check"></i></button>
                            <button onclick="bulkSelect('national', false)" class="flex-1 bg-slate-700 hover:bg-rose-600 text-white py-1 rounded transition"><i class="fa-solid fa-times"></i></button>
                        </div>
                    </div>
                </div>

                <!-- Quick Filter View Tabs -->
                <div class="grid grid-cols-3 gap-2 bg-slate-900 p-1 rounded-lg border border-slate-700">
                    <button onclick="filterTeamType('all')" id="tab-all" class="text-xs py-1.5 px-2 rounded font-medium bg-emerald-500 text-slate-900 transition">View All</button>
                    <button onclick="filterTeamType('club')" id="tab-club" class="text-xs py-1.5 px-2 rounded font-medium text-slate-400 hover:text-slate-200 transition">View Clubs</button>
                    <button onclick="filterTeamType('national')" id="tab-national" class="text-xs py-1.5 px-2 rounded font-medium text-slate-400 hover:text-slate-200 transition">View Nat.</button>
                </div>
            </div>

            <!-- Scrollable Team Checkbox List -->
            <div class="flex-1 overflow-y-auto bg-slate-900 border border-slate-700 rounded-lg p-2 space-y-1" id="teamsListContainer"></div>
            
            <div class="mt-3 pt-3 border-t border-slate-700 flex justify-between text-xs text-slate-400">
                <span>Selected Teams: <strong id="selectedCount" class="text-emerald-400">0</strong></span>
            </div>
        </div>

        <!-- Right Column: Results Display -->
        <div class="lg:col-span-1 bg-slate-800 p-5 rounded-xl border border-slate-700 shadow-md flex flex-col h-[calc(100vh-12rem)] min-h-[500px]">
            <h2 class="text-lg font-bold mb-3 text-cyan-400"><i class="fa-solid fa-trophy mr-2"></i>4. Assignments</h2>
            <div id="resultsContainer" class="flex-1 overflow-y-auto space-y-3 pr-1">
                <div class="flex flex-col justify-center items-center h-full text-slate-500 text-center">
                    <i class="fa-solid fa-gamepad text-5xl mb-3 text-slate-700"></i>
                    <p class="text-sm">Awaiting Shuffle...</p>
                </div>
            </div>
        </div>

    </main>

    <!-- Bottom Workspace: Schedule Generation (Hidden until teams are shuffled) -->
    <section id="scheduleSection" class="max-w-7xl mx-auto p-4 md:p-8 pt-0 hidden">
        <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-lg">
            <div class="flex flex-col md:flex-row justify-between items-center mb-6 border-b border-slate-700 pb-4">
                <h2 class="text-xl font-bold text-amber-400"><i class="fa-regular fa-calendar-days mr-2"></i>5. Tournament Schedule</h2>
                <div class="flex space-x-3 mt-4 md:mt-0 w-full md:w-auto">
                    <select id="scheduleFormat" class="bg-slate-900 border border-slate-600 text-slate-200 rounded-lg p-2 focus:outline-none focus:border-amber-400">
                        <option value="league">League (Round Robin)</option>
                        <option value="knockout">Knockout Bracket</option>
                        <option value="groups">Group Stage</option>
                    </select>
                    <button onclick="generateSchedule()" class="bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold py-2 px-6 rounded-lg shadow transition">
                        Generate Matches
                    </button>
                </div>
            </div>
            
            <div id="matchesContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                <p class="text-slate-500 text-sm col-span-full">Select a format and click generate.</p>
            </div>
        </div>
    </section>

    <!-- App System Logic Script -->
    <script>
        const fc26TeamsRaw = [
            { name: "Real Madrid", type: "club" }, { name: "Manchester City", type: "club" },
            { name: "Arsenal", type: "club" }, { name: "FC Barcelona", type: "club" },
            { name: "Liverpool", type: "club" }, { name: "Bayern Munich", type: "club" },
            { name: "Paris Saint-Germain", type: "club" }, { name: "Bayer Leverkusen", type: "club" },
            { name: "Inter Milan", type: "club" }, { name: "Juventus", type: "club" },
            { name: "Borussia Dortmund", type: "club" }, { name: "Atletico Madrid", type: "club" },
            { name: "Manchester United", type: "club" }, { name: "Chelsea", type: "club" },
            { name: "AC Milan", type: "club" }, { name: "Aston Villa", type: "club" },
            { name: "Sporting CP", type: "club" }, { name: "Benfica", type: "club" },
            { name: "Argentina", type: "national" }, { name: "France", type: "national" },
            { name: "Brazil", type: "national" }, { name: "England", type: "national" },
            { name: "Spain", type: "national" }, { name: "Portugal", type: "national" },
            { name: "Germany", type: "national" }, { name: "Italy", type: "national" },
            { name: "Netherlands", type: "national" }, { name: "Morocco", type: "national" },
            { name: "Croatia", type: "national" }, { name: "Uruguay", type: "national" },
            { name: "Japan", type: "national" }, { name: "United States", type: "national" }
        ];

        let selectedTeamsMap = {}; 
        let currentFilterType = 'all';
        let generatedSquads = []; // Global store for the schedule generator

        document.addEventListener("DOMContentLoaded", () => {
            fc26TeamsRaw.forEach(team => selectedTeamsMap[team.name] = true);
            renderTeamsList();
            document.getElementById("shuffleBtn").addEventListener("click", runShuffleEngine);
        });

        // --- TEAM SELECTION & UI ---
        function renderTeamsList() {
            const container = document.getElementById("teamsListContainer");
            container.innerHTML = "";
            fc26TeamsRaw.forEach(team => {
                if (currentFilterType !== 'all' && team.type !== currentFilterType) return;
                const isChecked = selectedTeamsMap[team.name] ? 'checked' : '';
                container.innerHTML += `
                    <div class="flex items-center justify-between p-2 hover:bg-slate-800 rounded transition">
                        <label class="flex items-center space-x-3 w-full cursor-pointer text-sm">
                            <input type="checkbox" data-name="${team.name}" ${isChecked} onchange="toggleTeamSelection(this)" class="accent-emerald-500 rounded bg-slate-900 w-4 h-4">
                            <span class="${team.type === 'national' ? 'text-cyan-400' : 'text-slate-200'}">${team.name}</span>
                        </label>
                        <span class="text-[10px] uppercase tracking-wider px-1.5 py-0.5 rounded ${team.type === 'national' ? 'bg-cyan-950 text-cyan-400' : 'bg-slate-800 text-slate-400'}">${team.type}</span>
                    </div>`;
            });
            updateMetricsCount();
        }

        function toggleTeamSelection(cb) { selectedTeamsMap[cb.getAttribute("data-name")] = cb.checked; updateMetricsCount(); }
        
        function filterTeamType(type) {
            currentFilterType = type;
            ['all', 'club', 'national'].forEach(t => {
                document.getElementById(`tab-${t}`).className = t === type ? "text-xs py-1.5 px-2 rounded font-medium bg-emerald-500 text-slate-900 transition" : "text-xs py-1.5 px-2 rounded font-medium text-slate-400 hover:text-slate-200 transition";
            });
            renderTeamsList();
        }

        function bulkSelect(targetType, state) {
            fc26TeamsRaw.forEach(team => {
                if (targetType === 'all' || team.type === targetType) selectedTeamsMap[team.name] = state;
            });
            renderTeamsList();
        }

        function updateMetricsCount() {
            document.getElementById("selectedCount").innerText = Object.values(selectedTeamsMap).filter(v => v).length;
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // --- SHUFFLE ENGINE ---
        function runShuffleEngine() {
            const names = document.getElementById("playerNames").value.split('\n').map(n => n.trim()).filter(n => n !== '');
            if (names.length === 0) return alert("Please enter at least one player name.");
            
            const groupSize = parseInt(document.querySelector('input[name="groupSize"]:checked').value);
            const totalGroupsNeeded = Math.ceil(names.length / groupSize);
            const activePool = fc26TeamsRaw.filter(team => selectedTeamsMap[team.name] === true);

            if (activePool.length === 0) return alert("Select at least one team from the pool!");

            const shuffledNames = shuffleArray([...names]);
            const shuffledTeams = shuffleArray([...activePool]);
            generatedSquads = [];

            const resultsContainer = document.getElementById("resultsContainer");
            resultsContainer.innerHTML = "";

            for (let i = 0; i < totalGroupsNeeded; i++) {
                const squad = {
                    id: i + 1,
                    team: shuffledTeams[i % shuffledTeams.length],
                    players: shuffledNames.slice(i * groupSize, (i + 1) * groupSize)
                };
                generatedSquads.push(squad);

                const playersMarkup = squad.players.map(p => `<span class="bg-slate-800 border border-slate-600 text-sm font-semibold px-2 py-0.5 rounded shadow-sm">${p}</span>`).join(" <span class='text-slate-600'>&</span> ");
                
                resultsContainer.innerHTML += `
                    <div class="bg-slate-900 border border-slate-700 rounded-xl p-3 flex justify-between items-center shadow hover:border-emerald-500 transition">
                        <div>
                            <div class="text-xs text-slate-500 font-bold mb-1">SQUAD ${squad.id}</div>
                            <div class="flex flex-wrap gap-1">${playersMarkup}</div>
                        </div>
                        <div class="text-right">
                            <div class="font-black text-emerald-400">${squad.team.name}</div>
                        </div>
                    </div>`;
            }
            
            // Reveal Scheduling Section
            document.getElementById("scheduleSection").classList.remove("hidden");
            document.getElementById("matchesContainer").innerHTML = '<p class="text-slate-500 text-sm col-span-full">Squads generated. Select a format and click Generate Matches.</p>';
        }

                // --- UPGRADED SCHEDULE GENERATOR ---
        function generateSchedule() {
            if (generatedSquads.length < 2) return alert("Need at least 2 squads to generate a schedule.");
            const format = document.getElementById("scheduleFormat").value;
            const container = document.getElementById("matchesContainer");
            container.innerHTML = ""; // Clear old schedule

            if (format === 'knockout') {
                let currentRoundSquads = [...generatedSquads];
                let roundNumber = 1;
                let matchIdCounter = 1;
                
                // Track matches created to reference them in subsequent rounds
                let previousRoundMatchIds = [];

                // --- ROUND 1 GENERATION ---
                let round1MatchesHTML = '';
                let currentRoundMatchIds = [];
                
                for (let i = 0; i < currentRoundSquads.length; i += 2) {
                    const home = currentRoundSquads[i];
                    const away = currentRoundSquads[i + 1] || null;
                    const matchId = matchIdCounter++;
                    currentRoundMatchIds.push(matchId);

                    round1MatchesHTML += buildMatchCard(home, away, `Round 1 - Match M${matchId}`);
                }
                
                container.innerHTML += round1MatchesHTML;
                previousRoundMatchIds = currentRoundMatchIds;

                // --- ADVANCED ROUNDS GENERATION (Until Final) ---
                // Calculate how many matches are left to get to 1 final match
                let matchesInCurrentRound = previousRoundMatchIds.length;
                
                while (matchesInCurrentRound > 1) {
                    roundNumber++;
                    let roundLabel = `Round ${roundNumber}`;
                    
                    // Assign recognizable names to the ultimate final rounds
                    if (matchesInCurrentRound === 4) roundLabel = "Quarter-Final";
                    if (matchesInCurrentRound === 2) roundLabel = "Semi-Final";
                    
                    let nextRoundMatchIds = [];
                    let roundMatchesHTML = '';

                    for (let i = 0; i < previousRoundMatchIds.length; i += 2) {
                        const prevMatch1 = previousRoundMatchIds[i];
                        const prevMatch2 = previousRoundMatchIds[i + 1] || null;
                        const matchId = matchIdCounter++;
                        nextRoundMatchIds.push(matchId);

                        // If it's the absolute last pairing, it's the Final
                        let displayLabel = (matchesInCurrentRound === 2) ? "🏆 THE GRAND FINAL" : `${roundLabel} - Match M${matchId}`;

                        const homePlaceholder = {
                            id: `W(M${prevMatch1})`,
                            team: { name: `Winner of M${prevMatch1}` },
                            players: []
                        };

                        let awayPlaceholder = null;
                        if (prevMatch2) {
                            awayPlaceholder = {
                                id: `W(M${prevMatch2})`,
                                team: { name: `Winner of M${prevMatch2}` },
                                players: []
                            };
                        }

                        roundMatchesHTML += buildMatchCard(homePlaceholder, awayPlaceholder, displayLabel);
                    }

                    container.innerHTML += roundMatchesHTML;
                    previousRoundMatchIds = nextRoundMatchIds;
                    matchesInCurrentRound = previousRoundMatchIds.length;
                }
            } 
            else if (format === 'league') {
                let teams = [...generatedSquads];
                if (teams.length % 2 !== 0) teams.push(null); 
                const totalRounds = teams.length - 1;
                const half = teams.length / 2;

                for (let round = 0; round < totalRounds; round++) {
                    let matchesHTML = '';
                    for (let i = 0; i < half; i++) {
                        const home = teams[i];
                        const away = teams[teams.length - 1 - i];
                        if (home && away) matchesHTML += buildMatchCard(home, away, `Matchday ${round + 1}`);
                    }
                    if(matchesHTML) container.innerHTML += matchesHTML;
                    teams.splice(1, 0, teams.pop()); 
                }
            }
            else if (format === 'groups') {
                const mid = Math.ceil(generatedSquads.length / 2);
                const groups = [ {name: 'A', data: generatedSquads.slice(0, mid)}, {name: 'B', data: generatedSquads.slice(mid)} ];
                
                groups.forEach(grp => {
                    let teams = [...grp.data];
                    if (teams.length % 2 !== 0) teams.push(null);
                    const totalRounds = teams.length - 1;
                    
                    for (let round = 0; round < totalRounds; round++) {
                        for (let i = 0; i < teams.length / 2; i++) {
                            const home = teams[i];
                            const away = teams[teams.length - 1 - i];
                            if (home && away) container.innerHTML += buildMatchCard(home, away, `Group ${grp.name} - MD ${round + 1}`);
                        }
                        teams.splice(1, 0, teams.pop());
                    }
                });
            }
        }

        // Match Card UI Builder
        function buildMatchCard(home, away, label) {
            const awayBlock = away 
                ? `<div class="text-right"><div class="font-bold text-slate-200">${away.team.name}</div><div class="text-[10px] text-slate-500">Squad ${away.id}</div></div>`
                : `<div class="text-right text-slate-500 italic text-sm">Automatic Bye</div>`;

            return `
            <div class="bg-slate-900 border border-slate-700 rounded-lg p-4 shadow-sm relative">
                <span class="absolute -top-2 left-3 bg-amber-500 text-slate-900 text-[10px] font-bold px-2 py-0.5 rounded shadow">${label}</span>
                <div class="flex justify-between items-center mt-2">
                    <div class="text-left">
                        <div class="font-bold text-slate-200">${home.team.name}</div>
                        <div class="text-[10px] text-slate-500">Squad ${home.id}</div>
                    </div>
                    <div class="px-3 text-slate-600 font-black text-sm">VS</div>
                    ${awayBlock}
                </div>
            </div>`;
        }
    </script>
</body>
</html>
