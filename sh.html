<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FC 26 Tournament Wizard</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        html, body { height: 100%; max-height: 100%; overflow: hidden; position: fixed; width: 100%; }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 99px; }
        ::-webkit-scrollbar-thumb:hover { background: #10b981; }

        @media (min-width: 1024px) {
            .tree-column { width: 260px; min-width: 260px; }
            .tree-connector::after {
                content: ''; position: absolute; right: -16px; top: 50%;
                width: 16px; height: 2px; background: #334155;
            }
        }

        /* Hide number input spinners */
        input[type="number"]::-webkit-inner-spin-button, 
        input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type="number"] { -moz-appearance: textfield; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased selection:bg-emerald-500 selection:text-slate-950">

    <div class="fixed inset-0 w-full h-full p-3 flex flex-col justify-between box-border">
        
        <!-- HEADER COMPONENT -->
        <header id="mainHeader" class="hidden bg-slate-900 border border-slate-800 h-12 md:h-14 rounded-xl items-center justify-between px-3 md:px-4 shadow-md shrink-0">
            <h1 class="text-xs md:text-base font-black tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-cyan-400">
                🎮 FC 26 WIZARD
            </h1>
            
            <div class="flex items-center space-x-1 md:space-x-2 text-[9px] md:text-[11px] font-bold">
                <div id="badge-1" class="px-1 py-0.5 rounded transition-all">1. Setup</div><div class="text-slate-700 text-[8px]"><i class="fa-solid fa-chevron-right"></i></div>
                <div id="badge-2" class="px-1 py-0.5 rounded transition-all">2. Pool</div><div class="text-slate-700 text-[8px]"><i class="fa-solid fa-chevron-right"></i></div>
                <div id="badge-3" class="px-1 py-0.5 rounded transition-all">3. Squads</div><div class="text-slate-700 text-[8px]"><i class="fa-solid fa-chevron-right"></i></div>
                <div id="badge-4" class="px-1 py-0.5 rounded transition-all">4. Fixtures</div><div class="text-slate-700 text-[8px]"><i class="fa-solid fa-chevron-right"></i></div>
                <div id="badge-5" class="px-1 py-0.5 rounded transition-all">5. Run</div>
            </div>
        </header>

        <div id="mainStage" class="flex-1 my-0 bg-slate-900/40 border-0 rounded-2xl p-0 shadow-2xl flex flex-col overflow-hidden relative transition-all">
            
            <!-- STEP 0: WELCOME SCREEN -->
            <div id="step-view-0" class="wizard-step flex flex-col items-center justify-center h-full w-full space-y-6 text-center">
                <div class="space-y-2">
                    <h1 class="text-4xl md:text-5xl font-black tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-cyan-400">FC 26 WIZARD</h1>
                    <p class="text-slate-400 text-xs md:text-sm font-mono uppercase tracking-widest">Tournament Manager</p>
                </div>
                
                <div class="flex flex-col space-y-3 w-64 mt-8">
                    <button onclick="startNewWizard()" class="bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black py-3 rounded-xl shadow-[0_0_15px_rgba(16,185,129,0.3)] transition transform hover:-translate-y-0.5">
                        <i class="fa-solid fa-plus mr-2"></i> New Tournament
                    </button>
                    <button id="loadBtn" onclick="openLoadModal()" disabled class="bg-slate-800 text-slate-500 font-bold py-3 rounded-xl transition cursor-not-allowed border border-slate-700/50">
                        <i class="fa-solid fa-cloud-arrow-down mr-2"></i> Load Saved
                    </button>
                    <div id="dbStatus" class="text-[9px] text-slate-500 mt-1"><i class="fa-solid fa-circle-notch fa-spin mr-1"></i> Checking database...</div>
                </div>
            </div>

            <!-- STEP 1: PLAYERS -->
            <div id="step-view-1" class="wizard-step hidden flex flex-col h-full space-y-3 min-h-0">
                <div class="shrink-0 flex justify-between items-center">
                    <h2 class="text-xs md:text-base font-bold text-emerald-400"><i class="fa-solid fa-users mr-2"></i>Competitors Layout</h2>
                    <input type="text" id="tournamentTitle" placeholder="Tournament Name" class="bg-slate-950 border border-slate-800 rounded-lg px-2 py-1 text-xs text-emerald-400 font-bold focus:outline-none focus:border-emerald-500 w-32 md:w-48 text-right">
                </div>
                <div class="flex-1 grid grid-cols-1 md:grid-cols-2 gap-3 overflow-hidden min-h-0">
                    <div class="flex flex-col h-full min-h-0">
                        <textarea id="playerNames" class="w-full h-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-slate-200 focus:outline-none focus:border-emerald-500 resize-none font-mono" oninput="validateStepOne()">Marwan&#10;Moayad&#10;Yousef&#10;Ali</textarea>
                    </div>
                    <div class="flex flex-col justify-center space-y-2 shrink-0">
                        <label class="flex items-center justify-between p-3 bg-slate-950 border border-slate-800 rounded-xl cursor-pointer hover:border-slate-700"><div class="flex items-center space-x-3"><i class="fa-solid fa-user text-emerald-400 text-sm"></i><div class="text-xs font-bold">Singles (1v1)</div></div><input type="radio" name="groupSize" value="1" checked class="accent-emerald-500 w-4 h-4"></label>
                        <label class="flex items-center justify-between p-3 bg-slate-950 border border-slate-800 rounded-xl cursor-pointer hover:border-slate-700"><div class="flex items-center space-x-3"><i class="fa-solid fa-user-group text-cyan-400 text-sm"></i><div class="text-xs font-bold">Co-Op (2v2)</div></div><input type="radio" name="groupSize" value="2" class="accent-emerald-500 w-4 h-4"></label>
                    </div>
                </div>
            </div>

            <!-- STEP 2: POOL -->
            <div id="step-view-2" class="wizard-step hidden flex flex-col h-full space-y-2 min-h-0">
                <div class="flex flex-col sm:flex-row justify-between sm:items-center shrink-0 gap-2">
                    <h2 class="text-xs md:text-base font-bold text-emerald-400"><i class="fa-solid fa-shield-halved mr-2"></i>Team Pool</h2>
                    <div class="flex bg-slate-950 p-0.5 rounded-lg border border-slate-800 text-[10px] font-bold">
                        <label class="cursor-pointer relative"><input type="radio" name="poolSource" value="predefined" class="peer sr-only" checked onchange="togglePoolSource()"><div class="px-2 py-0.5 rounded text-slate-500 peer-checked:bg-emerald-500 peer-checked:text-slate-950">Predefined</div></label>
                        <label class="cursor-pointer relative"><input type="radio" name="poolSource" value="custom" class="peer sr-only" onchange="togglePoolSource()"><div class="px-2 py-0.5 rounded text-slate-500 peer-checked:bg-emerald-500 peer-checked:text-slate-950">Custom Name</div></label>
                    </div>
                </div>

                <div id="predefinedPoolWrapper" class="flex flex-col flex-1 min-h-0 space-y-2">
                    <div class="flex justify-between items-center shrink-0 gap-2">
                        <div class="flex bg-slate-950 p-0.5 rounded-lg border border-slate-800 text-[9px] md:text-[10px] font-bold">
                            <button onclick="filterTeamType('all')" id="tab-all" class="px-2 py-0.5 rounded bg-emerald-500 text-slate-950">All</button>
                            <button onclick="filterTeamType('club')" id="tab-club" class="px-2 py-0.5 rounded text-slate-400">Clubs</button>
                            <button onclick="filterTeamType('national')" id="tab-national" class="px-2 py-0.5 rounded text-slate-400">Nationals</button>
                        </div>
                    </div>
                    <div class="flex-1 overflow-y-auto bg-slate-950 border border-slate-800 rounded-xl p-2 grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-1 min-h-0" id="teamsListContainer"></div>
                    <div class="text-right text-[9px] text-slate-500 shrink-0">Selected: <strong id="selectedCount" class="text-emerald-400">0</strong></div>
                </div>

                <div id="customPoolWrapper" class="hidden flex-col flex-1 min-h-0 space-y-2">
                    <textarea id="customTeamNames" class="w-full h-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-slate-200 resize-none font-mono" oninput="validateStepTwo()"></textarea>
                </div>
            </div>

            <!-- STEP 3: SQUADS -->
            <div id="step-view-3" class="wizard-step hidden flex flex-col h-full space-y-2 min-h-0">
                <h2 class="text-xs md:text-base font-bold text-cyan-400 shrink-0"><i class="fa-solid fa-dice mr-2"></i>Squad Outputs</h2>
                <div id="resultsContainer" class="flex-1 overflow-y-auto grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-1.5 pr-1 min-h-0"></div>
            </div>

            <!-- STEP 4: FIXTURES & GENERATION -->
            <div id="step-view-4" class="wizard-step hidden flex flex-col h-full space-y-2 min-h-0">
                <div class="flex flex-col sm:flex-row justify-between sm:items-center shrink-0 gap-2 border-b border-slate-800/60 pb-1.5">
                    <div class="flex items-center space-x-2 w-full justify-between sm:w-auto sm:justify-start">
                        <select id="scheduleFormat" class="bg-slate-950 border border-slate-800 text-xs font-bold text-slate-200 rounded-lg p-1.5">
                            <option value="knockout">Knockout</option>
                            <option value="league">League</option>
                            <option value="groups">Group Stage</option>
                        </select>
                        <div class="flex space-x-2">
                            <button onclick="generateScheduleData()" class="bg-amber-500 hover:bg-amber-600 text-slate-950 text-[10px] font-black px-3 py-1.5 rounded-lg uppercase">Build</button>
                            <button id="cloudSaveBtn" onclick="saveToCloud()" class="bg-cyan-500 hover:bg-cyan-400 text-slate-950 text-[10px] font-black px-3 py-1.5 rounded-lg uppercase flex items-center shadow-[0_0_10px_rgba(6,182,212,0.3)]">
                                <i id="cloudIcon" class="fa-solid fa-cloud-arrow-up mr-1.5"></i> <span id="cloudSaveText">Save</span>
                            </button>
                        </div>
                    </div>
                    <!-- Go to Run Mode Button -->
                    <button id="goToRunBtn" onclick="goToRunMode()" class="hidden bg-emerald-500 hover:bg-emerald-400 text-slate-950 text-[10px] font-black px-4 py-1.5 rounded-lg uppercase shadow-[0_0_10px_rgba(16,185,129,0.4)] animate-pulse">
                        ▶ Run Tournament
                    </button>
                </div>

                <div id="readOnlyAlert" class="hidden shrink-0 bg-rose-500/10 border border-rose-500/30 text-rose-400 text-[10px] font-bold px-3 py-1.5 rounded-lg">
                    <i class="fa-solid fa-lock mr-2"></i>Tournament is locked and running. View only.
                </div>

                <!-- Display logic for Step 4 -->
                <div id="mobileRoundTabs4" class="flex lg:hidden bg-slate-950 border border-slate-800 p-0.5 rounded-lg overflow-x-auto text-[9px] font-bold space-x-1 shrink-0"></div>
                <div class="flex-1 overflow-hidden min-h-0 relative">
                    <div id="linearMatchesContainer4" class="hidden h-full overflow-y-auto grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-2 pr-1"></div>
                    <div id="treeMatchesContainer4" class="hidden h-full overflow-x-auto overflow-y-hidden lg:flex lg:space-x-8 pb-1 items-stretch"></div>
                </div>
            </div>

            <!-- STEP 5: TOURNAMENT RUNNER (ACTIVE SCORE TRACKING) -->
            <div id="step-view-5" class="wizard-step hidden flex flex-col h-full space-y-2 min-h-0">
                <div class="flex justify-between items-center shrink-0 gap-2 border-b border-slate-800/60 pb-1.5">
                    <h2 class="text-xs md:text-base font-black text-amber-400 uppercase tracking-widest"><i class="fa-solid fa-trophy mr-2"></i>Active Tournament</h2>
                    <div class="text-[10px] text-slate-400 bg-slate-950 border border-slate-800 px-2 py-1 rounded-lg">Scores autosave to cloud</div>
                </div>

                <div id="mobileRoundTabs5" class="flex bg-slate-950 border border-slate-800 p-0.5 rounded-lg overflow-x-auto text-[9px] font-bold space-x-1 shrink-0 w-full"></div>
                
                <div class="flex-1 overflow-y-auto min-h-0 relative bg-slate-950/50 rounded-xl border border-slate-800/50 p-2">
                    <div id="runnerMatchesContainer" class="flex flex-col space-y-2"></div>
                </div>
            </div>

        </div>

        <!-- FOOTER -->
        <footer id="mainFooter" class="hidden h-10 flex justify-between items-center shrink-0 px-1 mt-2.5">
            <button id="prevBtn" onclick="moveWizard(-1)" class="invisible bg-slate-900 border border-slate-800 text-slate-200 font-bold text-xs uppercase tracking-wider py-1.5 px-4 rounded-xl">Back</button>
            <button id="nextBtn" onclick="moveWizard(1)" class="bg-slate-800 text-slate-400 font-bold text-xs uppercase tracking-wider py-1.5 px-4 rounded-xl">Next</button>
        </footer>

    </div>

    <!-- LOAD MODAL -->
    <div id="loadModal" class="fixed inset-0 bg-slate-950/90 backdrop-blur-sm hidden flex-col items-center justify-center z-50 p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-md flex flex-col max-h-[80vh] shadow-2xl">
            <div class="p-4 border-b border-slate-800 flex justify-between items-center">
                <h3 class="text-cyan-400 font-bold"><i class="fa-solid fa-cloud-arrow-down mr-2"></i>Load Tournament</h3>
                <button onclick="closeLoadModal()" class="text-slate-500 hover:text-slate-300"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div id="savedListContainer" class="flex-1 overflow-y-auto p-2 space-y-2"></div>
        </div>
    </div>

    <script>
        // ==========================================
        // SUPABASE CONFIGURATION - PASTE YOURS HERE
        // ==========================================
        const SUPABASE_URL = 'https://hksxehxhdlzqmzrqspjc.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imhrc3hlaHhoZGx6cW16cnFzcGpjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE2NTI2MzYsImV4cCI6MjA4NzIyODYzNn0.IrMUz0wss2qoJEXqD6Q2hlXa5J13i-_2VYxAUM_R5tY';
        
        let supabaseClient = null;
        let savedTournaments = [];
        let currentTournamentDbId = null;
        let currentTournamentAllowChanges = true;
        let generatedSquads = [];
        let currentMatchesState = null; // Holds the JSON of the entire match structure
        let currentStep = 0, selectedTeamsMap = {}, currentFilterType = 'all';

        const fc26TeamsRaw = [
            { name: "Real Madrid", type: "club" }, { name: "Manchester City", type: "club" }, { name: "Arsenal", type: "club" }, { name: "FC Barcelona", type: "club" }, { name: "Liverpool", type: "club" }, { name: "Bayern Munich", type: "club" }, { name: "Paris Saint-Germain", type: "club" }, { name: "Bayer Leverkusen", type: "club" }, { name: "Inter Milan", type: "club" }, { name: "Juventus", type: "club" }, { name: "Borussia Dortmund", type: "club" }, { name: "Atletico Madrid", type: "club" }, { name: "Manchester United", type: "club" }, { name: "Chelsea", type: "club" }, { name: "AC Milan", type: "club" }, { name: "Aston Villa", type: "club" }, { name: "Sporting CP", type: "club" }, { name: "Benfica", type: "club" }, { name: "Argentina", type: "national" }, { name: "France", type: "national" }, { name: "Brazil", type: "national" }, { name: "England", type: "national" }, { name: "Spain", type: "national" }, { name: "Portugal", type: "national" }, { name: "Germany", type: "national" }, { name: "Italy", type: "national" }, { name: "Netherlands", type: "national" }, { name: "Morocco", type: "national" }, { name: "Croatia", type: "national" }, { name: "Uruguay", type: "national" }, { name: "Japan", type: "national" }, { name: "United States", type: "national" }
        ];

        document.addEventListener("DOMContentLoaded", async () => {
            fc26TeamsRaw.forEach(t => selectedTeamsMap[t.name] = true);
            renderTeamsList();
            
            if (SUPABASE_URL !== 'YOUR_SUPABASE_URL') {
                try {
                    supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                    await checkDatabaseRecords();
                } catch (e) {
                    document.getElementById('dbStatus').innerHTML = "<span class='text-rose-500'>DB Error</span>";
                }
            } else {
                document.getElementById('dbStatus').innerHTML = "Supabase keys not configured.";
            }
        });

        // --- DATABASE OPS ---
        async function checkDatabaseRecords() {
            if (!supabaseClient) return;
            const { data, error } = await supabaseClient.from('tournaments').select('id, title, created_at, allow_changes').order('created_at', { ascending: false });
            if (!error && data && data.length > 0) {
                savedTournaments = data;
                const loadBtn = document.getElementById('loadBtn');
                loadBtn.disabled = false;
                loadBtn.className = "bg-slate-800 hover:bg-slate-700 text-cyan-400 font-bold py-3 rounded-xl transition border border-slate-700 shadow-lg cursor-pointer";
                document.getElementById('dbStatus').innerHTML = `<span class="text-emerald-500">${data.length} saved found.</span>`;
            }
        }

        async function saveToCloud() {
            if (!supabaseClient) return alert("Supabase not configured!");
            if (!currentMatchesState) return alert("Please build fixtures first!");

            const payload = {
                title: document.getElementById("tournamentTitle").value.trim() || "Untitled",
                players: document.getElementById("playerNames").value,
                group_size: parseInt(document.querySelector('input[name="groupSize"]:checked').value),
                pool_source: document.querySelector('input[name="poolSource"]:checked').value,
                custom_pool: document.getElementById("customTeamNames").value,
                pool_map: selectedTeamsMap,
                squads: generatedSquads,
                format: document.getElementById("scheduleFormat").value,
                matches: currentMatchesState,
                allow_changes: currentTournamentAllowChanges
            };

            const icon = document.getElementById('cloudIcon');
            const text = document.getElementById('cloudSaveText');
            icon.className = "fa-solid fa-circle-notch fa-spin mr-1.5"; text.innerText = "Saving...";

            let errorResult;
            if (currentTournamentDbId) {
                const { error } = await supabaseClient.from('tournaments').update(payload).eq('id', currentTournamentDbId);
                errorResult = error;
            } else {
                payload.allow_changes = true;
                const { data, error } = await supabaseClient.from('tournaments').insert([payload]).select();
                errorResult = error;
                if (!error && data) currentTournamentDbId = data[0].id;
            }

            if (errorResult) {
                alert("Save Failed: " + errorResult.message);
                icon.className = "fa-solid fa-cloud-arrow-up mr-1.5"; text.innerText = "Fail";
            } else {
                icon.className = "fa-solid fa-check mr-1.5"; text.innerText = "Saved";
                document.getElementById('goToRunBtn').classList.remove('hidden'); // Show Run mode button
                setTimeout(() => { icon.className = "fa-solid fa-cloud-arrow-up mr-1.5"; text.innerText = "Update"; }, 2000);
            }
        }

        // --- SILENT BACKGROUND SAVE (Used when updating scores in Run mode) ---
        async function silentAutoSave() {
            if (!supabaseClient || !currentTournamentDbId) return;
            currentTournamentAllowChanges = false; // Lock out setup
            await supabaseClient.from('tournaments').update({ matches: currentMatchesState, allow_changes: false }).eq('id', currentTournamentDbId);
        }

        async function loadTournamentData(id) {
            if (!supabaseClient) return;
            const { data, error } = await supabaseClient.from('tournaments').select('*').eq('id', id).single();
            if (error || !data) return alert("Failed to load data.");

            currentTournamentDbId = data.id;
            currentTournamentAllowChanges = data.allow_changes;
            generatedSquads = data.squads || [];
            currentMatchesState = data.matches || null;
            
            document.getElementById("tournamentTitle").value = data.title;
            document.getElementById("playerNames").value = data.players;
            document.querySelector(`input[name="groupSize"][value="${data.group_size}"]`).checked = true;
            document.querySelector(`input[name="poolSource"][value="${data.pool_source}"]`).checked = true;
            document.getElementById("customTeamNames").value = data.custom_pool || '';
            document.getElementById("scheduleFormat").value = data.format || 'knockout';
            if (data.pool_map) selectedTeamsMap = data.pool_map;

            closeLoadModal();
            togglePoolSource();

            // Setup UI logic based on Locked status
            const readOnlyAlert = document.getElementById("readOnlyAlert");
            const cloudSaveBtn = document.getElementById("cloudSaveBtn");
            const goToRunBtn = document.getElementById("goToRunBtn");

            if (!currentTournamentAllowChanges) {
                // LOCKED -> Go straight to RUN MODE
                readOnlyAlert.classList.remove("hidden");
                cloudSaveBtn.classList.add("hidden");
                startNewWizard(true, 5); // Jump to step 5
                renderRunnerUi();
            } else {
                // EDITABLE -> Go to Fixtures (Step 4)
                readOnlyAlert.classList.add("hidden");
                cloudSaveBtn.classList.remove("hidden");
                goToRunBtn.classList.remove("hidden");
                document.getElementById('cloudSaveText').innerText = "Update";
                startNewWizard(true, 4);
                if (currentMatchesState) renderStep4Ui();
            }
        }

        // --- UI FLOW ---
        function openLoadModal() { /* ... see loadTournamentData for populating ... */ 
            const container = document.getElementById('savedListContainer');
            container.innerHTML = '';
            savedTournaments.forEach(t => {
                const date = new Date(t.created_at).toLocaleDateString();
                const lockIcon = t.allow_changes ? '' : '<i class="fa-solid fa-lock text-rose-500 text-[10px] ml-2"></i>';
                container.innerHTML += `<button onclick="loadTournamentData('${t.id}')" class="w-full text-left p-3 bg-slate-950 border border-slate-800 rounded-xl hover:border-cyan-500 transition flex justify-between items-center group"><div><div class="text-slate-200 font-bold text-sm">${t.title || 'Untitled'} ${lockIcon}</div><div class="text-[10px] text-slate-500">${date}</div></div><i class="fa-solid fa-arrow-right text-slate-700"></i></button>`;
            });
            document.getElementById('loadModal').classList.remove('hidden'); document.getElementById('loadModal').classList.add('flex');
        }
        function closeLoadModal() { document.getElementById('loadModal').classList.add('hidden'); document.getElementById('loadModal').classList.remove('flex'); }

        function startNewWizard(isLoad = false, targetStep = 1) {
            document.getElementById("mainHeader").classList.remove("hidden"); document.getElementById("mainHeader").classList.add("flex");
            document.getElementById("mainStage").classList.remove("my-0", "border-0", "p-0", "bg-transparent"); document.getElementById("mainStage").classList.add("my-2.5", "border", "border-slate-800/80", "p-3", "md:p-5", "bg-slate-900/40");
            document.getElementById("mainFooter").classList.remove("hidden"); document.getElementById("mainFooter").classList.add("flex");
            
            if (!isLoad) {
                currentTournamentDbId = null; currentTournamentAllowChanges = true; currentMatchesState = null;
                document.getElementById('cloudSaveText').innerText = "Save";
                document.getElementById("readOnlyAlert").classList.add("hidden"); document.getElementById("cloudSaveBtn").classList.remove("hidden");
                document.getElementById("goToRunBtn").classList.add("hidden");
            }
            currentStep = targetStep; refreshWizardView();
        }

        function moveWizard(dir) {
            if (!currentTournamentAllowChanges && currentStep <= 4) return alert("Tournament is running and locked.");
            if (currentStep === 2 && dir === 1) runShuffleEngine();
            currentStep += dir; refreshWizardView();
        }

        function goToRunMode() {
            if (!currentMatchesState) return alert("Generate and save schedule first!");
            currentStep = 5; refreshWizardView(); renderRunnerUi();
        }

        function refreshWizardView() {
            document.querySelectorAll(".wizard-step").forEach((view, idx) => { view.classList.toggle("hidden", idx !== currentStep); });
            const prevBtn = document.getElementById("prevBtn"), nextBtn = document.getElementById("nextBtn"), footer = document.getElementById("mainFooter");
            
            if (currentStep === 5) {
                footer.classList.add("hidden"); footer.classList.remove("flex"); // Hide footer in Run mode
            } else {
                footer.classList.remove("hidden"); footer.classList.add("flex");
                prevBtn.classList.toggle("invisible", currentStep <= 1);
                nextBtn.classList.toggle("hidden", currentStep === 4 || currentStep === 0);
                if (currentStep === 1) validateStepOne(); if (currentStep === 2) validateStepTwo(); if (currentStep === 3) toggleNextButton(true);
            }

            for (let i = 1; i <= 5; i++) {
                const badge = document.getElementById(`badge-${i}`); if (!badge) continue;
                badge.className = i === currentStep ? "px-1.5 py-0.5 rounded bg-emerald-500 text-slate-950 font-black transition-all" : i < currentStep ? "px-1.5 py-0.5 rounded bg-slate-800 text-emerald-400" : "px-1.5 py-0.5 rounded bg-slate-800 text-slate-500";
            }
        }

        // --- LOGIC: Validate, Shuffle, etc. ---
        function validateStepOne() { toggleNextButton(document.getElementById("playerNames").value.trim() !== ''); }
        function togglePoolSource() { const isPre = document.querySelector('input[name="poolSource"]:checked').value === 'predefined'; document.getElementById("predefinedPoolWrapper").classList.toggle("hidden", !isPre); document.getElementById("predefinedPoolWrapper").classList.toggle("flex", isPre); document.getElementById("customPoolWrapper").classList.toggle("hidden", isPre); document.getElementById("customPoolWrapper").classList.toggle("flex", !isPre); validateStepTwo(); }
        function validateStepTwo() { const isPre = document.querySelector('input[name="poolSource"]:checked').value === 'predefined'; const count = isPre ? Object.values(selectedTeamsMap).filter(v=>v).length : document.getElementById("customTeamNames").value.split('\n').filter(n=>n.trim()).length; document.getElementById(isPre?"selectedCount":"customSelectedCount")?.innerText && (document.getElementById(isPre?"selectedCount":"customSelectedCount").innerText = count); toggleNextButton(count > 0); }
        function toggleNextButton(active) { const btn = document.getElementById("nextBtn"); btn.disabled = !active; btn.className = active ? "bg-gradient-to-r from-emerald-500 to-cyan-500 text-slate-950 font-black text-xs uppercase tracking-wider py-1.5 px-4 rounded-xl shadow-lg cursor-pointer" : "bg-slate-800 text-slate-500 font-bold text-xs uppercase py-1.5 px-4 rounded-xl cursor-not-allowed"; }
        function renderTeamsList() { const c = document.getElementById("teamsListContainer"); c.innerHTML = ""; fc26TeamsRaw.forEach(t => { if (currentFilterType !== 'all' && t.type !== currentFilterType) return; c.innerHTML += `<label class="flex items-center space-x-1.5 p-1 bg-slate-900 border border-slate-800/60 rounded-lg cursor-pointer"><input type="checkbox" data-name="${t.name}" ${selectedTeamsMap[t.name]?'checked':''} onchange="selectedTeamsMap[this.getAttribute('data-name')]=this.checked; validateStepTwo(); renderTeamsList();" class="accent-emerald-500 rounded bg-slate-950 w-3 h-3"><span class="truncate text-[10px] text-slate-300">${t.name}</span></label>`; }); }
        function filterTeamType(t) { currentFilterType = t; ['all','club','national'].forEach(x => document.getElementById(`tab-${x}`).className = x===t ? "px-2 py-0.5 rounded bg-emerald-500 text-slate-950" : "px-2 py-0.5 rounded text-slate-400"); renderTeamsList(); }

        function runShuffleEngine() {
            const names = document.getElementById("playerNames").value.split('\n').map(n => n.trim()).filter(n => n !== '');
            const size = parseInt(document.querySelector('input[name="groupSize"]:checked').value);
            let pool = document.querySelector('input[name="poolSource"]:checked').value === 'predefined' ? fc26TeamsRaw.filter(t => selectedTeamsMap[t.name]) : document.getElementById("customTeamNames").value.split('\n').filter(n=>n.trim()).map(n=>({name:n}));
            const randNames = [...names].sort(()=>Math.random()-0.5); generatedSquads = []; const container = document.getElementById("resultsContainer"); container.innerHTML = "";
            for (let i = 0; i < Math.ceil(names.length / size); i++) {
                const sq = { id: i + 1, team: pool[Math.floor(Math.random() * pool.length)], players: randNames.slice(i * size, (i + 1) * size) };
                generatedSquads.push(sq);
                container.innerHTML += `<div class="bg-slate-950 border border-slate-800 rounded-xl p-2 flex justify-between shadow-inner"><div class="overflow-hidden"><div class="text-[8px] text-slate-600 font-bold tracking-widest">SQUAD ${sq.id}</div><div class="text-[10px] text-slate-400 mt-0.5 truncate">${sq.players.join(', ')}</div></div><div class="text-xs font-bold text-emerald-400 shrink-0 ml-2">${sq.team.name}</div></div>`;
            }
        }


        // --- STATE GENERATION (Pure Data, No UI) ---
        function generateScheduleData() {
            if (generatedSquads.length < 2) return alert("Need 2+ squads.");
            const format = document.getElementById("scheduleFormat").value;
            let matchIdCounter = 1;
            
            let newState = { type: format, rounds: [] };

            if (format === 'league') {
                let teams = [...generatedSquads]; if (teams.length % 2 !== 0) teams.push(null);
                for (let r = 0; r < teams.length - 1; r++) {
                    let rMatches = [];
                    for (let i = 0; i < teams.length / 2; i++) {
                        const h = teams[i], a = teams[teams.length - 1 - i];
                        if (h && a) rMatches.push({ id: matchIdCounter++, home: h, away: a, scoreH: null, scoreA: null, completed: false, isBye: false });
                    }
                    if(rMatches.length > 0) newState.rounds.push({ label: `Matchday ${r + 1}`, matches: rMatches });
                    teams.splice(1, 0, teams.pop());
                }
            } else if (format === 'groups') {
                // Simplified groups state building
                const mid = Math.ceil(generatedSquads.length / 2);
                const grps = [{n:'A', d:generatedSquads.slice(0,mid)}, {n:'B', d:generatedSquads.slice(mid)}];
                grps.forEach(g => {
                    let teams = [...g.d]; if (teams.length % 2 !== 0) teams.push(null);
                    for (let r = 0; r < teams.length - 1; r++) {
                        let rMatches = [];
                        for (let i = 0; i < teams.length / 2; i++) {
                            const h = teams[i], a = teams[teams.length - 1 - i];
                            if (h && a) rMatches.push({ id: matchIdCounter++, home: h, away: a, scoreH: null, scoreA: null, completed: false, isBye: false });
                        }
                        if(rMatches.length > 0) newState.rounds.push({ label: `Group ${g.n} MD ${r + 1}`, matches: rMatches });
                        teams.splice(1, 0, teams.pop());
                    }
                });
            } else {
                // KNOCKOUT
                let currentRoundSquads = [...generatedSquads];
                let r1Matches = [];
                for (let i = 0; i < currentRoundSquads.length; i += 2) {
                    const m1 = currentRoundSquads[i], m2 = currentRoundSquads[i+1] || null;
                    r1Matches.push({ id: matchIdCounter++, home: m1, away: m2, scoreH: null, scoreA: null, completed: m2===null, isBye: m2===null });
                }
                newState.rounds.push({ label: "Round 1", matches: r1Matches });

                let prevMatches = r1Matches;
                while (prevMatches.length > 1) {
                    let currentRoundMatches = [];
                    for (let i = 0; i < prevMatches.length; i += 2) {
                        const m1 = prevMatches[i], m2 = prevMatches[i+1] || null;
                        
                        // Handle automatic BYE progression logic visually
                        let hTeam = { isPlaceholder: true, teamName: `Winner M${m1.id}` };
                        if (m1.isBye) hTeam = m1.home; // Forward directly
                        
                        let aTeam = m2 ? { isPlaceholder: true, teamName: `Winner M${m2.id}` } : null;
                        if (m2 && m2.isBye) aTeam = m2.home;

                        currentRoundMatches.push({
                            id: matchIdCounter++, home: hTeam, away: aTeam, scoreH: null, scoreA: null, completed: aTeam===null, isBye: aTeam===null
                        });
                    }
                    
                    let label = `Round ${newState.rounds.length + 1}`;
                    if (prevMatches.length === 4) label = "Quarterfinals";
                    if (prevMatches.length === 2) label = "🏆 Final";
                    newState.rounds.push({ label: label, matches: currentRoundMatches });
                    prevMatches = currentRoundMatches;
                }
            }
            
            currentMatchesState = newState;
            document.getElementById('goToRunBtn').classList.add('hidden'); // Need to save before running
            renderStep4Ui();
        }

        // --- RENDER VISUAL FIXTURES (STEP 4) ---
        function renderStep4Ui() {
            const state = currentMatchesState;
            const linContainer = document.getElementById("linearMatchesContainer4");
            const treeContainer = document.getElementById("treeMatchesContainer4");
            const tabs = document.getElementById("mobileRoundTabs4");
            
            linContainer.innerHTML = ""; treeContainer.innerHTML = ""; tabs.innerHTML = "";
            linContainer.classList.add("hidden"); treeContainer.classList.add("hidden");

            if (state.type !== 'knockout') {
                linContainer.classList.remove("hidden");
                state.rounds.forEach(r => {
                    r.matches.forEach(m => linContainer.innerHTML += buildReadonlyCard(m.home, m.away, r.label));
                });
            } else {
                treeContainer.classList.remove("hidden");
                state.rounds.forEach((round, rIdx) => {
                    tabs.innerHTML += `<button onclick="switchTab('4', ${rIdx}, ${state.rounds.length})" id="tab4-btn-${rIdx}" class="px-2 py-0.5 rounded ${rIdx===0 ? 'bg-amber-500 text-slate-950' : 'text-slate-400'} whitespace-nowrap">${round.label}</button>`;
                    const col = document.createElement("div"); col.id = `tab4-col-${rIdx}`;
                    col.className = `tree-column flex flex-col justify-around h-full space-y-3 shrink-0 ${rIdx===0 ? 'flex' : 'hidden lg:flex'}`;
                    round.matches.forEach(m => col.innerHTML += buildReadonlyCard(m.home, m.away, `M${m.id}`, true));
                    treeContainer.appendChild(col);
                });
            }
            if (state.type === 'knockout') document.getElementById("mobileRoundTabs4").classList.remove("hidden");
            else document.getElementById("mobileRoundTabs4").classList.add("hidden");
        }

                function buildReadonlyCard(h, a, lbl, isTree = false) {
            // Helper function to format the player and team display
            const formatDisplay = (squad) => {
                if (!squad) return "BYE";
                if (squad.isPlaceholder) return squad.teamName;
                const players = Array.isArray(squad.players) ? squad.players.join(', ') : "Unknown";
                const team = squad.team?.name || "TBD";
                return `${players} <span class="text-slate-500 font-normal">(${team})</span>`;
            };

            let ht = formatDisplay(h);
            let at = formatDisplay(a);

            return `
            <div class="bg-slate-950/90 border border-slate-800/80 rounded-xl p-2 relative flex flex-col justify-center min-h-[54px] shadow-sm ${isTree ? 'tree-connector' : ''}">
                <span class="absolute -top-1.5 left-2 bg-slate-900 border border-slate-800 text-amber-400 text-[8px] font-bold px-1.5 py-0.2 rounded">${lbl}</span>
                <div class="flex justify-between items-center text-[10px] w-full mt-1">
                    <div class="w-[43%] text-left overflow-hidden"><div class="font-bold text-slate-200 truncate">${ht}</div></div>
                    <div class="w-[14%] text-center text-[8px] font-black text-slate-700">VS</div>
                    <div class="w-[43%] text-right overflow-hidden"><div class="font-bold text-slate-200 truncate">${at}</div></div>
                </div>
            </div>`;
        }



        // --- TOURNAMENT RUNNER LOGIC (STEP 5) ---
        let currentRunnerTabIdx = 0;

        function renderRunnerUi() {
            const tabs = document.getElementById("mobileRoundTabs5");
            tabs.innerHTML = "";
            currentMatchesState.rounds.forEach((round, rIdx) => {
                tabs.innerHTML += `<button onclick="switchRunnerTab(${rIdx})" id="run-tab-btn-${rIdx}" class="px-3 py-1 rounded-lg ${rIdx===currentRunnerTabIdx ? 'bg-amber-500 text-slate-950' : 'bg-slate-900 text-slate-400 border border-slate-800'} whitespace-nowrap transition">${round.label}</button>`;
            });
            drawRunnerMatches();
        }

        function switchRunnerTab(idx) { currentRunnerTabIdx = idx; renderRunnerUi(); }

        function drawRunnerMatches() {
            const container = document.getElementById("runnerMatchesContainer");
            container.innerHTML = "";
            const round = currentMatchesState.rounds[currentRunnerTabIdx];

            round.matches.forEach((m, mIdx) => {
                // Helper to get formatted name/team string
                const getDisplay = (obj) => {
                    if (obj?.isPlaceholder) return `<div class="font-bold text-xs text-amber-500">${obj.teamName}</div>`;
                    if (!obj) return `<div class="text-xs text-slate-600">BYE</div>`;
                    
                    const playerName = Array.isArray(obj.players) ? obj.players.join(', ') : (obj.players || "Unknown");
                    const teamName = obj.team?.name || "No Team";
                    return `
                        <div class="flex flex-col">
                            <span class="font-bold text-xs text-slate-200 truncate">${playerName}</span>
                            <span class="text-[9px] text-slate-500 truncate">(${teamName})</span>
                        </div>
                    `;
                };

                let isReady = (!m.home?.isPlaceholder && m.away && !m.away.isPlaceholder) || m.isBye;

                let scoreUI = '';
                if (m.isBye) {
                    scoreUI = `<div class="text-[10px] text-slate-500 italic bg-slate-900 px-3 py-1 rounded">Advanced</div>`;
                } else if (m.completed) {
                    scoreUI = `<div class="flex items-center space-x-2">
                                <div class="text-lg font-black ${m.scoreH > m.scoreA ? 'text-emerald-400' : 'text-slate-400'}">${m.scoreH}</div>
                                <div class="text-slate-700">-</div>
                                <div class="text-lg font-black ${m.scoreA > m.scoreH ? 'text-emerald-400' : 'text-slate-400'}">${m.scoreA}</div>
                               </div>`;
                } else if (isReady) {
                    scoreUI = `
                        <div class="flex items-center space-x-1 border border-slate-700 bg-slate-950 rounded-lg p-1">
                            <input type="number" id="scH-${currentRunnerTabIdx}-${mIdx}" class="w-10 text-center bg-transparent text-slate-200 font-bold focus:outline-none" placeholder="0">
                            <span class="text-slate-600">:</span>
                            <input type="number" id="scA-${currentRunnerTabIdx}-${mIdx}" class="w-10 text-center bg-transparent text-slate-200 font-bold focus:outline-none" placeholder="0">
                            <button onclick="submitScore(${currentRunnerTabIdx}, ${mIdx})" class="bg-emerald-500 text-slate-950 px-2 py-1 rounded ml-1"><i class="fa-solid fa-check"></i></button>
                        </div>`;
                } else {
                    scoreUI = `<div class="text-[10px] text-slate-600"><i class="fa-solid fa-lock"></i> Pending</div>`;
                }

                container.innerHTML += `
                    <div class="bg-slate-900 border border-slate-800 rounded-xl p-3 flex justify-between items-center shadow-md">
                        <div class="w-[40%] text-left overflow-hidden">${getDisplay(m.home)}</div>
                        <div class="w-[20%] flex justify-center">${scoreUI}</div>
                        <div class="w-[40%] text-right overflow-hidden">${getDisplay(m.away)}</div>
                    </div>`;
            });
        }

        function submitScore(rIdx, mIdx) {
            const hVal = document.getElementById(`scH-${rIdx}-${mIdx}`).value;
            const aVal = document.getElementById(`scA-${rIdx}-${mIdx}`).value;
            if (hVal === '' || aVal === '') return alert("Please enter both scores.");
            
            const hScore = parseInt(hVal), aScore = parseInt(aVal);
            const match = currentMatchesState.rounds[rIdx].matches[mIdx];
            
            if (currentMatchesState.type === 'knockout' && hScore === aScore) return alert("Knockout matches must have a winner (No draws).");

            match.scoreH = hScore; match.scoreA = aScore; match.completed = true;

            // Advance winner in Bracket
            if (currentMatchesState.type === 'knockout') {
                const winner = hScore > aScore ? match.home : match.away;
                const nextRIdx = rIdx + 1;
                if (nextRIdx < currentMatchesState.rounds.length) {
                    const nextMIdx = Math.floor(mIdx / 2);
                    const isHomeSlot = (mIdx % 2 === 0);
                    const nextMatch = currentMatchesState.rounds[nextRIdx].matches[nextMIdx];
                    
                    if (isHomeSlot) nextMatch.home = Object.assign({}, winner, {isPlaceholder: false});
                    else nextMatch.away = Object.assign({}, winner, {isPlaceholder: false});
                }
            }

            drawRunnerMatches();
            silentAutoSave(); // Locks tournament & pushes JSON
        }

        function switchTab(viewId, activeIdx, total) {
            for(let i=0; i<total; i++) {
                const col = document.getElementById(`tab${viewId}-col-${i}`);
                const btn = document.getElementById(`tab${viewId}-btn-${i}`);
                if(i === activeIdx) {
                    col.classList.remove("hidden"); col.classList.add("flex");
                    btn.className = "px-2 py-0.5 rounded bg-amber-500 text-slate-950 whitespace-nowrap transition";
                } else {
                    col.classList.add("hidden"); col.classList.remove("flex");
                    btn.className = "px-2 py-0.5 rounded text-slate-400 whitespace-nowrap transition";
                }
            }
        }
    </script>
</body>
