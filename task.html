<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Follow-Up Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* Small animation for the accordion arrow */
        details > summary::-webkit-details-marker { display: none; }
    </style>
</head>
<body class="bg-gray-50 h-screen overflow-hidden flex flex-col font-sans relative">

    <header class="bg-blue-900 text-white p-4 shadow-md flex justify-between items-center z-10">
        <h1 class="text-xl font-bold hidden md:block">📋 Task Follow-Up Tracker</h1>
        <h1 class="text-xl font-bold md:hidden">📋 Tasks</h1>
        
        <div class="flex items-center gap-2 sm:gap-4">
            <div class="flex items-center gap-2 bg-blue-800 px-3 py-1.5 rounded border border-blue-700">
                <label for="globalUserSelect" class="text-xs text-blue-200 uppercase font-bold">User:</label>
                <select id="globalUserSelect" class="bg-transparent text-white font-bold focus:outline-none text-sm md:text-base cursor-pointer">
                    </select>
            </div>
            <button onclick="openNewTaskModal()" class="bg-blue-600 hover:bg-blue-500 px-3 py-2 rounded font-bold text-sm transition shadow whitespace-nowrap">
                + New Task
            </button>
        </div>
    </header>

    <div class="flex flex-1 overflow-hidden relative">

        <div id="listView" class="w-full md:w-1/3 bg-white border-r border-gray-200 flex flex-col h-full">
            
            <div class="p-4 border-b border-gray-200 bg-gray-50 flex flex-col gap-3 shrink-0">
                <input type="text" id="searchInput" placeholder="Search tasks or locations..." class="w-full p-2 border rounded focus:outline-blue-500" oninput="loadTasks()">
                
                <div class="flex flex-wrap gap-2 text-sm font-semibold" id="statusFilters">
                    <button onclick="toggleFilter('All')" id="btn-All" class="bg-blue-600 text-white px-3 py-1 rounded transition shadow-sm">All</button>
                    <button onclick="toggleFilter('Open')" id="btn-Open" class="bg-gray-200 text-gray-700 px-3 py-1 rounded transition">Open</button>
                    <button onclick="toggleFilter('In Progress')" id="btn-In Progress" class="bg-gray-200 text-gray-700 px-3 py-1 rounded transition">In Progress</button>
                    <button onclick="toggleFilter('Closed')" id="btn-Closed" class="bg-gray-200 text-gray-700 px-3 py-1 rounded transition">Closed</button>
                </div>

                <select id="sortSelect" class="p-2 border rounded text-sm w-full focus:outline-blue-500 font-medium text-gray-700 bg-white" onchange="loadTasks()">
                    <option value="newest_post">Sort by: Date of Post (Newest First)</option>
                    <option value="oldest_post">Sort by: Date of Post (Oldest First)</option>
                    <option value="newest_update">Sort by: Last Update Date</option>
                </select>
            </div>

            <div id="taskList" class="flex-1 overflow-y-auto p-2">
                <div class="text-center text-gray-500 mt-10">Loading tasks...</div>
            </div>
        </div>

        <div id="detailView" class="hidden md:flex w-full md:w-2/3 flex-col bg-gray-50 h-full absolute md:relative z-20 top-0 left-0">
            <div class="md:hidden bg-white p-3 border-b flex items-center shadow-sm">
                <button onclick="closeDetailView()" class="text-blue-600 font-bold px-2 py-1">⬅️ Back to List</button>
            </div>

            <div id="detailContent" class="flex-1 overflow-y-auto p-4 md:p-8 flex flex-col gap-6">
                <div class="text-center text-gray-500 mt-20">Select a task from the list to view details.</div>
            </div>

            <div id="updateFormContainer" class="hidden bg-white p-4 border-t border-gray-200">
                <textarea id="newUpdateText" class="w-full p-3 border rounded mb-3 focus:outline-blue-500" rows="3" placeholder="Write progress update here..."></textarea>
                <div class="flex justify-between items-center">
                    <label class="flex items-center gap-2 text-gray-700 font-medium cursor-pointer">
                        <input type="checkbox" id="closeTaskCheck" class="w-5 h-5 accent-blue-600"> Mark Task as Closed
                    </label>
                    <button onclick="submitUpdate()" class="bg-green-600 hover:bg-green-700 text-white px-6 py-2 rounded font-bold shadow transition">
                        Post Update
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div id="newTaskModal" class="fixed inset-0 bg-black bg-opacity-50 z-40 hidden flex items-center justify-center">
        <div class="bg-white p-6 rounded-lg shadow-xl w-[500px] max-w-[95%]">
            <h2 class="text-xl font-bold mb-4 text-blue-900">Create New Task</h2>
            <form id="newTaskForm" onsubmit="submitNewTask(event)" class="space-y-4">
                <div>
                    <label class="block text-sm text-gray-600 mb-1 font-semibold">Task Title</label>
                    <input type="text" id="taskTitle" class="w-full p-2 border rounded focus:outline-blue-500" required placeholder="e.g., RO Plant Pump B Maintenance">
                </div>
                <div>
                    <label class="block text-sm text-gray-600 mb-1 font-semibold">Location</label>
                    <input type="text" id="taskLocation" class="w-full p-2 border rounded focus:outline-blue-500" required placeholder="e.g., Power House">
                </div>
                <div>
                    <label class="block text-sm text-gray-600 mb-1 font-semibold">Description</label>
                    <textarea id="taskDescription" class="w-full p-2 border rounded focus:outline-blue-500" rows="3" required placeholder="What is the issue?"></textarea>
                </div>
                <div>
                    <label class="block text-sm text-gray-600 mb-1 font-semibold">Requirements to Close</label>
                    <textarea id="taskRequirements" class="w-full p-2 border rounded focus:outline-blue-500" rows="2" placeholder="Parts needed, actions to take..."></textarea>
                </div>
                <div class="flex justify-end gap-3 mt-4">
                    <button type="button" onclick="closeNewTaskModal()" class="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded font-bold">Cancel</button>
                    <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded font-bold">Create Task</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // --- 1. Supabase Initialization ---
        const supabaseUrl = 'https://brewgyigjfvexdcfxnpc.supabase.co'; 
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJyZXdneWlnamZ2ZXhkY2Z4bnBjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk1MDk5MDIsImV4cCI6MjA5NTA4NTkwMn0.AX2yIl4FH16C1dvtNcJbps_xpWzVSBrT4TW20x8s6mE'; 
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);
        
        let activeTaskId = null;
        let activeFilters = new Set(['All']);
        
        // --- 2. Team Directory Array ---
        const teamMembers = ["Ahmed", "Marwan", "Saeed", "John", "Ali", "Alex"];
        
        function initializeUserDropdown() {
            const selectEl = document.getElementById('globalUserSelect');
            selectEl.innerHTML = teamMembers.map(name => `<option value="${name}">${name}</option>`).join('');
            
            const savedUser = localStorage.getItem('lastSelectedUser');
            if (savedUser && teamMembers.includes(savedUser)) {
                selectEl.value = savedUser;
            }
        
            selectEl.addEventListener('change', (e) => {
                localStorage.setItem('lastSelectedUser', e.target.value);
            });
        }
        
        function getActiveUser() { return document.getElementById('globalUserSelect').value; }
        
        // --- 3. Filter Management ---
        function toggleFilter(status) {
            if (status === 'All') {
                activeFilters.clear();
                activeFilters.add('All');
            } else {
                activeFilters.delete('All');
                if (activeFilters.has(status)) {
                    activeFilters.delete(status);
                } else {
                    activeFilters.add(status);
                }
                if (activeFilters.size === 0) activeFilters.add('All'); 
            }
        
            ['All', 'Open', 'In Progress', 'Closed'].forEach(btnStatus => {
                const btn = document.getElementById(`btn-${btnStatus}`);
                if (activeFilters.has(btnStatus)) {
                    btn.className = "bg-blue-600 text-white px-3 py-1 rounded transition shadow-sm font-bold";
                } else {
                    btn.className = "bg-gray-200 text-gray-700 px-3 py-1 rounded transition hover:bg-gray-300";
                }
            });
        
            loadTasks();
        }
        
        // --- 4. Modal Management ---
        function openNewTaskModal() { document.getElementById('newTaskModal').classList.remove('hidden'); }
        function closeNewTaskModal() { document.getElementById('newTaskModal').classList.add('hidden'); document.getElementById('newTaskForm').reset(); }
        
        // --- 5. Load & Render Tasks ---
        async function loadTasks() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const sortMode = document.getElementById('sortSelect').value;
        
            const { data: tasks, error } = await supabaseClient.from('tasks').select('*');
            if (error) { console.error("Error fetching tasks:", error); return; }
        
            const listContainer = document.getElementById('taskList');
            listContainer.innerHTML = '';
        
            let filteredTasks = tasks.filter(t => {
                const searchMatch = t.title.toLowerCase().includes(searchTerm) || t.location.toLowerCase().includes(searchTerm);
                const statusMatch = activeFilters.has('All') || activeFilters.has(t.status);
                return searchMatch && statusMatch;
            });
        
            if (filteredTasks.length === 0) {
                listContainer.innerHTML = '<div class="text-center text-gray-500 mt-10">No tasks found.</div>';
                return;
            }
        
            filteredTasks.sort((a, b) => {
                const datePostA = new Date(a.created_at).getTime();
                const datePostB = new Date(b.created_at).getTime();
                const dateUpdateA = new Date(a.updated_at || a.created_at).getTime();
                const dateUpdateB = new Date(b.updated_at || b.created_at).getTime();
        
                if (sortMode === 'newest_post') return datePostB - datePostA;
                if (sortMode === 'oldest_post') return datePostA - datePostB;
                if (sortMode === 'newest_update') return dateUpdateB - dateUpdateA;
            });
        
            const activeTasks = filteredTasks.filter(t => t.status !== 'Closed');
            const closedTasks = filteredTasks.filter(t => t.status === 'Closed');
        
            const createCardHTML = (task) => {
                const statusColor = task.status === 'Closed' ? 'bg-gray-200 text-gray-700' : 
                                    task.status === 'Open' ? 'bg-green-100 text-green-800' : 'bg-yellow-100 text-yellow-800';
                const isActive = activeTaskId === task.id ? 'border-blue-500 ring-2 ring-blue-200' : 'border-gray-200';
                
                return `
                    <div onclick="selectTask('${task.id}')" class="p-4 mb-2 bg-white border ${isActive} rounded shadow-sm cursor-pointer hover:border-blue-500 transition">
                        <div class="flex justify-between items-start mb-2">
                            <h3 class="font-bold text-gray-800">${task.title}</h3>
                            <span class="text-xs font-bold px-2 py-1 rounded ${statusColor} shrink-0 ml-2">${task.status}</span>
                        </div>
                        <div class="text-sm text-gray-600 flex justify-between">
                            <span>📍 ${task.location}</span>
                            <span>📅 ${new Date(task.updated_at || task.created_at).toLocaleDateString()}</span>
                        </div>
                    </div>
                `;
            };
        
            activeTasks.forEach(task => { listContainer.innerHTML += createCardHTML(task); });
        
            if (closedTasks.length > 0) {
                const shouldBeOpen = activeFilters.has('Closed') && activeFilters.size === 1 ? 'open' : '';
                let closedHTML = `
                    <details class="group mt-6" ${shouldBeOpen}>
                        <summary class="cursor-pointer font-bold text-gray-600 bg-gray-200 hover:bg-gray-300 transition p-3 rounded mb-2 flex justify-between items-center select-none shadow-sm">
                            <span>📁 Archived / Closed Tasks (${closedTasks.length})</span>
                            <span class="transform group-open:rotate-180 transition-transform duration-200">▼</span>
                        </summary>
                        <div class="pl-2 border-l-2 border-gray-300 mt-2 space-y-2">
                `;
                closedTasks.forEach(task => { closedHTML += createCardHTML(task); });
                closedHTML += `</div></details>`;
                listContainer.innerHTML += closedHTML;
            }
        }
        
        // --- 6. Submit New Task ---
        async function submitNewTask(e) {
            e.preventDefault();
            const title = document.getElementById('taskTitle').value;
            const location = document.getElementById('taskLocation').value;
            const description = document.getElementById('taskDescription').value;
            const requirements = document.getElementById('taskRequirements').value;
        
            const { error } = await supabaseClient.from('tasks').insert([{
                title, location, description, requirements, status: 'Open', updated_at: new Date().toISOString()
            }]);
        
            if (error) { alert("Error creating task: " + error.message); } 
            else { closeNewTaskModal(); loadTasks(); }
        }
        
        // --- 7. Task Details View ---
        async function selectTask(taskId) {
            activeTaskId = taskId;
            if (window.innerWidth < 768) { document.getElementById('listView').classList.add('hidden'); }
            
            const detailView = document.getElementById('detailView');
            detailView.classList.remove('hidden');
            detailView.classList.add('flex');
            document.getElementById('updateFormContainer').classList.remove('hidden');
        
            const { data: taskData } = await supabaseClient.from('tasks').select('*').eq('id', taskId).single();
        
            renderTaskDetails(taskData);
            await loadUpdates(taskId);
            loadTasks(); 
        }
        
        function closeDetailView() {
            activeTaskId = null;
            if (window.innerWidth < 768) {
                document.getElementById('detailView').classList.add('hidden');
                document.getElementById('detailView').classList.remove('flex');
                document.getElementById('listView').classList.remove('hidden');
            } else {
                document.getElementById('detailContent').innerHTML = `<div class="text-center text-gray-500 mt-20">Select a task from the list to view details.</div>`;
            }
            document.getElementById('updateFormContainer').classList.add('hidden');
            loadTasks();
        }
        
        function renderTaskDetails(task) {
            const container = document.getElementById('detailContent');
            container.innerHTML = `
                <div class="bg-white p-6 rounded border shadow-sm">
                    <div class="mb-4 flex justify-between items-start">
                        <div>
                            <h2 class="text-2xl font-bold text-gray-800">${task.title}</h2>
                            <p class="text-gray-500 mt-1">📍 ${task.location} | 📅 ${new Date(task.created_at).toLocaleString()}</p>
                        </div>
                        <span class="px-3 py-1 text-sm font-bold rounded ${task.status === 'Closed' ? 'bg-gray-200 text-gray-700' : 'bg-green-100 text-green-800'}">${task.status}</span>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <h4 class="font-bold text-gray-700 border-b pb-1 mb-2">📝 Description</h4>
                            <p class="text-gray-600 text-sm whitespace-pre-wrap">${task.description || 'No description provided.'}</p>
                        </div>
                        <div>
                            <h4 class="font-bold text-gray-700 border-b pb-1 mb-2">🔧 Requirements</h4>
                            <p class="text-gray-600 text-sm whitespace-pre-wrap">${task.requirements || 'No specific requirements.'}</p>
                        </div>
                    </div>
                </div>
                <div>
                    <h3 class="text-lg font-bold text-gray-800 mb-4 flex items-center gap-2">💬 Progress Timeline</h3>
                    <div id="updatesTimeline" class="space-y-4">
                        <div class="text-sm text-gray-500">Loading updates...</div>
                    </div>
                </div>
            `;
            
            // NEW LOGIC: Dynamic form rendering based on task status
            const updateForm = document.getElementById('updateFormContainer');
            updateForm.classList.remove('opacity-50', 'pointer-events-none'); // Always unlock it now
        
            if(task.status === 'Closed') {
                updateForm.innerHTML = `
                    <div class="flex flex-col items-center justify-center p-4 bg-gray-100 rounded border border-gray-200">
                        <p class="text-gray-600 mb-3 font-medium">This task is currently closed.</p>
                        <button onclick="reopenTask()" class="bg-yellow-500 hover:bg-yellow-600 text-white px-6 py-2 rounded font-bold shadow transition flex items-center gap-2">
                            🔓 Reopen Task
                        </button>
                    </div>
                `;
            } else {
                updateForm.innerHTML = `
                    <textarea id="newUpdateText" class="w-full p-3 border rounded mb-3 focus:outline-blue-500" rows="3" placeholder="Write progress update here..."></textarea>
                    <div class="flex justify-between items-center">
                        <label class="flex items-center gap-2 text-gray-700 font-medium cursor-pointer">
                            <input type="checkbox" id="closeTaskCheck" class="w-5 h-5 accent-blue-600"> Mark Task as Closed
                        </label>
                        <button onclick="submitUpdate()" class="bg-green-600 hover:bg-green-700 text-white px-6 py-2 rounded font-bold shadow transition">
                            Post Update
                        </button>
                    </div>
                `;
            }
        }
        
        // --- 8. Timeline Progress Logs ---
        async function loadUpdates(taskId) {
            const { data: updates, error } = await supabaseClient
                .from('task_updates')
                .select('*')
                .eq('task_id', taskId)
                .order('created_at', { ascending: true });
        
            const timeline = document.getElementById('updatesTimeline');
            if (error) { timeline.innerHTML = '<div class="text-red-500">Error loading updates.</div>'; return; }
        
            if (updates.length === 0) {
                timeline.innerHTML = '<div class="text-gray-500 italic">No updates yet.</div>'; return;
            }
        
            timeline.innerHTML = updates.map(u => `
                <div class="bg-white p-4 rounded border shadow-sm">
                    <div class="flex justify-between items-center mb-2">
                        <span class="font-bold text-blue-900">${u.created_by}</span>
                        <span class="text-xs text-gray-500">⏱️ ${new Date(u.created_at).toLocaleString()}</span>
                    </div>
                    <p class="text-gray-700 whitespace-pre-wrap">${u.update_text}</p>
                </div>
            `).join('');
        }
        
        async function submitUpdate() {
            if (!activeTaskId) return;
        
            const textInput = document.getElementById('newUpdateText');
            const closeCheck = document.getElementById('closeTaskCheck');
            const text = textInput.value.trim();
            const selectedUser = getActiveUser();
        
            if (!text) { alert("Please enter an update message."); return; }
        
            const { error: updateError } = await supabaseClient
                .from('task_updates')
                .insert([{ task_id: activeTaskId, update_text: text, created_by: selectedUser }]);
        
            if (updateError) { console.error("Error posting update:", updateError); return; }
        
            const newStatus = closeCheck.checked ? 'Closed' : 'In Progress';
            const updatePayload = { status: newStatus, updated_at: new Date().toISOString() };
            if (closeCheck.checked) updatePayload.closed_at = new Date().toISOString();
        
            await supabaseClient.from('tasks').update(updatePayload).eq('id', activeTaskId);
        
            textInput.value = '';
            closeCheck.checked = false;
            
            const { data: taskData } = await supabaseClient.from('tasks').select('*').eq('id', activeTaskId).single();
            renderTaskDetails(taskData);
            await loadUpdates(activeTaskId);
            await loadTasks();
        }
        
        // --- 9. Reopen Task Function ---
        async function reopenTask() {
            if (!activeTaskId) return;
            const selectedUser = getActiveUser();
        
            // 1. Post a system update saying who reopened it
            await supabaseClient
                .from('task_updates')
                .insert([{ 
                    task_id: activeTaskId, 
                    update_text: "🔓 Task was reopened for further action.", 
                    created_by: selectedUser 
                }]);
        
            // 2. Change the database status back to 'In Progress'
            await supabaseClient
                .from('tasks')
                .update({ status: 'In Progress', updated_at: new Date().toISOString() })
                .eq('id', activeTaskId);
        
            // 3. Refresh the UI
            const { data: taskData } = await supabaseClient.from('tasks').select('*').eq('id', activeTaskId).single();
            renderTaskDetails(taskData);
            await loadUpdates(activeTaskId);
            await loadTasks();
        }
        
        // --- 10. App Startup Execution ---
        initializeUserDropdown();
        loadTasks();
    </script>
</body>
</html>
