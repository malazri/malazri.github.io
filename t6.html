<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlAzri TV v1.33 - Full Restore</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary-red: #e50914; --bg-dark: #050505; --panel-bg: #111; --card-w: 120px; --card-h: 170px; }
        * { box-sizing: border-box; }
        body { background: var(--bg-dark); color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* Header & Navigation */
        header { height: 65px; background: #000; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; border-bottom: 1px solid #222; z-index: 2000; }
        .brand { color: var(--primary-red); font-size: 1.5rem; font-weight: 900; letter-spacing: 1px; }
        .header-controls { display: flex; gap: 12px; align-items: center; }

        .icon-btn { background: #222; color: #fff; border: 1px solid #333; width: 38px; height: 38px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
        .icon-btn:hover { background: #333; }
        .stremio-btn { color: #7c5cbf; border-color: #7c5cbf; }
        .stremio-btn.connected { background: #7c5cbf; color: #fff; }
        
        .btn-auth { background: white; color: black; border: none; padding: 6px 14px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 0.85rem; }
        .btn-logout { background: transparent; color: #666; border: 1px solid #333; padding: 6px 14px; border-radius: 4px; cursor: pointer; font-size: 0.85rem; }

        .search-box { background: #1a1a1a; border: 1px solid #333; border-radius: 20px; padding: 5px 15px; display: flex; align-items: center; width: 200px; }
        .search-box input { background: transparent; border: none; color: white; width: 100%; outline: none; font-size: 0.9rem; }

        /* Panels */
        #top-cont { background: #080808; border-bottom: 1px solid #222; transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); max-height: 280px; overflow: hidden; }
        #top-cont.hidden { max-height: 0; border-bottom: none; }
        .top-section { display: flex; gap: 15px; padding: 15px 40px; overflow-x: auto; scroll-behavior: smooth; }
        .top-section::-webkit-scrollbar { height: 4px; }
        .top-section::-webkit-scrollbar-thumb { background: var(--primary-red); }

        .main-layout { display: grid; grid-template-columns: 320px 1fr; flex: 1; overflow: hidden; }
        .side-panel { background: var(--panel-bg); border-left: 1px solid #222; display: flex; flex-direction: column; transition: 0.3s; }
        .side-panel.collapsed { width: 0; min-width: 0; overflow: hidden; border-left: none; }
        
        .side-header { padding: 15px; border-bottom: 1px solid #222; }
        .side-content { flex: 1; overflow-y: auto; padding: 10px; }

        .middle-content { background: #000; position: relative; display: flex; flex-direction: column; }
        video { width: 100%; height: 100%; background: #000; }

        /* UI Elements */
        .card { min-width: var(--card-w); height: var(--card-h); background: #151515; border-radius: 6px; overflow: hidden; cursor: pointer; position: relative; transition: transform 0.2s; }
        .card:hover { transform: scale(1.05); z-index: 10; }
        .card img { width: 100%; height: 100%; object-fit: cover; }
        .card-label { position: absolute; bottom: 0; width: 100%; background: linear-gradient(transparent, rgba(0,0,0,0.9)); padding: 20px 5px 5px; font-size: 0.7rem; text-align: center; }

        .ep-link { display: block; padding: 12px; background: #1a1a1a; margin-bottom: 6px; border-radius: 5px; cursor: pointer; font-size: 0.85rem; border: 1px solid transparent; }
        .ep-link:hover { background: #222; border-color: #444; }
        .ep-link.active { border-right: 4px solid var(--primary-red); background: #2a1010; color: #fff; }

        .resume-ui { position: absolute; inset: 0; background: rgba(0,0,0,0.9); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 500; }
        
        /* Modals */
        .modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.9); z-index:5000; align-items:center; justify-content:center; }
        .modal-box { background:#111; border:1px solid #333; padding:25px; border-radius:12px; width:340px; }

        @media (max-width: 900px) {
            .main-layout { grid-template-columns: 1fr; }
            .side-panel { position: absolute; right: 0; top: 0; bottom: 0; z-index: 1500; width: 280px; box-shadow: -5px 0 15px rgba(0,0,0,0.5); }
        }
    </style>
</head>
<body>

<header>
    <div class="brand">ALAZRI TV</div>
    <div class="header-controls">
        <button class="icon-btn" onclick="toggleTop()"><i class="fas fa-layer-group"></i></button>
        <button class="icon-btn stremio-btn" id="str-indicator" onclick="openStrModal()"><i class="fas fa-sync-alt"></i></button>
        <div class="search-box">
            <i class="fas fa-search" style="color:#555; font-size:0.8rem;"></i>
            <input type="text" id="main-search" placeholder="بحث عن فيلم أو مسلسل...">
        </div>
        <div id="auth-area">
            <button class="btn-auth" id="btn-login" onclick="login()">دخول</button>
        </div>
    </div>
</header>

<div id="top-cont">
    <div class="top-section" id="fav-row">
        </div>
    <div class="top-section" id="search-results" style="display:none; border-top: 1px solid #222;">
        </div>
</div>

<div class="main-layout">
    <div class="side-panel" id="sidebar">
        <div class="side-header">
            <h3 id="current-title" style="margin:0; font-size:1rem; color:var(--primary-red);">اختر محتوى</h3>
            <button id="fav-toggle" onclick="toggleFav()" style="margin-top:10px; width:100%; display:none; background:#222; color:white; border:1px solid #444; padding:6px; cursor:pointer; border-radius:4px;">+ مفضلة</button>
        </div>
        <div class="side-content" id="episode-container">
            </div>
    </div>

    <div class="middle-content">
        <div id="video-header" style="padding:10px 20px; background:#0a0a0a; font-size:0.9rem; color:#888;">لم يتم تشغيل شيء بعد</div>
        <div style="flex:1; position:relative;">
            <video id="player" controls crossorigin="anonymous"></video>
            <div id="resume-card" class="resume-ui">
                <h2 style="margin-bottom:10px;">إكمال من حيث توقفت؟</h2>
                <p id="resume-time" style="color:#888; margin-bottom:20px;"></p>
                <div style="display:flex; gap:15px;">
                    <button onclick="applyResume(true)" style="background:var(--primary-red); color:white; border:none; padding:10px 30px; border-radius:5px; cursor:pointer; font-weight:bold;">نعم</button>
                    <button onclick="applyResume(false)" style="background:#333; color:white; border:none; padding:10px 30px; border-radius:5px; cursor:pointer;">البداية</button>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="str-modal" class="modal">
    <div class="modal-box">
        <h3 style="color:#7c5cbf; margin-top:0;"><i class="fas fa-bolt"></i> Stremio Sync</h3>
        <p style="font-size:0.75rem; color:#777;">اربط حسابك لمزامنة تقدم المشاهدة تلقائياً.</p>
        <input type="email" id="str-user" placeholder="البريد الإلكتروني" style="width:100%; padding:10px; margin-bottom:10px; background:#1a1a1a; border:1px solid #333; color:white;">
        <input type="password" id="str-pass" placeholder="كلمة المرور" style="width:100%; padding:10px; margin-bottom:15px; background:#1a1a1a; border:1px solid #333; color:white;">
        <button onclick="syncStremio()" style="width:100%; background:#7c5cbf; color:white; border:none; padding:12px; border-radius:6px; cursor:pointer; font-weight:bold;">ربط الآن</button>
        <button onclick="closeStrModal()" style="width:100%; margin-top:10px; background:none; border:none; color:#555; cursor:pointer;">إلغاء</button>
    </div>
</div>

<script>
    const SB_URL = "https://hksxehxhdlzqmzrqspjc.supabase.co";
    const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imhrc3hlaHhoZGx6cW16cnFzcGpjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE2NTI2MzYsImV4cCI6MjA4NzIyODYzNn0.IrMUz0wss2qoJEXqD6Q2hlXa5J13i-_2VYxAUM_R5tY";
    const db = supabase.createClient(SB_URL, SB_KEY);
    const PROXY = u => "https://corsproxy.io/?" + encodeURIComponent(u);
    const BASE = "https://ak.sv";

    let state = { user: null, activeItem: null, activeLink: null, favs: [], history: [], lastPos: 0 };
    let strData = { key: localStorage.getItem('str_key'), lib: [] };
    const player = document.getElementById('player');

    // --- Helpers ---
    const formatTime = (s) => { if(!s) return "00:00"; let m=Math.floor(s/60), sc=Math.floor(s%60); return `${m}:${sc<10?'0'+sc:sc}`; };
    const toggleTop = () => document.getElementById('top-cont').classList.toggle('hidden');

    // --- Stremio Core ---
    async function strCall(end, body) {
        const r = await fetch(PROXY("https://api.strem.io" + end), { method: 'POST', body: JSON.stringify(body) });
        return r.json();
    }

    async function initStremio() {
        if (!strData.key) return;
        const res = await strCall('/api/datastoreGet', { authKey: strData.key, collection: 'libraryItem', all: true });
        if (res.result) {
            strData.lib = res.result.filter(i => !i.removed);
            document.getElementById('str-indicator').classList.add('connected');
        }
    }

    // --- Business Logic ---
    async function search(q) {
        if (!q) return;
        const resDiv = document.getElementById('search-results');
        resDiv.innerHTML = "<p style='padding:20px;'>جاري البحث...</p>";
        resDiv.style.display = "flex";
        
        try {
            const resp = await fetch(PROXY(`${BASE}/search?q=${q}`));
            const html = await resp.text();
            const doc = new DOMParser().parseFromString(html, 'text/html');
            const items = doc.querySelectorAll('a[href*="/series/"], a[href*="/movie/"]');
            
            resDiv.innerHTML = "";
            items.forEach(el => {
                const img = el.querySelector('img');
                if (img) {
                    const data = { title: img.alt, link: BASE + el.getAttribute('href'), img: img.dataset.src || img.src };
                    const card = document.createElement('div');
                    card.className = "card";
                    card.innerHTML = `<img src="${data.img}"><div class="card-label">${data.title}</div>`;
                    card.onclick = () => selectItem(data);
                    resDiv.appendChild(card);
                }
            });
        } catch (e) { console.error(e); }
    }

    async function selectItem(item) {
        state.activeItem = item;
        document.getElementById('current-title').innerText = item.title;
        document.getElementById('fav-toggle').style.display = "block";
        updateFavUI();

        const container = document.getElementById('episode-container');
        container.innerHTML = "جاري التحميل...";

        if (item.link.includes('/series/')) {
            const resp = await fetch(PROXY(item.link));
            const doc = new DOMParser().parseFromString(await resp.text(), 'text/html');
            const eps = doc.querySelectorAll('a[href*="/episode/"]');
            container.innerHTML = "";
            eps.forEach(e => {
                const epData = { title: e.innerText.trim(), link: BASE + e.getAttribute('href') };
                const btn = document.createElement('div');
                btn.className = "ep-link";
                btn.innerText = epData.title;
                btn.onclick = () => playVideo(epData);
                container.appendChild(btn);
            });
        } else {
            container.innerHTML = "<p style='color:#555;'>فيلم - جاهز للتشغيل</p>";
            playVideo(item);
        }
    }

    async function playVideo(item) {
        state.activeLink = item.link;
        document.getElementById('video-header').innerText = item.title;
        document.getElementById('resume-card').style.display = "none";
        
        // Find progress (Local vs Stremio)
        let bestPos = 0;
        const local = state.history.find(h => h.episode_link === item.link);
        if (local) bestPos = local.last_position;

        if (strData.key && state.activeItem.link.includes('/series/')) {
            const match = strData.lib.find(i => i.name.toLowerCase() === state.activeItem.title.toLowerCase());
            if (match && match.state && match.state.timeOffset) {
                const sPos = Math.floor(match.state.timeOffset / 1000);
                if (sPos > bestPos) bestPos = sPos;
            }
        }

        if (bestPos > 10) {
            state.lastPos = bestPos;
            document.getElementById('resume-time').innerText = `وصلت إلى ${formatTime(bestPos)}`;
            document.getElementById('resume-card').style.display = "flex";
        }

        try {
            const resp = await fetch(PROXY(item.link));
            const html = await resp.text();
            const id = html.match(/go\.ak\.sv\/link\/([a-zA-Z0-9]+)/);
            if (id) {
                const dlResp = await fetch(PROXY(`${BASE}/download/${id[1]}/`));
                const dlHtml = await dlResp.text();
                const videoUrl = dlHtml.match(/href="([^"]+\.mp4[^"]*)"/i);
                if (videoUrl) {
                    player.src = videoUrl[1];
                    if (bestPos <= 10) player.play();
                }
            }
        } catch (e) { console.error(e); }
    }

    function applyResume(confirm) {
        document.getElementById('resume-card').style.display = "none";
        if (confirm) player.currentTime = state.lastPos;
        player.play();
    }

    // --- Sync & Auth ---
    async function syncNow() {
        if (!state.user || !state.activeLink || player.paused) return;
        const now = Math.floor(player.currentTime);
        if (now < 5) return;

        // DB Save
        await db.from('watch_history').upsert({ user_id: state.user.id, episode_link: state.activeLink, last_position: now, updated_at: new Date() });

        // Stremio Save
        if (strData.key && state.activeItem && !state.activeLink.includes('/movie/')) {
            const match = strData.lib.find(i => i.name.toLowerCase() === state.activeItem.title.toLowerCase());
            if (match) {
                const nums = document.getElementById('video-header').innerText.match(/(\d+)/g);
                const s = nums ? (nums[1] ? nums[0] : 1) : 1;
                const e = nums ? (nums[1] || nums[0]) : 1;
                match.state = { ...match.state, video_id: `${match._id}:${s}:${e}`, timeOffset: now * 1000, lastWatched: new Date().toISOString() };
                await strCall('/api/datastorePut', { authKey: strData.key, collection: 'libraryItem', changes: [match] });
            }
        }
    }

    async function login() { await db.auth.signInWithOAuth({ provider: 'google' }); }
    async function logout() { await db.auth.signOut(); location.reload(); }

    async function checkUser() {
        const { data: { session } } = await db.auth.getSession();
        if (session) {
            state.user = session.user;
            document.getElementById('auth-area').innerHTML = `<button class="btn-logout" onclick="logout()">خروج</button>`;
            const { data: h } = await db.from('watch_history').select('*').eq('user_id', state.user.id);
            state.history = h || [];
            initStremio();
            loadFavs();
            setInterval(syncNow, 10000);
        }
    }

    async function loadFavs() {
        const { data } = await db.from('favorites').select('*').eq('user_id', state.user.id);
        state.favs = data || [];
        const row = document.getElementById('fav-row');
        row.innerHTML = state.favs.map(f => `
            <div class="card" onclick='selectItem(${JSON.stringify(f.series_data)})'>
                <img src="${f.series_data.img}"><div class="card-label">${f.series_data.title}</div>
            </div>
        `).join('');
    }

    async function toggleFav() {
        const existing = state.favs.find(f => f.series_data.link === state.activeItem.link);
        if (existing) await db.from('favorites').delete().eq('id', existing.id);
        else await db.from('favorites').insert({ user_id: state.user.id, series_data: state.activeItem });
        loadFavs(); updateFavUI();
    }

    function updateFavUI() {
        const isF = state.favs.some(f => f.series_data.link === state.activeItem.link);
        const btn = document.getElementById('fav-toggle');
        btn.innerText = isF ? "✓ في المفضلة" : "+ مفضلة";
        btn.style.borderColor = isF ? "var(--primary-red)" : "#444";
    }

    function openStrModal() { document.getElementById('str-modal').style.display = "flex"; }
    function closeStrModal() { document.getElementById('str-modal').style.display = "none"; }
    async function syncStremio() {
        const email = document.getElementById('str-user').value;
        const pass = document.getElementById('str-pass').value;
        const res = await strCall('/api/login', { type: 'Auth', email, password: pass });
        if (res.result && res.result.authKey) {
            localStorage.setItem('str_key', res.result.authKey);
            location.reload();
        } else alert("خطأ في البيانات");
    }

    // Events
    document.getElementById('main-search').onkeyup = e => { if(e.key==='Enter') search(e.target.value); };
    window.onload = checkUser;
</script>
</body>
</html>
