<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AlAzri TV - Final v1.4</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary-red: #e50914; --bg-dark: #0a0a0a; --card-w: 180px; --card-h: 250px; }
        body { background-color: var(--bg-dark); color: white; font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        *:focus { outline: 3px solid var(--primary-red) !important; box-shadow: 0 0 15px var(--primary-red); transform: scale(1.05); z-index: 10; }
        .fixed-header { position: fixed; top: 0; left: 0; right: 0; z-index: 3000; background: #000; padding: 12px 4%; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222; }
        .brand { color: var(--primary-red); font-weight: 900; font-size: 1.5rem; cursor: pointer; }
        .header-actions { display: flex; align-items: center; gap: 15px; }
        .search-container { display: flex; background: #222; border-radius: 5px; padding: 5px 10px; border: 1px solid #444; }
        .search-input { background: transparent; border: none; color: white; outline: none; width: 200px; font-size: 1.1rem; }
        .btn-action { background: var(--primary-red); color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .content-area { flex: 1; overflow-y: auto; padding: 100px 20px 160px 20px; scroll-behavior: smooth; }
        .row { display: none; margin-bottom: 30px; }
        .row.visible { display: block; }
        .row-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .row-title { font-size: 1.3rem; font-weight: bold; border-right: 4px solid var(--primary-red); padding-right: 10px; }
        .row-content { display: flex; gap: 20px; overflow-x: auto; padding: 15px 5px; }
        .card { min-width: var(--card-w); height: var(--card-h); background: #1a1a1a; border-radius: 8px; position: relative; cursor: pointer; flex-shrink: 0; }
        .card img { width: 100%; height: 100%; object-fit: cover; border-radius: 6px; }
        .card-label { position: absolute; bottom: 0; width: 100%; background: rgba(0,0,0,0.85); font-size: 0.9rem; text-align: center; padding: 8px 0; border-bottom-radius: 6px; }
        #player-container { display: none; width: 100%; max-width: 1000px; margin: 0 auto 30px auto; background: #000; border-radius: 12px; border: 1px solid #333; overflow: hidden; }
        video { width: 100%; aspect-ratio: 16/9; }
        .resume-overlay { background: rgba(0,0,0,0.9); padding: 20px; text-align: center; display: none; }
        #debug-console { position: fixed; bottom: 0; left: 0; right: 0; height: 60px; background: rgba(0,0,0,0.8); color: #0f0; font-size: 10px; overflow-y: auto; pointer-events: none; z-index: 5000; padding: 5px; }
    </style>
</head>
<body>

<div class="fixed-header">
    <div class="brand" onclick="location.reload()" tabindex="0">ALAZRI</div>
    <div class="header-actions">
        <i class="fas fa-heart header-icon" style="cursor:pointer; font-size: 1.5rem;" onclick="toggleFavRow()" tabindex="0"></i>
        <div class="search-container">
            <input type="text" class="search-input" id="search-input" placeholder="ابحث هنا..." tabindex="0">
        </div>
    </div>
</div>

<main class="content-area">
    <div class="row" id="row-favs">
        <div class="row-header"><div class="row-title">قائمتي المفضلة</div></div>
        <div id="grid-favs" class="row-content"></div>
    </div>

    <div class="row" id="row-search">
        <div class="row-header"><div class="row-title">نتائج البحث</div></div>
        <div id="grid-search" class="row-content"></div>
    </div>

    <div class="row" id="row-episodes">
        <div class="row-header">
            <div class="row-title" id="episodes-label">الحلقات</div>
            <button id="fav-toggle-btn" class="btn-action" style="display:none;" onclick="handleFavoriteAction()" tabindex="0">
                <i id="fav-icon" class="far fa-heart"></i> <span id="fav-text">أضف للمفضلة</span>
            </button>
        </div>
        <div id="grid-episodes" class="row-content"></div>
    </div>

    <div id="player-container">
        <video id="main-video" controls tabindex="0"></video>
        <div id="resume-ui" class="resume-overlay">
            <h3 style="margin-top:0;">هل تريد إكمال المشاهدة؟</h3>
            <p id="resume-msg"></p>
            <button class="btn-action" onclick="confirmResume(true)" tabindex="0">نعم، إكمال</button>
            <button class="btn-action" style="background:#444; margin-right:10px;" onclick="confirmResume(false)" tabindex="0">البدء من جديد</button>
        </div>
        <div style="padding:15px;"><div id="active-title" style="font-weight:bold; color:var(--primary-red)"></div></div>
    </div>
</main>

<div id="debug-console"></div>

<script>
    var PROXY = function(url) { return "https://corsproxy.io/?" + encodeURIComponent(url); };
    var BASE = "https://ak.sv";
    var FAV_KEY = "alazri_favs_v1_4";
    var HIST_KEY = "alazri_hist_v1_4";
    var state = { currentSeries: null, currentLink: null, savedPos: 0 };
    var video = document.getElementById('main-video');

    function debugLog(m) { 
        var el = document.getElementById('debug-console');
        if(el) { el.innerHTML += '<div>'+m+'</div>'; el.scrollTop = el.scrollHeight; }
    }

    // --- History Logic ---
    function getHist() { var d = localStorage.getItem(HIST_KEY); return d ? JSON.parse(d) : {}; }
    function savePos() {
        if(state.currentLink && !video.paused && video.currentTime > 5) {
            var h = getHist();
            h[state.currentLink] = Math.floor(video.currentTime);
            localStorage.setItem(HIST_KEY, JSON.stringify(h));
        }
    }
    setInterval(savePos, 10000);

    // --- Favorites Logic ---
    function getFavs() { var d = localStorage.getItem(FAV_KEY); return d ? JSON.parse(d) : []; }
    function renderFavs() {
        var favs = getFavs();
        var row = document.getElementById('row-favs');
        if(favs.length > 0) {
            row.classList.add('visible');
            document.getElementById('grid-favs').innerHTML = favs.map(function(item) {
                return '<div class="card" tabindex="0" onclick=\'handleAction(' + JSON.stringify(item).replace(/'/g, "&apos;") + ')\'><img src="'+item.img+'"><div class="card-label">'+item.title+'</div></div>';
            }).join('');
        } else { row.classList.remove('visible'); }
    }

    function handleFavoriteAction() {
        var favs = getFavs();
        var index = favs.findIndex(function(f) { return f.link === state.currentSeries.link; });
        if(index > -1) favs.splice(index, 1); else favs.push(state.currentSeries);
        localStorage.setItem(FAV_KEY, JSON.stringify(favs));
        updateFavBtnUI();
        renderFavs();
    }

    function updateFavBtnUI() {
        if(!state.currentSeries) return;
        var isFav = getFavs().some(function(f) { return f.link === state.currentSeries.link; });
        document.getElementById('fav-icon').className = isFav ? "fas fa-heart" : "far fa-heart";
        document.getElementById('fav-text').innerText = isFav ? "إزالة من المفضلة" : "أضف للمفضلة";
    }

    // --- Search & Episode Logic (Fixing Duplicates) ---
    async function startSearch(q) {
        if(!q) return;
        debugLog("Searching...");
        var res = await fetch(PROXY(BASE + "/search?q=" + q));
        var doc = new DOMParser().parseFromString(await res.text(), 'text/html');
        var unique = new Map();
        doc.querySelectorAll('.entry-box, .subject-item, a[href*="/movie/"], a[href*="/series/"]').forEach(function(el) {
            var a = el.tagName === 'A' ? el : el.querySelector('a');
            var img = el.querySelector('img');
            if(a && img) {
                var link = a.href.indexOf('http') !== -1 ? a.href : BASE + a.getAttribute('href');
                if(!unique.has(link)) unique.set(link, { title: img.alt, link: link, img: img.dataset.src || img.src, isSeries: link.indexOf('/series/') !== -1 });
            }
        });
        document.getElementById('grid-search').innerHTML = Array.from(unique.values()).map(function(item) {
            return '<div class="card" tabindex="0" onclick=\'handleAction(' + JSON.stringify(item).replace(/'/g, "&apos;") + ')\'><img src="'+item.img+'"><div class="card-label">'+item.title+'</div></div>';
        }).join('');
        document.getElementById('row-search').classList.add('visible');
    }

    async function loadEpisodes(item) {
        state.currentSeries = item;
        document.getElementById('row-episodes').classList.add('visible');
        document.getElementById('episodes-label').innerText = item.title;
        document.getElementById('fav-toggle-btn').style.display = 'block';
        updateFavBtnUI();
        var res = await fetch(PROXY(item.link));
        var doc = new DOMParser().parseFromString(await res.text(), 'text/html');
        var uniqueEps = new Map();
        doc.querySelectorAll('a[href*="/episode/"]').forEach(function(a) {
            var link = a.href.indexOf('http') !== -1 ? a.href : BASE + a.getAttribute('href');
            if(!uniqueEps.has(link)) uniqueEps.set(link, { title: a.innerText.trim(), link: link, img: item.img });
        });
        document.getElementById('grid-episodes').innerHTML = Array.from(uniqueEps.values()).map(function(ep) {
            return '<div class="card" tabindex="0" onclick="fetchAndPlay(\''+ep.link+'\', \''+ep.title+'\')"><img src="'+ep.img+'"><div class="card-label">'+ep.title+'</div></div>';
        }).join('');
    }

    // --- Playback Logic (Resume Wait) ---
    async function fetchAndPlay(l, t) {
        state.currentLink = l;
        document.getElementById('player-container').style.display = 'block';
        document.getElementById('active-title').innerText = "جاري جلب السيرفر...";
        document.getElementById('resume-ui').style.display = 'none';
        video.pause();

        try {
            var html = await (await fetch(PROXY(l))).text();
            var m = html.match(/go\.ak\.sv\/link\/([a-zA-Z0-9]+)/);
            var dl = await (await fetch(PROXY(l.replace('/episode/', '/download/'+m[1]+'/')))).text();
            var mp4 = new DOMParser().parseFromString(dl, 'text/html').querySelector('a[href*=".mp4"]');
            
            if(mp4) {
                video.src = mp4.href;
                document.getElementById('active-title').innerText = t;
                
                var h = getHist();
                if(h[l] && h[l] > 10) {
                    state.savedPos = h[l];
                    document.getElementById('resume-msg').innerText = "تم العثور على تقدم: " + Math.floor(h[l]/60) + " دقيقة";
                    document.getElementById('resume-ui').style.display = 'block';
                    document.getElementById('resume-ui').querySelector('button').focus();
                } else {
                    video.play();
                    video.focus();
                }
            }
        } catch(e) { debugLog("Play Error"); }
    }

    function confirmResume(yes) {
        document.getElementById('resume-ui').style.display = 'none';
        if(yes) video.currentTime = state.savedPos;
        video.play();
        video.focus();
    }

    function handleAction(i) { if(i.isSeries) loadEpisodes(i); else fetchAndPlay(i.link, i.title); }
    document.getElementById('search-input').onkeydown = function(e) { if(e.key==='Enter') startSearch(this.value); };
    
    // Auto-load favorites on page start
    window.onload = renderFavs;
</script>
</body>
</html>
