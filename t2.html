<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AlAzri TV - Final v1.3</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary-red: #e50914; --bg-dark: #0a0a0a; --card-w: 180px; --card-h: 250px; }
        body { background-color: var(--bg-dark); color: white; font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        *:focus { outline: 3px solid var(--primary-red) !important; box-shadow: 0 0 15px var(--primary-red); transform: scale(1.05); z-index: 10; }
        .fixed-header { position: fixed; top: 0; left: 0; right: 0; z-index: 3000; background: #000; padding: 12px 4%; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222; }
        .brand { color: var(--primary-red); font-weight: 900; font-size: 1.5rem; cursor: pointer; }
        .header-actions { display: flex; align-items: center; gap: 15px; }
        .search-container { display: flex; background: #222; border-radius: 5px; padding: 5px 10px; border: 1px solid #444; }
        .search-input { background: transparent; border: none; color: white; outline: none; width: 200px; font-size: 1.1rem; }
        .header-icon { cursor: pointer; font-size: 1.5rem; color: #bbb; padding: 10px; }
        .btn-action { background: var(--primary-red); color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 1rem; }
        .content-area { flex: 1; overflow-y: auto; padding: 80px 20px 160px 20px; scroll-behavior: smooth; }
        .row { display: none; margin-bottom: 30px; }
        .row.visible { display: block; }
        .row-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .row-title { font-size: 1.3rem; font-weight: bold; border-right: 4px solid var(--primary-red); padding-right: 10px; }
        .row-content { display: flex; gap: 20px; overflow-x: auto; padding: 15px 5px; }
        .card { min-width: var(--card-w); height: var(--card-h); background: #1a1a1a; border-radius: 8px; position: relative; cursor: pointer; flex-shrink: 0; }
        .card img { width: 100%; height: 100%; object-fit: cover; border-radius: 6px; }
        .card-label { position: absolute; bottom: 0; width: 100%; background: rgba(0,0,0,0.85); font-size: 0.9rem; text-align: center; padding: 8px 0; }
        #player-container { display: none; width: 100%; max-width: 1000px; margin: 0 auto 30px auto; background: #000; border-radius: 12px; border: 1px solid #333; }
        video { width: 100%; aspect-ratio: 16/9; }
        #debug-console { position: fixed; bottom: 5px; left: 5px; right: 5px; height: 80px; background: rgba(0, 0, 0, 0.9); color: #00ff00; font-family: monospace; font-size: 12px; padding: 8px; border: 1px solid #444; overflow-y: auto; z-index: 9999; pointer-events: none; }
    </style>
</head>
<body>

<div class="fixed-header">
    <div class="brand" tabindex="0" onclick="location.reload()">ALAZRI</div>
    <div class="header-actions">
        <i class="fas fa-heart header-icon" tabindex="0" onclick="toggleFavSection()" title="المفضلة"></i>
        <div class="search-container">
            <input type="text" class="search-input" id="search-input" placeholder="ابحث..." tabindex="0">
        </div>
        <button class="btn-action" style="background:#333; margin-left:10px;" onclick="clearAllData()">مسح الذاكرة</button>
    </div>
</div>

<main class="content-area">
    <div class="row" id="row-search"><div class="row-header"><div class="row-title">نتائج البحث</div></div><div id="grid-search" class="row-content"></div></div>
    <div class="row" id="row-favs"><div class="row-header"><div class="row-title">المفضلة</div></div><div id="grid-favs" class="row-content"></div></div>
    <div class="row" id="row-episodes">
        <div class="row-header">
            <div class="row-title" id="episodes-label">الحلقات</div>
            <button id="fav-toggle-btn" class="btn-action" tabindex="0" style="display:none;" onclick="handleFavoriteClick()">
                <i id="fav-icon" class="far fa-heart"></i> <span id="fav-text">أضف للمفضلة</span>
            </button>
        </div>
        <div id="grid-episodes" class="row-content"></div>
    </div>
    <div id="player-container">
        <video id="main-video" controls autoplay tabindex="0"></video>
        <div style="padding:15px;"><div id="active-episode-title" style="font-weight:bold; color:var(--primary-red)"></div></div>
    </div>
</main>

<div id="debug-console"><div>[INIT] v1.3 Online...</div></div>

<script>
    var PROXY = function(url) { return "https://corsproxy.io/?" + encodeURIComponent(url); };
    var BASE = "https://ak.sv";
    var FAV_KEY = "alazri_favorites_v2";
    var state = { currentSeries: null };

    function debugLog(m) { 
        var el = document.getElementById('debug-console');
        if(el) { var d = document.createElement('div'); d.textContent = "> " + m; el.appendChild(d); el.scrollTop = el.scrollHeight; }
    }

    // --- Search Logic ---
    async function startSearch(q) {
        if(!q) return;
        debugLog("Searching: " + q);
        try {
            var res = await fetch(PROXY(BASE + "/search?q=" + q));
            var text = await res.text();
            var doc = new DOMParser().parseFromString(text, 'text/html');
            var results = [];
            doc.querySelectorAll('.entry-box, .subject-item, a[href*="/movie/"], a[href*="/series/"]').forEach(function(el) {
                var a = el.tagName === 'A' ? el : el.querySelector('a');
                var img = el.querySelector('img');
                if(a && img) {
                    var link = a.href.indexOf('http') !== -1 ? a.href : BASE + a.getAttribute('href');
                    results.push({ title: img.alt, link: link, img: img.dataset.src || img.src, isSeries: link.indexOf('/series/') !== -1 });
                }
            });
            document.getElementById('grid-search').innerHTML = results.map(function(item) {
                return '<div class="card" tabindex="0" onclick=\'handleAction(' + JSON.stringify(item).replace(/'/g, "&apos;") + ')\'><img src="'+item.img+'"><div class="card-label">'+item.title+'</div></div>';
            }).join('');
            document.getElementById('row-search').classList.add('visible');
        } catch (e) { debugLog("Search Error"); }
    }

    // --- Episode / Series Logic ---
    async function loadEpisodes(item) {
        state.currentSeries = item; 
        debugLog("Opening: " + item.title);
        document.getElementById('row-episodes').classList.add('visible');
        document.getElementById('episodes-label').innerText = item.title;
        var btn = document.getElementById('fav-toggle-btn');
        btn.style.display = 'block';
        refreshFavBtnUI();

        try {
            var res = await fetch(PROXY(item.link));
            var text = await res.text();
            var doc = new DOMParser().parseFromString(text, 'text/html');
            var eps = [];
            doc.querySelectorAll('a[href*="/episode/"]').forEach(function(a) {
                var link = a.href.indexOf('http') !== -1 ? a.href : BASE + a.getAttribute('href');
                eps.push({ title: a.innerText.trim(), link: link, img: item.img });
            });
            document.getElementById('grid-episodes').innerHTML = eps.map(function(ep) {
                return '<div class="card" tabindex="0" onclick="fetchAndPlay(\''+ep.link+'\', \''+ep.title+'\')"><img src="'+ep.img+'"><div class="card-label">'+ep.title+'</div></div>';
            }).join('');
        } catch (e) { debugLog("Series Error"); }
    }

    // --- Favorite Core Logic ---
    function getFavs() { var d = localStorage.getItem(FAV_KEY); return d ? JSON.parse(d) : []; }
    
    function handleFavoriteClick() {
        if(!state.currentSeries) return;
        var favs = getFavs();
        var index = -1;
        for(var i=0; i<favs.length; i++) { if(favs[i].link === state.currentSeries.link) { index = i; break; } }

        if(index > -1) {
            favs.splice(index, 1);
            debugLog("Removed Favorite");
        } else {
            favs.push(state.currentSeries);
            debugLog("Added Favorite");
        }
        localStorage.setItem(FAV_KEY, JSON.stringify(favs));
        refreshFavBtnUI();
    }

    function refreshFavBtnUI() {
        if(!state.currentSeries) return;
        var favs = getFavs();
        var isFav = favs.some(function(f) { return f.link === state.currentSeries.link; });
        document.getElementById('fav-icon').className = isFav ? "fas fa-heart" : "far fa-heart";
        document.getElementById('fav-text').innerText = isFav ? "إزالة من المفضلة" : "أضف للمفضلة";
        document.getElementById('fav-toggle-btn').style.background = isFav ? "#e50914" : "#444";
    }

    function toggleFavSection() {
        var row = document.getElementById('row-favs');
        var grid = document.getElementById('grid-favs');
        if(row.classList.contains('visible')) { row.classList.remove('visible'); return; }
        
        var favs = getFavs();
        grid.innerHTML = favs.map(function(item) {
            return '<div class="card" tabindex="0" onclick=\'handleAction(' + JSON.stringify(item).replace(/'/g, "&apos;") + ')\'><img src="'+item.img+'"><div class="card-label">'+item.title+'</div></div>';
        }).join('') || '<div style="padding:20px;">القائمة فارغة</div>';
        row.classList.add('visible');
    }

    function clearAllData() { localStorage.clear(); location.reload(); }

    async function fetchAndPlay(l, t) {
        document.getElementById('player-container').style.display = 'block';
        document.getElementById('active-episode-title').innerText = "جاري التحميل: " + t;
        try {
            var res = await fetch(PROXY(l));
            var h = await res.text();
            var m = h.match(/go\.ak\.sv\/link\/([a-zA-Z0-9]+)/);
            if(!m) return;
            var dl = await (await fetch(PROXY(l.replace('/episode/', '/download/'+m[1]+'/')))).text();
            var mp4 = new DOMParser().parseFromString(dl, 'text/html').querySelector('a[href*=".mp4"]');
            if(mp4) {
                var v = document.getElementById('main-video');
                v.src = mp4.href;
                document.getElementById('active-episode-title').innerText = t;
                v.focus();
            }
        } catch(e) { debugLog("Play Error"); }
    }

    function handleAction(i) { if(i.isSeries) loadEpisodes(i); else fetchAndPlay(i.link, i.title); }
    document.getElementById('search-input').onkeydown = function(e) { if(e.key==='Enter') startSearch(this.value); };
</script>
</body>
</html>
