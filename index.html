<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Akwam TV - Full Fix</title>
    <style>
        :root { --netflix-red: #e50914; --bg-dark: #141414; --card-w: 160px; --card-h: 100px; --debug-clr: #00ff88; --sidebar-w: 250px; }
        body { background-color: var(--bg-dark); color: white; font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        .main-layout { display: flex; flex: 1; overflow: hidden; }
        .sidebar { width: var(--sidebar-w); background: #0b0b0b; border-left: 1px solid #333; display: flex; flex-direction: column; padding: 20px; overflow-y: auto; }
        .content-area { flex: 1; overflow-y: auto; padding-bottom: 150px; scroll-behavior: smooth; }

        .header { position: sticky; top: 0; z-index: 1000; background: var(--bg-dark); padding: 15px 4%; border-bottom: 1px solid #333; }
        .header input { background: #222; border: 2px solid #444; color: white; padding: 12px; width: 100%; border-radius: 8px; outline: none; font-size: 16px; }

        .fav-title { font-size: 0.9rem; color: var(--netflix-red); font-weight: bold; margin-bottom: 10px; }
        .fav-item { background: #222; border: 1px solid #444; color: #ddd; padding: 10px; border-radius: 6px; margin-bottom: 8px; cursor: pointer; font-size: 0.85rem; display: flex; justify-content: space-between; align-items: center; }
        .fav-item:hover { border-color: var(--netflix-red); }
        .remove-fav { color: #666; font-size: 1.2rem; padding: 0 5px; }

        .mobile-fav-bar { display: none; padding: 10px 4%; gap: 10px; overflow-x: auto; background: #0b0b0b; border-bottom: 1px solid #222; }

        .btn-fav-add { background: var(--netflix-red); color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; margin: 10px 0; display: none; width: 100%; max-width: 250px; }
        .btn-fav-add.visible { display: block; }

        .app-container { padding: 10px 4%; }
        .row { display: none; margin-bottom: 25px; }
        .row.visible { display: block; }
        .row-title { font-size: 1.1rem; font-weight: bold; margin-bottom: 12px; border-right: 4px solid var(--netflix-red); padding-right: 10px; }
        .row-content { display: flex; gap: 15px; overflow-x: auto; padding: 10px 0; scrollbar-width: none; }
        
        .card { min-width: var(--card-w); height: var(--card-h); background: #333; border-radius: 8px; position: relative; overflow: hidden; cursor: pointer; border: 2px solid transparent; }
        .card:active { transform: scale(0.95); }
        .card img { width: 100%; height: 100%; object-fit: cover; }
        .card-label { position: absolute; bottom: 0; width: 100%; background: rgba(0,0,0,0.85); font-size: 0.7rem; text-align: center; padding: 5px 2px; min-height: 30px; display: flex; align-items: center; justify-content: center; }

        #player-container { display: none; margin-top: 20px; width: 100%; }
        #player-container.visible { display: block; }
        #player-wrapper { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 12px; overflow: hidden; border: 1px solid #444; }
        iframe { width: 100%; height: 100%; border: none; }

        #debug-bar { position: fixed; bottom: 0; width: 100%; background: rgba(0,0,0,0.95); color: var(--debug-clr); padding: 10px 15px; font-family: monospace; font-size: 0.7rem; z-index: 9999; border-top: 1px solid var(--debug-clr); word-break: break-all; max-height: 60px; overflow-y: auto; }

        @media (max-width: 768px) {
            .sidebar { display: none; }
            .mobile-fav-bar { display: flex; }
            .fav-item { min-width: 120px; flex-shrink: 0; margin-bottom: 0; white-space: nowrap; display: inline-flex; }
        }
    </style>
</head>
<body>

<div class="header">
    <h2 style="color: var(--netflix-red); margin: 0 0 10px 0; font-size: 1.2rem;">AKWAM TV PRO</h2>
    <input type="text" id="search-input" placeholder="ابحث عن مسلسل..." autocomplete="off">
</div>

<div class="mobile-fav-bar" id="mobile-favs"></div>

<div class="main-layout">
    <div class="sidebar">
        <div class="fav-title">المفضلة ❤️</div>
        <div id="sidebar-favs"></div>
    </div>

    <div class="content-area" id="main-scroll">
        <div class="app-container">
            <center><button id="add-to-fav-btn" class="btn-fav-add">+ إضافة للمفضلة</button></center>

            <div class="row" id="row-search">
                <div class="row-title">نتائج البحث</div>
                <div class="row-content" id="grid-search"></div>
            </div>
            
            <div class="row" id="row-episodes">
                <div class="row-title" id="episodes-label">الحلقات</div>
                <div class="row-content" id="grid-episodes"></div>
            </div>

            <div id="player-container">
                <div id="active-episode-title" style="margin-bottom:10px; font-weight:bold; color:var(--debug-clr)"></div>
                <div id="player-wrapper">
                    <iframe id="video-frame" allowfullscreen></iframe>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="debug-bar">DEBUG: جاهز للعمل</div>

<script>
    const PROXY_LIST = [(url) => `https://corsproxy.io/?${encodeURIComponent(url)}`, (url) => `https://api.allorigins.win/get?url=${encodeURIComponent(url)}` ];
    const BASE = "https://ak.sv";
    let state = { searchItems: [], episodeItems: [], currentSeries: null };
    let favorites = JSON.parse(localStorage.getItem('akwam_favs')) || [];

    const searchInput = document.getElementById('search-input');

    function updateFavUI() {
        const containers = [document.getElementById('sidebar-favs'), document.getElementById('mobile-favs')];
        containers.forEach(container => {
            if(!container) return;
            container.innerHTML = favorites.map((fav, i) => `
                <div class="fav-item" onclick="loadEpisodes({link: '${fav.link}', title: '${fav.title}', img: '${fav.img}'})">
                    <span>${fav.title}</span>
                    <span class="remove-fav" onclick="event.stopPropagation(); removeFavorite(${i})">×</span>
                </div>
            `).join('');
        });
    }

    function addFavorite() {
        if (!state.currentSeries) return;
        if (favorites.some(f => f.link === state.currentSeries.link)) return;
        favorites.push({...state.currentSeries});
        localStorage.setItem('akwam_favs', JSON.stringify(favorites));
        updateFavUI();
        debug("تمت الإضافة للمفضلة");
    }

    function removeFavorite(index) {
        favorites.splice(index, 1);
        localStorage.setItem('akwam_favs', JSON.stringify(favorites));
        updateFavUI();
    }

    searchInput.addEventListener('keydown', e => { if(e.key === 'Enter') startSearch(searchInput.value); });

    async function smartFetch(url) {
        for (let proxy of PROXY_LIST) {
            try {
                const res = await fetch(proxy(url));
                if (res.ok) return proxy === PROXY_LIST[1] ? (await res.json()).contents : await res.text();
            } catch (e) {}
        }
        return null;
    }

    async function startSearch(q) {
        debug(`بحث عن: ${q}`);
        const html = await smartFetch(`${BASE}/search?q=${q}`);
        if(!html) return;
        const doc = new DOMParser().parseFromString(html, 'text/html');
        const entries = Array.from(doc.querySelectorAll('.entry-box, .subject-item, a[href*="/movie/"], a[href*="/series/"]'));
        
        state.searchItems = entries.map(el => {
            const a = el.tagName === 'A' ? el : el.querySelector('a');
            const img = el.querySelector('img');
            if (!a || !img) return null;
            return {
                title: img.getAttribute('alt') || a.innerText.trim(),
                link: a.href.startsWith('http') ? a.href : BASE + a.getAttribute('href'),
                img: img.getAttribute('data-src') || img.src,
                isSeries: a.href.includes('/series/')
            };
        }).filter(item => item && (item.link.includes('/series/') || item.link.includes('/movie/')))
          .filter((v, i, a) => a.findIndex(t => t.link === v.link) === i);

        renderRow('grid-search', state.searchItems);
        document.getElementById('row-search').classList.add('visible');
        document.getElementById('add-to-fav-btn').classList.remove('visible');
    }

    async function loadEpisodes(item) {
        state.currentSeries = item;
        debug(`تحميل: ${item.title}`);
        document.getElementById('add-to-fav-btn').classList.add('visible');
        
        const html = await smartFetch(item.link);
        const doc = new DOMParser().parseFromString(html, 'text/html');
        const rawEps = Array.from(doc.querySelectorAll('a[href*="/episode/"]')).map(a => ({
            title: a.innerText.trim(),
            link: a.href.startsWith('http') ? a.href : BASE + a.getAttribute('href'),
            img: item.img // تأكيد تمرير الصورة من المسلسل للحلقة
        }));

        state.episodeItems = rawEps.filter((v, i, a) => a.findIndex(t => t.link === v.link) === i);

        if(state.episodeItems.length > 0) {
            renderRow('grid-episodes', state.episodeItems);
            document.getElementById('row-episodes').classList.add('visible');
            document.getElementById('episodes-label').innerText = `حلقات: ${item.title}`;
            document.getElementById('row-episodes').scrollIntoView({ behavior: 'smooth' });
        } else fetchAndPlay(item.link, item.title);
    }

    async function fetchAndPlay(link, title) {
        debug(`تحليل: ${title}`, link);
        const container = document.getElementById('player-container');
        const videoFrame = document.getElementById('video-frame');
        
        // إظهار المشغل فوراً
        container.style.display = 'block';
        container.classList.add('visible');
        document.getElementById('active-episode-title').innerText = `جاري التحميل...`;

        const mp4Url = await extractMp4(link);
        const finalUrl = mp4Url || await getIframe(link);

        if(finalUrl) {
            videoFrame.src = finalUrl;
            document.getElementById('active-episode-title').innerText = `تشغيل الآن: ${title}`;
            debug(`الرابط المستخرج:`, finalUrl);
            container.scrollIntoView({ behavior: 'smooth' });
        } else {
            document.getElementById('active-episode-title').innerText = `فشل تشغيل: ${title}`;
        }
    }

    async function extractMp4(link) {
        try {
            const html = await smartFetch(link);
            const doc = new DOMParser().parseFromString(html, 'text/html');
            const goLink = doc.querySelector('a[href*="go.ak.sv/link/"]');
            if(!goLink) return null;
            const id = goLink.href.split('/').pop();
            const dlHtml = await smartFetch(link.replace('/episode/', `/download/${id}/`));
            const mp4 = new DOMParser().parseFromString(dlHtml, 'text/html').querySelector('a[href*=".mp4"]');
            return mp4 ? mp4.href : null;
        } catch(e) { return null; }
    }

    async function getIframe(link) {
        const html = await smartFetch(link);
        const doc = new DOMParser().parseFromString(html, 'text/html');
        const watchBtn = doc.querySelector('a[href*="/watch/"]');
        if(!watchBtn) return null;
        const wHtml = await smartFetch(watchBtn.href.startsWith('http') ? watchBtn.href : BASE + watchBtn.getAttribute('href'));
        return new DOMParser().parseFromString(wHtml, 'text/html').querySelector('iframe')?.src;
    }

    function renderRow(id, data) {
        document.getElementById(id).innerHTML = data.map((item, i) => `
            <div class="card" onclick="handleAction('${id}', ${i})">
                <img src="${item.img}" onerror="this.src='https://via.placeholder.com/160x100?text=No+Image'">
                <div class="card-label">${item.title}</div>
            </div>
        `).join('');
    }

    function handleAction(row, idx) {
        const item = (row === 'grid-search') ? state.searchItems[idx] : state.episodeItems[idx];
        if(row === 'grid-search' && item.isSeries) loadEpisodes(item);
        else fetchAndPlay(item.link, item.title);
    }

    function debug(msg, url = "") {
        document.getElementById('debug-bar').innerHTML = `[${new Date().toLocaleTimeString()}] ${msg} <br><small>${url}</small>`;
    }

    document.getElementById('add-to-fav-btn').addEventListener('click', addFavorite);
    updateFavUI();
</script>
</body>
</html>
