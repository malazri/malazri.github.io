<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AlAzri TV - v4.5</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { --primary-red: #e50914; --bg-dark: #0a0a0a; --card-w: 160px; --card-h: 100px; }
        
        body { background-color: var(--bg-dark); color: white; font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

        /* الهيدر ثابت في الأعلى تماماً */
        .fixed-header { 
            position: fixed; top: 0; left: 0; right: 0; z-index: 4000; 
            background: #000; padding: 12px 4%; 
            display: flex; justify-content: space-between; align-items: center; 
            border-bottom: 1px solid #222;
        }

        .brand { color: var(--primary-red); font-weight: 900; font-size: 1.5rem; cursor: pointer; }
        .header-actions { display: flex; align-items: center; gap: 15px; }

        /* البحث والمفضلة */
        .search-wrapper { display: flex; align-items: center; gap: 15px; }
        .search-container { display: none; background: #222; border-radius: 5px; padding: 5px 10px; border: 1px solid #444; }
        .search-container.active { display: flex; }
        .search-input { background: transparent; border: none; color: white; outline: none; width: 150px; }
        
        .header-icon { cursor: pointer; font-size: 1.2rem; color: #bbb; padding: 5px; }
        #fav-list-trigger { display: none; } /* يظهر فقط عند تسجيل الدخول */

        .btn-google { background: white; color: black; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; display: flex; align-items: center; gap: 5px; }
        .btn-auth { background: var(--primary-red); color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-auth:disabled { background: #333; cursor: not-allowed; color: #777; }

        #mobile-search-row { display: none; position: fixed; top: 60px; left:0; right:0; z-index: 3999; background: #111; padding: 10px 4%; border-bottom: 1px solid #333; }
        #mobile-search-row.active { display: block; }

        .content-area { flex: 1; overflow-y: auto; padding: 85px 20px 100px 20px; position: relative; z-index: 10; }

        .row-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .close-btn { background: #333; color: #fff; border: none; border-radius: 50%; width: 30px; height: 30px; cursor: pointer; font-weight: bold; }

        .row { display: none; margin-bottom: 30px; }
        .row.visible { display: block; }
        .row-title { font-size: 1.1rem; font-weight: bold; border-right: 4px solid var(--primary-red); padding-right: 10px; }
        .row-content { display: flex; gap: 15px; overflow-x: auto; padding: 10px 5px; }

        .card { min-width: var(--card-w); height: var(--card-h); background: #1a1a1a; border-radius: 8px; position: relative; cursor: pointer; flex-shrink: 0; border: 1px solid transparent; }
        .card:focus { border-color: white; transform: scale(1.05); outline: none; }
        .card img { width: 100%; height: 100%; object-fit: cover; border-radius: 8px; }
        .card-label { position: absolute; bottom: 0; width: 100%; background: rgba(0,0,0,0.8); font-size: 0.7rem; text-align: center; padding: 5px; border-bottom-left-radius: 8px; border-bottom-right-radius: 8px; }

        #player-container { display: none; width: 100%; max-width: 1000px; margin: 0 auto 30px auto; background: #000; border-radius: 12px; overflow: hidden; border: 1px solid #333; }
        video { width: 100%; aspect-ratio: 16/9; display: block; }

        /* سجل المشاهدة تحت المشغل */
        .history-info { background: #161616; padding: 12px 18px; border-radius: 8px; margin-top: 12px; border-right: 4px solid var(--primary-red); font-size: 0.85rem; color: #ccc; display: none; }
        .history-info b { color: #fff; margin-left: 5px; }

        @media (max-width: 768px) { .desktop-search { display: none; } }
    </style>
</head>
<body>

<div class="fixed-header">
    <div class="brand" onclick="location.reload()">ALAZRI</div>
    
    <div class="header-actions">
        <div class="search-wrapper">
            <i class="fas fa-heart header-icon" id="fav-list-trigger" onclick="toggleFavSection()"></i>
            <div class="search-container desktop-search" id="search-container-desktop">
                <input type="text" class="search-input" placeholder="بحث..." onkeydown="if(event.key==='Enter') startSearch(this.value)">
            </div>
            <i class="fas fa-search header-icon" onclick="toggleSearch()"></i>
        </div>

        <div id="auth-section">
            <button class="btn-google" id="google-btn" onclick="loginWithGoogle()">
                <img src="https://www.google.com/favicon.ico" width="14"> دخول
            </button>
            <button class="btn-auth" id="logout-btn" style="display:none" onclick="handleLogout()">خروج</button>
        </div>
    </div>
</div>

<div id="mobile-search-row">
    <div style="display:flex; background:#222; border-radius:5px; padding:5px 10px;">
        <input type="text" id="search-input-mobile" style="background:transparent; border:none; color:white; width:100%; outline:none;" placeholder="ابحث عن مسلسل..." onkeydown="if(event.key==='Enter') startSearch(this.value)">
    </div>
</div>

<main class="content-area">
    <div class="row" id="row-search">
        <div class="row-header">
            <div class="row-title">نتائج البحث</div>
            <button class="close-btn" onclick="hideRow('row-search')">×</button>
        </div>
        <div class="row-content" id="grid-search"></div>
    </div>

    <div class="row" id="row-favs">
        <div class="row-header">
            <div class="row-title">قائمتي</div>
            <button class="close-btn" onclick="hideRow('row-favs')">×</button>
        </div>
        <div class="row-content" id="grid-favs"></div>
    </div>

    <div id="player-container">
        <video id="main-video" controls autoplay></video>
        <div style="padding:15px;">
            <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap: wrap; gap:10px;">
                <div id="active-episode-title" style="font-weight:bold; color:var(--primary-red); font-size: 1.1rem;"></div>
                <button id="copy-url-btn" class="btn-auth" style="background:#222; font-size:0.75rem;" disabled onclick="copyVideoLink()">نسخ الرابط</button>
            </div>
            <div id="history-info-box" class="history-info">
                <span>آخر مشاهدة: <b id="last-date"></b></span> | 
                <span>الوقت: <b id="last-time"></b></span> | 
                <span>توقفت عند: <b id="last-pos-text"></b></span>
            </div>
        </div>
    </div>

    <div class="row" id="row-episodes">
        <div class="row-header" style="justify-content: flex-start; gap:20px;">
            <div class="row-title" id="episodes-label">الحلقات</div>
            <button id="fav-toggle-btn" class="btn-auth" style="background:#222; font-size:0.8rem; display:none;" onclick="toggleFavorite()">
                <i id="fav-icon" class="far fa-heart"></i> <span>مفضلة</span>
            </button>
        </div>
        <div class="row-content" id="grid-episodes"></div>
    </div>
</main>

<script>
    const SB_URL = "https://hksxehxhdlzqmzrqspjc.supabase.co";
    const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imhrc3hlaHhoZGx6cW16cnFzcGpjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE2NTI2MzYsImV4cCI6MjA4NzIyODYzNn0.IrMUz0wss2qoJEXqD6Q2hlXa5J13i-_2VYxAUM_R5tY";
    const db = supabase.createClient(SB_URL, SB_KEY);
    const PROXY = (url) => `https://corsproxy.io/?${encodeURIComponent(url)}`;
    const BASE = "https://ak.sv";

    let state = { user: null, currentEpisodeLink: "", currentMp4: "", currentSeries: null };
    let favorites = [];
    const videoElem = document.getElementById('main-video');

    // --- نظام التشغيل ذو الأولوية للسجل ---
    async function fetchAndPlay(link, title) {
        state.currentEpisodeLink = link;
        state.currentMp4 = "";
        document.getElementById('copy-url-btn').disabled = true;
        document.getElementById('player-container').style.display = 'block';
        document.getElementById('history-info-box').style.display = 'none';
        document.getElementById('active-episode-title').innerText = "جاري جلب بيانات السجل...";
        
        videoElem.pause();
        videoElem.removeAttribute('src');

        try {
            let startAt = 0;
            if (state.user) {
                const { data } = await db.from('watch_history').select('*').eq('user_id', state.user.id).eq('episode_link', link).maybeSingle();
                if (data) {
                    startAt = data.last_position;
                    const d = new Date(data.updated_at);
                    document.getElementById('last-date').innerText = d.toLocaleDateString('ar-EG');
                    document.getElementById('last-time').innerText = d.toLocaleTimeString('ar-EG');
                    document.getElementById('last-pos-text').innerText = Math.floor(startAt / 60) + " دقيقة و " + (startAt % 60) + " ثانية";
                    document.getElementById('history-info-box').style.display = 'block';
                }
            }

            document.getElementById('active-episode-title').innerText = "جاري تحضير " + title;
            const html = await (await fetch(PROXY(link))).text();
            const id = html.match(/go\.ak\.sv\/link\/([a-zA-Z0-9]+)/)?.[1];
            const dlHtml = await (await fetch(PROXY(link.replace('/episode/', `/download/${id}/`)))).text();
            let mp4 = new DOMParser().parseFromString(dlHtml, 'text/html').querySelector('a[href*=".mp4"]')?.href;
            
            if(mp4) {
                state.currentMp4 = mp4;
                document.getElementById('copy-url-btn').disabled = false;
                document.getElementById('active-episode-title').innerText = title;
                videoElem.src = mp4;
                videoElem.onloadedmetadata = () => {
                    if (startAt > 5) videoElem.currentTime = startAt;
                    videoElem.play();
                };
            }
        } catch(e) { document.getElementById('active-episode-title').innerText = "خطأ في تحميل الفيديو"; }
    }

    // --- منع تكرار الحلقات ---
    async function loadEpisodes(item) {
        state.currentSeries = item;
        const grid = document.getElementById('grid-episodes');
        document.getElementById('row-episodes').classList.add('visible');
        grid.innerHTML = 'جاري التصفية...';
        
        if(state.user) {
            document.getElementById('fav-toggle-btn').style.display = 'inline-flex';
            updateFavBtn();
        }

        try {
            const html = await (await fetch(PROXY(item.link))).text();
            const doc = new DOMParser().parseFromString(html, 'text/html');
            const uniqueMap = new Map();

            doc.querySelectorAll('a[href*="/episode/"]').forEach(a => {
                const href = a.getAttribute('href');
                const fullLink = href.includes('http') ? href : BASE + href;
                if(!uniqueMap.has(fullLink)) {
                    uniqueMap.set(fullLink, { title: a.innerText.trim(), link: fullLink, img: item.img });
                }
            });

            const finalEps = Array.from(uniqueMap.values());
            grid.innerHTML = finalEps.map(ep => `
                <div class="card" tabindex="200" onclick="fetchAndPlay('${ep.link}', '${ep.title}')">
                    <img src="${ep.img}">
                    <div class="card-label">${ep.title}</div>
                </div>
            `).join('');
            document.getElementById('episodes-label').innerText = item.title;
        } catch(e) { grid.innerHTML = 'خطأ في التحميل'; }
    }

    // --- البحث والمفضلة ---
    async function startSearch(q) {
        if(!q) return;
        const res = await fetch(PROXY(`${BASE}/search?q=${q}`));
        const doc = new DOMParser().parseFromString(await res.text(), 'text/html');
        const unique = new Map();
        doc.querySelectorAll('.entry-box, .subject-item, a[href*="/movie/"], a[href*="/series/"]').forEach(el => {
            const a = el.tagName === 'A' ? el : el.querySelector('a');
            const img = el.querySelector('img');
            if(a && img) {
                const link = a.href.includes('http') ? a.href : BASE + a.getAttribute('href');
                if(!unique.has(link)) unique.set(link, { title: img.alt, link, img: img.dataset.src || img.src, isSeries: link.includes('/series/') });
            }
        });
        document.getElementById('grid-search').innerHTML = Array.from(unique.values()).map(item => `
            <div class="card" tabindex="100" onclick="handleAction(${JSON.stringify(item).replace(/"/g, '&quot;')})">
                <img src="${item.img}">
                <div class="card-label">${item.title}</div>
            </div>
        `).join('');
        document.getElementById('row-search').classList.add('visible');
    }

    // --- وظائف عامة ---
    function toggleSearch() {
        const isMob = window.innerWidth <= 768;
        const target = isMob ? document.getElementById('mobile-search-row') : document.getElementById('search-container-desktop');
        target.classList.toggle('active');
    }
    function hideRow(id) { document.getElementById(id).classList.remove('visible'); }
    function toggleFavSection() {
        if(!state.user) return;
        const row = document.getElementById('row-favs');
        if(!row.classList.contains('visible')) renderFavorites();
        row.classList.toggle('visible');
    }
    async function checkUser() {
        const { data: { session } } = await db.auth.getSession();
        if(session?.user) {
            state.user = session.user;
            document.getElementById('google-btn').style.display = 'none';
            document.getElementById('logout-btn').style.display = 'block';
            document.getElementById('fav-list-trigger').style.display = 'block';
            loadFavorites();
            setInterval(saveProgress, 10000);
        }
    }
    async function saveProgress() {
        if (state.user && state.currentEpisodeLink && !videoElem.paused) {
            const pos = Math.floor(videoElem.currentTime);
            if (pos > 5) await db.from('watch_history').upsert({ user_id: state.user.id, episode_link: state.currentEpisodeLink, last_position: pos, updated_at: new Date() }, { onConflict: 'user_id, episode_link' });
        }
    }
    async function loadFavorites() {
        const { data } = await db.from('favorites').select('series_data');
        if(data) favorites = data.map(d => d.series_data);
    }
    function renderFavorites() {
        document.getElementById('grid-favs').innerHTML = favorites.map(item => `
            <div class="card" onclick="loadEpisodes(${JSON.stringify(item).replace(/"/g, '&quot;')})">
                <img src="${item.img}">
                <div class="card-label">${item.title}</div>
            </div>
        `).join('') || '<div style="padding:20px;">المفضلة فارغة</div>';
    }
    function updateFavBtn() {
        const isFav = favorites.some(f => f.link === state.currentSeries.link);
        document.getElementById('fav-icon').className = isFav ? "fas fa-heart" : "far fa-heart";
    }
    async function toggleFavorite() {
        if(!state.user) return;
        const isFav = favorites.some(f => f.link === state.currentSeries.link);
        if(isFav) {
            await db.from('favorites').delete().eq('user_id', state.user.id).filter('series_data->>link', 'eq', state.currentSeries.link);
            favorites = favorites.filter(f => f.link !== state.currentSeries.link);
        } else {
            await db.from('favorites').insert([{ user_id: state.user.id, series_data: state.currentSeries }]);
            favorites.push(state.currentSeries);
        }
        updateFavBtn();
    }
    function handleAction(item) { if(item.isSeries) loadEpisodes(item); else fetchAndPlay(item.link, item.title); }
    function copyVideoLink() { if(state.currentMp4) { navigator.clipboard.writeText(state.currentMp4); alert("تم نسخ الرابط المباشر!"); } }
    async function loginWithGoogle() { await db.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: window.location.href } }); }
    async function handleLogout() { await db.auth.signOut(); location.reload(); }

    checkUser();
</script>
</body>
</html>
