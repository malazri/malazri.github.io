<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Akwam TV Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { --netflix-red: #e50914; --bg-dark: #141414; --card-w: 160px; --card-h: 100px; --debug-clr: #00ff88; }
        
        body { background-color: var(--bg-dark); color: white; font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

        /* منع الزوم وتحسين التركيز */
        [tabindex]:focus {
            outline: none !important;
            box-shadow: 0 0 0 3px white, 0 0 15px var(--netflix-red);
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
        }

        .fixed-header { 
            position: sticky; top: 0; z-index: 2005; 
            background: #000; padding: 12px 4%; 
            display: flex; justify-content: space-between; align-items: center; 
            border-bottom: 1px solid #333;
        }

        .brand { color: var(--netflix-red); font-weight: bold; font-size: 1.3rem; cursor: pointer; padding: 5px; }

        .header-actions { display: flex; align-items: center; gap: 15px; }

        .search-container { display: flex; align-items: center; background: #222; border-radius: 20px; padding: 5px 12px; transition: 0.3s; }
        .search-input { background: transparent; border: none; color: white; outline: none; width: 120px; font-size: 0.9rem; padding: 5px; }

        .btn-google { 
            background: white; color: black; border: none; padding: 8px 16px; 
            border-radius: 4px; cursor: pointer; font-size: 0.85rem; font-weight: bold; 
            display: flex; align-items: center; gap: 8px;
        }

        .btn-auth { background: var(--netflix-red); color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; }

        .main-layout { display: flex; flex: 1; overflow: hidden; }
        .sidebar { width: 240px; background: #0b0b0b; border-left: 1px solid #333; padding: 15px; overflow-y: auto; }
        .content-area { flex: 1; overflow-y: auto; padding: 20px; padding-bottom: 100px; }

        .btn-fav-toggle { 
            background: #222; color: white; border: 1px solid #444; padding: 8px 15px; 
            border-radius: 20px; cursor: pointer; display: none; align-items: center; gap: 8px; margin-right: 15px;
        }
        .btn-fav-toggle.visible { display: inline-flex; }
        .btn-fav-toggle.active { background: var(--netflix-red); border-color: var(--netflix-red); }

        .row { display: none; margin-bottom: 30px; }
        .row.visible { display: block; }
        .row-title { font-size: 1.1rem; font-weight: bold; border-right: 4px solid var(--netflix-red); padding-right: 10px; margin-bottom: 15px; }
        .row-content { display: flex; gap: 15px; overflow-x: auto; padding: 10px 5px; }

        .card { min-width: var(--card-w); height: var(--card-h); background: #333; border-radius: 8px; position: relative; cursor: pointer; flex-shrink: 0; transition: transform 0.2s; }
        .card img { width: 100%; height: 100%; object-fit: cover; border-radius: 8px; pointer-events: none; }
        .card-label { position: absolute; bottom: 0; width: 100%; background: rgba(0,0,0,0.8); font-size: 0.75rem; text-align: center; padding: 5px; border-bottom-left-radius: 8px; border-bottom-right-radius: 8px; }

        #player-container { display: none; width: 100%; max-width: 900px; margin: 0 auto 30px auto; background: #000; border-radius: 12px; overflow: hidden; }
        video { width: 100%; aspect-ratio: 16/9; }

        .fav-item { background: #1a1a1a; padding: 10px; border-radius: 6px; margin-bottom: 10px; cursor: pointer; font-size: 0.9rem; border: 1px solid transparent; }

        #debug-bar { position: fixed; bottom: 0; width: 100%; background: rgba(0,0,0,0.9); color: var(--debug-clr); padding: 5px 15px; font-size: 0.7rem; z-index: 9999; border-top: 1px solid #333; }
        
        @media (max-width: 768px) { .sidebar { display: none; } }
    </style>
</head>
<body>

<div class="fixed-header">
    <div class="brand" tabindex="1" onclick="location.reload()">AKWAM PRO</div>
    
    <div class="header-actions">
        <div class="search-container">
            <input type="text" id="search-input" class="search-input" placeholder="بحث..." tabindex="2">
            <i class="fas fa-search" style="color:#888"></i>
        </div>

        <div id="auth-section">
            <button class="btn-google" id="google-btn" tabindex="3" onclick="loginWithGoogle()">
                <img src="https://www.google.com/favicon.ico" width="16"> تسجيل دخول جوجل
            </button>
            <button class="btn-auth" id="logout-btn" style="display:none" tabindex="3" onclick="handleLogout()">خروج</button>
        </div>
    </div>
</div>

<div class="main-layout">
    <aside class="sidebar" id="sidebar">
        <div style="color:var(--netflix-red); font-weight:bold; margin-bottom:15px;">المفضلة</div>
        <div id="sidebar-favs"></div>
    </aside>

    <main class="content-area">
        <div id="player-container">
            <video id="main-video" controls autoplay tabindex="4"></video>
            <div style="padding:15px; display:flex; justify-content:space-between; align-items:center;">
                <div id="active-episode-title"></div>
                <button class="btn-auth" style="background:#444" tabindex="5" onclick="copyVideoLink()">نسخ الرابط</button>
            </div>
        </div>

        <div class="row" id="row-search">
            <div class="row-title">نتائج البحث</div>
            <div class="row-content" id="grid-search"></div>
        </div>

        <div class="row" id="row-episodes">
            <div style="display:flex; align-items:center; margin-bottom:15px;">
                <div class="row-title" id="episodes-label" style="margin-bottom:0">الحلقات</div>
                <button id="fav-toggle-btn" class="btn-fav-toggle" tabindex="6" onclick="toggleFavorite()">
                    <i id="fav-icon" class="far fa-heart"></i> <span id="fav-text">إضافة للمفضلة</span>
                </button>
            </div>
            <div class="row-content" id="grid-episodes"></div>
        </div>
    </main>
</div>

<div id="debug-bar">نظام التحكم الشامل مفعل (الأسهم للتنقل)</div>

<script>
    const SB_URL = "https://hksxehxhdlzqmzrqspjc.supabase.co";
    const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imhrc3hlaHhoZGx6cW16cnFzcGpjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE2NTI2MzYsImV4cCI6MjA4NzIyODYzNn0.IrMUz0wss2qoJEXqD6Q2hlXa5J13i-_2VYxAUM_R5tY";
    const db = supabase.createClient(SB_URL, SB_KEY);
    const PROXY = (url) => `https://corsproxy.io/?${encodeURIComponent(url)}`;
    const BASE = "https://ak.sv";

    let state = { searchItems: [], episodeItems: [], currentSeries: null, user: null, currentMp4: "", currentEpisodeLink: "" };
    let favorites = [];
    const videoElem = document.getElementById('main-video');

    // --- نظام التنقل بالريموت والكيبورد الذكي ---
    document.addEventListener('keydown', (e) => {
        const focusable = Array.from(document.querySelectorAll('[tabindex]:not([tabindex="-1"])'));
        let index = focusable.indexOf(document.activeElement);

        if (e.key === 'ArrowRight') {
            index = (index + 1) % focusable.length;
            focusable[index].focus();
            e.preventDefault();
        } else if (e.key === 'ArrowLeft') {
            index = (index - 1 + focusable.length) % focusable.length;
            focusable[index].focus();
            e.preventDefault();
        } else if (e.key === 'Enter') {
            if (document.activeElement.classList.contains('card') || document.activeElement.classList.contains('fav-item')) {
                document.activeElement.click();
            }
        }
        
        // تمرير المحتوى تلقائياً عند التركيز
        if (document.activeElement) {
            document.activeElement.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'center' });
        }
    });

    document.getElementById('search-input').addEventListener('keydown', e => {
        if(e.key === 'Enter') startSearch(e.target.value);
    });

    // --- وظائف Supabase ---
    async function checkUser() {
        const { data: { session } } = await db.auth.getSession();
        if(session?.user) {
            state.user = session.user;
            document.getElementById('google-btn').style.display = 'none';
            document.getElementById('logout-btn').style.display = 'block';
            loadFavorites();
        }
    }

    async function loginWithGoogle() { 
        await db.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: window.location.origin } }); 
    }
    
    async function handleLogout() { await db.auth.signOut(); location.reload(); }

    async function loadFavorites() {
        const { data } = await db.from('favorites').select('series_data');
        if(data) { 
            favorites = data.map(d => d.series_data); 
            updateFavUI();
        }
    }

    async function toggleFavorite() {
        if(!state.user) return alert("سجل دخولك أولاً");
        const isFav = favorites.some(f => f.link === state.currentSeries.link);
        if(isFav) {
            await db.from('favorites').delete().eq('user_id', state.user.id).filter('series_data->>link', 'eq', state.currentSeries.link);
            favorites = favorites.filter(f => f.link !== state.currentSeries.link);
        } else {
            await db.from('favorites').insert([{ user_id: state.user.id, series_data: state.currentSeries }]);
            favorites.push(state.currentSeries);
        }
        updateFavUI();
        updateFavButtonState();
    }

    function updateFavUI() {
        document.getElementById('sidebar-favs').innerHTML = favorites.map((fav, i) => `
            <div class="fav-item" tabindex="${700 + i}" onclick="loadEpisodes(${JSON.stringify(fav).replace(/"/g, '&quot;')})">
                ${fav.title}
            </div>
        `).join('');
    }

    function updateFavButtonState() {
        const btn = document.getElementById('fav-toggle-btn');
        if(!state.currentSeries) return btn.classList.remove('visible');
        btn.classList.add('visible');
        const isFav = favorites.some(f => f.link === state.currentSeries.link);
        btn.classList.toggle('active', isFav);
        document.getElementById('fav-text').innerText = isFav ? "في المفضلة" : "إضافة للمفضلة";
        document.getElementById('fav-icon').className = isFav ? "fas fa-heart" : "far fa-heart";
    }

    // --- جلب البيانات ---
    async function startSearch(q) {
        if(!q) return;
        debug("جاري البحث...");
        const res = await fetch(PROXY(`${BASE}/search?q=${q}`));
        const doc = new DOMParser().parseFromString(await res.text(), 'text/html');
        const unique = new Map();
        doc.querySelectorAll('.entry-box, .subject-item, a[href*="/movie/"], a[href*="/series/"]').forEach(el => {
            const a = el.tagName === 'A' ? el : el.querySelector('a');
            const img = el.querySelector('img');
            if(a && img) {
                const link = a.href.includes('http') ? a.href : BASE + a.getAttribute('href');
                if(!unique.has(link)) unique.set(link, { title: img.alt, link, img: img.dataset.src || img.src, isSeries: link.includes('/series/') });
            }
        });
        state.searchItems = Array.from(unique.values());
        renderRow('grid-search', state.searchItems, 100);
        document.getElementById('row-search').classList.add('visible');
    }

    async function loadEpisodes(item) {
        state.currentSeries = item;
        updateFavButtonState();
        document.getElementById('grid-episodes').innerHTML = 'جاري التحميل...';
        document.getElementById('row-episodes').classList.add('visible');
        const doc = new DOMParser().parseFromString(await (await fetch(PROXY(item.link))).text(), 'text/html');
        const uniqueEps = new Map();
        doc.querySelectorAll('a[href*="/episode/"]').forEach(a => {
            const link = a.href.includes('http') ? a.href : BASE + a.getAttribute('href');
            if(!uniqueEps.has(link)) uniqueEps.set(link, { title: a.innerText.trim(), link, img: item.img });
        });
        state.episodeItems = Array.from(uniqueEps.values());
        if(state.episodeItems.length > 0) {
            renderRow('grid-episodes', state.episodeItems, 200);
            document.getElementById('episodes-label').innerText = `حلقات: ${item.title}`;
        } else fetchAndPlay(item.link, item.title);
    }

    async function fetchAndPlay(link, title) {
        state.currentEpisodeLink = link;
        document.getElementById('player-container').style.display = 'block';
        videoElem.src = "";
        try {
            const html = await (await fetch(PROXY(link))).text();
            const id = html.match(/go\.ak\.sv\/link\/([a-zA-Z0-9]+)/)?.[1];
            const dlHtml = await (await fetch(PROXY(link.replace('/episode/', `/download/${id}/`)))).text();
            let mp4 = new DOMParser().parseFromString(dlHtml, 'text/html').querySelector('a[href*=".mp4"]')?.href;
            if(mp4) {
                state.currentMp4 = mp4;
                let startAt = 0;
                if(state.user) {
                    const { data } = await db.from('watch_history').select('last_position').eq('user_id', state.user.id).eq('episode_link', link).maybeSingle();
                    if(data) startAt = data.last_position;
                }
                videoElem.src = mp4;
                document.getElementById('active-episode-title').innerText = title;
                videoElem.onloadedmetadata = () => { if(startAt > 5) videoElem.currentTime = startAt; videoElem.play(); };
                videoElem.focus();
            }
        } catch(e) { debug("فشل التشغيل"); }
    }

    function renderRow(id, data, baseTab) {
        document.getElementById(id).innerHTML = data.map((item, i) => `
            <div class="card" tabindex="${baseTab + i}" onclick="handleAction('${id}', ${i})">
                <img src="${item.img}">
                <div class="card-label">${item.title}</div>
            </div>
        `).join('');
    }

    function handleAction(row, idx) {
        const item = (row === 'grid-search') ? state.searchItems[idx] : state.episodeItems[idx];
        if(item.isSeries) loadEpisodes(item); else fetchAndPlay(item.link, item.title);
    }

    function copyVideoLink() { navigator.clipboard.writeText(state.currentMp4); debug("تم النسخ!"); }
    function debug(m) { document.getElementById('debug-bar').innerText = `DEBUG: ${m}`; }

    // حفظ التقدم
    setInterval(async () => {
        if(state.user && state.currentEpisodeLink && !videoElem.paused) {
            const pos = Math.floor(videoElem.currentTime);
            if(pos > 5) await db.from('watch_history').upsert({ user_id: state.user.id, episode_link: state.currentEpisodeLink, last_position: pos, updated_at: new Date() }, { onConflict: 'user_id, episode_link' });
        }
    }, 10000);

    checkUser();
</script>
</body>
</html>
