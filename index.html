<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Akwam TV - Smart Focus</title>
    <style>
        :root { --netflix-red: #e50914; --bg-dark: #141414; --card-w: 160px; --card-h: 100px; --debug-clr: #00ff88; }
        body { background-color: var(--bg-dark); color: white; font-family: 'Segoe UI', sans-serif; margin: 0; overflow-x: hidden; }
        
        .header { position: sticky; top: 0; z-index: 2000; background: var(--bg-dark); padding: 15px 4%; border-bottom: 1px solid #333; }
        .header h2 { font-size: 1.2rem; color: var(--netflix-red); margin: 0 0 10px 0; }
        .header input { 
            background: #222; border: 2px solid #444; color: white; padding: 12px; 
            width: 100%; box-sizing: border-box; border-radius: 8px; outline: none; font-size: 16px;
        }
        .header input:focus { border-color: var(--netflix-red); }

        .app-container { padding: 10px 4%; display: flex; flex-direction: column; gap: 20px; padding-bottom: 120px; }
        
        .row { display: none; }
        .row.visible { display: block; }
        .row-title { font-size: 1.1rem; font-weight: bold; margin-bottom: 10px; color: #eee; border-right: 4px solid var(--netflix-red); padding-right: 10px; }
        .row-content { display: flex; gap: 15px; overflow-x: auto; padding: 10px 0; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
        
        .card { 
            min-width: var(--card-w); height: var(--card-h); 
            background: #333; border-radius: 8px; border: 2px solid transparent; 
            flex-shrink: 0; position: relative; overflow: hidden; 
        }
        .card img { width: 100%; height: 100%; object-fit: cover; }
        .card-label { 
            position: absolute; bottom: 0; width: 100%; 
            background: rgba(0,0,0,0.85); color: #fff; font-size: 0.75rem; 
            text-align: center; padding: 8px 4px; box-sizing: border-box;
            z-index: 5; min-height: 35px; display: flex; align-items: center; justify-content: center;
        }

        #player-container { display: none; margin-top: 20px; width: 100%; }
        #player-container.visible { display: block; }
        #active-episode-title { font-size: 1.1rem; color: var(--debug-clr); margin-bottom: 10px; font-weight: bold; }
        #player-wrapper { width: 100%; background: #000; aspect-ratio: 16/9; border-radius: 12px; overflow: hidden; border: 1px solid #444; }
        iframe { width: 100%; height: 100%; border: none; }

        #debug-bar { 
            position: fixed; bottom: 0; width: 100%; 
            background: rgba(0,0,0,0.95); color: var(--debug-clr); 
            padding: 10px 15px; font-family: monospace; font-size: 0.75rem; 
            border-top: 1px solid var(--debug-clr); z-index: 9999; word-break: break-all;
        }
        .debug-url { color: #3498db; display: block; font-size: 0.7rem; margin-top: 3px; }
    </style>
</head>
<body>

<div class="header">
    <h2>AKWAM TV PRO</h2>
    <input type="text" id="search-input" placeholder="ابحث هنا..." autocomplete="off">
</div>

<div class="app-container">
    <div class="row" id="row-search">
        <div class="row-title">نتائج البحث</div>
        <div class="row-content" id="grid-search"></div>
    </div>
    
    <div class="row" id="row-episodes">
        <div class="row-title" id="episodes-label">الحلقات</div>
        <div class="row-content" id="grid-episodes"></div>
    </div>

    <div id="player-container">
        <div id="active-episode-title"></div>
        <div id="player-wrapper">
            <iframe id="video-frame" allowfullscreen></iframe>
        </div>
    </div>
</div>

<div id="debug-bar">DEBUG: جاهز...</div>

<script>
    const PROXY_LIST = [
        (url) => `https://corsproxy.io/?${encodeURIComponent(url)}`,
        (url) => `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`
    ];
    const BASE = "https://ak.sv";
    let state = { searchItems: [], episodeItems: [] };
    const searchInput = document.getElementById('search-input');

    function debug(msg, url = "") {
        const time = new Date().toLocaleTimeString();
        document.getElementById('debug-bar').innerHTML = `[${time}] ${msg} ${url ? `<span class="debug-url">${url}</span>` : ''}`;
    }

    // --- إصلاح نظام التركيز ---
    // لا يوجد auto-focus قسري هنا، التركيز يحدث فقط عند رغبة المستخدم
    searchInput.addEventListener('keydown', e => {
        if(e.key === 'Enter') {
            startSearch(searchInput.value);
            searchInput.blur(); // إخفاء الكيبورد بعد الضغط على بحث لرؤية النتائج
        }
    });

    async function smartFetch(url) {
        for (let proxy of PROXY_LIST) {
            try {
                const res = await fetch(proxy(url));
                if (res.ok) return proxy === PROXY_LIST[1] ? (await res.json()).contents : await res.text();
            } catch (e) {}
        }
        return null;
    }

    async function startSearch(q) {
        if(!q) return;
        debug(`جاري البحث عن: ${q}`);
        const html = await smartFetch(`${BASE}/search?q=${q}`);
        if(!html) return;
        
        const doc = new DOMParser().parseFromString(html, 'text/html');
        // استهداف مباشر للعناصر التي تحتوي على الصور والعناوين في أكوام
        const entries = Array.from(doc.querySelectorAll('.entry-box, .subject-item, a[href*="/movie/"], a[href*="/series/"]'));
        
        const rawItems = entries.map(el => {
            const a = el.tagName === 'A' ? el : el.querySelector('a');
            const img = el.querySelector('img');
            if (!a || !img) return null;

            // استخراج العنوان بدقة
            const title = img.getAttribute('alt') || a.innerText.trim() || "عنوان غير متوفر";

            return {
                title: title,
                link: a.href.startsWith('http') ? a.href : BASE + a.getAttribute('href'),
                img: img.getAttribute('data-src') || img.src,
                isSeries: a.href.includes('/series/')
            };
        }).filter(item => item && (item.link.includes('/series/') || item.link.includes('/movie/')));

        state.searchItems = rawItems.filter((v, i, a) => a.findIndex(t => t.link === v.link) === i);

        renderRow('grid-search', state.searchItems);
        document.getElementById('row-search').classList.add('visible');
        debug(`تم العثور على ${state.searchItems.length} نتيجة.`);
    }

    async function loadEpisodes(item) {
        debug(`جلب حلقات: ${item.title}`);
        const html = await smartFetch(item.link);
        const doc = new DOMParser().parseFromString(html, 'text/html');
        
        const rawEps = Array.from(doc.querySelectorAll('a[href*="/episode/"]')).map(a => ({
            title: a.innerText.trim() || "حلقة",
            link: a.href.startsWith('http') ? a.href : BASE + a.getAttribute('href'),
            img: item.img
        }));

        state.episodeItems = rawEps.filter((v, i, a) => a.findIndex(t => t.link === v.link) === i);

        if(state.episodeItems.length > 0) {
            renderRow('grid-episodes', state.episodeItems);
            document.getElementById('row-episodes').classList.add('visible');
            document.getElementById('episodes-label').innerText = `حلقات: ${item.title}`;
            document.getElementById('row-episodes').scrollIntoView({ behavior: 'smooth' });
        } else fetchAndPlay(item.link, item.title);
    }

    async function fetchAndPlay(link, title) {
        debug(`تحليل الرابط...`, link);
        const container = document.getElementById('player-container');
        container.classList.add('visible');
        document.getElementById('active-episode-title').innerText = `جاري استخراج الرابط: ${title}`;

        const mp4Url = await extractMp4(link);
        const finalUrl = mp4Url || await getIframe(link);

        if(finalUrl) {
            document.getElementById('video-frame').src = finalUrl;
            document.getElementById('active-episode-title').innerText = `تشغيل الآن: ${title}`;
            debug(`تم العثور على الفيديو!`, finalUrl);
            document.getElementById('player-container').scrollIntoView({ behavior: 'smooth' });
        } else {
            debug(`فشل استخراج الرابط.`);
        }
    }

    async function getIframe(link) {
        const html = await smartFetch(link);
        const doc = new DOMParser().parseFromString(html, 'text/html');
        const watchBtn = doc.querySelector('a[href*="/watch/"]');
        if(!watchBtn) return null;
        const wHtml = await smartFetch(watchBtn.href.startsWith('http') ? watchBtn.href : BASE + watchBtn.getAttribute('href'));
        return new DOMParser().parseFromString(wHtml, 'text/html').querySelector('iframe')?.src;
    }

    async function extractMp4(link) {
        try {
            const html = await smartFetch(link);
            const doc = new DOMParser().parseFromString(html, 'text/html');
            const goLink = doc.querySelector('a[href*="go.ak.sv/link/"]');
            if(!goLink) return null;
            const id = goLink.href.split('/').pop();
            const dlHtml = await smartFetch(link.replace('/episode/', `/download/${id}/`));
            const mp4 = new DOMParser().parseFromString(dlHtml, 'text/html').querySelector('a[href*=".mp4"]');
            return mp4 ? mp4.href : null;
        } catch(e) { return null; }
    }

    function renderRow(id, data) {
        document.getElementById(id).innerHTML = data.map((item, i) => `
            <div class="card" onclick="handleAction('${id}', ${i})">
                <img src="${item.img}">
                <div class="card-label">${item.title}</div>
            </div>
        `).join('');
    }

    function handleAction(row, idx) {
        const item = (row === 'grid-search') ? state.searchItems[idx] : state.episodeItems[idx];
        debug(`تم اختيار: ${item.title}`);
        if(row === 'grid-search' && item.isSeries) loadEpisodes(item);
        else fetchAndPlay(item.link, item.title);
    }
</script>
</body>
</html>
