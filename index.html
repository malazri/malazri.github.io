<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AlAzri TV - v4.9</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { --primary-red: #e50914; --bg-dark: #0a0a0a; --card-w: 160px; --card-h: 100px; }
        body { background-color: var(--bg-dark); color: white; font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

        .fixed-header { 
            position: fixed; top: 0; left: 0; right: 0; z-index: 4000; 
            background: #000; padding: 12px 4%; 
            display: flex; justify-content: space-between; align-items: center; 
            border-bottom: 1px solid #222;
        }

        .brand { color: var(--primary-red); font-weight: 900; font-size: 1.5rem; cursor: pointer; }
        .header-actions { display: flex; align-items: center; gap: 15px; }

        .btn-google { background: white; color: black; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-auth { background: var(--primary-red); color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        
        .content-area { flex: 1; overflow-y: auto; padding: 85px 20px 100px 20px; }

        .row { display: none; margin-bottom: 30px; }
        .row.visible { display: block; }
        .row-title { font-size: 1.1rem; font-weight: bold; border-right: 4px solid var(--primary-red); padding-right: 10px; }
        .row-content { display: flex; gap: 15px; overflow-x: auto; padding: 10px 5px; }

        .card { min-width: var(--card-w); height: var(--card-h); background: #1a1a1a; border-radius: 8px; position: relative; cursor: pointer; flex-shrink: 0; }
        .card img { width: 100%; height: 100%; object-fit: cover; border-radius: 8px; }
        .card-label { position: absolute; bottom: 0; width: 100%; background: rgba(0,0,0,0.8); font-size: 0.7rem; text-align: center; padding: 5px; border-radius: 0 0 8px 8px; }

        #player-container { display: none; width: 100%; max-width: 1000px; margin: 0 auto 30px auto; background: #000; border-radius: 12px; border: 1px solid #333; overflow: hidden; }
        video { width: 100%; aspect-ratio: 16/9; display: block; background: #000; }

        .history-info { background: #1c1c1c; padding: 15px; border-radius: 8px; margin-top: 15px; border-right: 4px solid var(--primary-red); font-size: 0.9rem; display: none; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
        .btn-restart { background: #444; color: #fff; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; }

        #mobile-search-row { display: none; position: fixed; top: 60px; left:0; right:0; z-index: 3999; background: #111; padding: 10px 4%; border-bottom: 1px solid #333; }
        #mobile-search-row.active { display: block; }
    </style>
</head>
<body>

<div class="fixed-header">
    <div class="brand" onclick="location.reload()">ALAZRI</div>
    <div class="header-actions">
        <i class="fas fa-heart header-icon" id="fav-list-trigger" style="cursor:pointer; display:none;" onclick="toggleFavSection()"></i>
        <i class="fas fa-search header-icon" style="cursor:pointer;" onclick="toggleSearch()"></i>
        <div id="auth-section">
            <button class="btn-google" id="google-btn" onclick="loginWithGoogle()">دخول</button>
            <button class="btn-auth" id="logout-btn" style="display:none" onclick="handleLogout()">خروج</button>
        </div>
    </div>
</div>

<div id="mobile-search-row">
    <input type="text" id="search-input" style="width:100%; background:#222; border:none; color:white; padding:10px; border-radius:5px;" placeholder="ابحث عن مسلسل أو فيلم..." onkeydown="if(event.key==='Enter') startSearch(this.value)">
</div>

<main class="content-area">
    <div class="row" id="row-search">
        <div class="row-title">نتائج البحث</div>
        <div class="row-content" id="grid-search"></div>
    </div>

    <div class="row" id="row-favs">
        <div class="row-title">قائمتي</div>
        <div class="row-content" id="grid-favs"></div>
    </div>

    <div id="player-container">
        <video id="main-video" controls playsinline autoplay></video>
        <div style="padding:15px;">
            <div id="active-episode-title" style="font-weight:bold; color:var(--primary-red); margin-bottom:10px;"></div>
            
            <div id="history-info-box" class="history-info">
                <div id="history-text">
                    <i class="fas fa-history"></i> آخر مشاهدة: <b id="last-date"></b> | توقفت عند: <b id="last-pos-text"></b>
                </div>
                <button class="btn-restart" onclick="restartVideo()">إعادة من البداية</button>
            </div>
        </div>
    </div>

    <div class="row" id="row-episodes">
        <div style="display:flex; align-items:center; gap:15px; margin-bottom:10px;">
            <div class="row-title" id="episodes-label">الحلقات</div>
            <button id="fav-toggle-btn" class="btn-auth" style="background:#222; display:none;" onclick="toggleFavorite()"><i id="fav-icon" class="far fa-heart"></i></button>
        </div>
        <div class="row-content" id="grid-episodes"></div>
    </div>
</main>

<script>
    const SB_URL = "https://hksxehxhdlzqmzrqspjc.supabase.co";
    const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imhrc3hlaHhoZGx6cW16cnFzcGpjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE2NTI2MzYsImV4cCI6MjA4NzIyODYzNn0.IrMUz0wss2qoJEXqD6Q2hlXa5J13i-_2VYxAUM_R5tY";
    const db = supabase.createClient(SB_URL, SB_KEY);
    const PROXY = (url) => `https://corsproxy.io/?${encodeURIComponent(url)}`;
    const BASE = "https://ak.sv";

    let state = { user: null, currentEpisodeLink: "", currentSeries: null };
    let favorites = [];
    const videoElem = document.getElementById('main-video');

    // --- الوظيفة الأساسية: جلب وتشغيل الفيديو ---
    async function fetchAndPlay(link, title) {
        if (!link) return;
        state.currentEpisodeLink = link;

        document.getElementById('player-container').style.display = 'block';
        document.getElementById('history-info-box').style.display = 'none';
        document.getElementById('active-episode-title').innerText = "جاري تحضير الفيديو...";
        
        videoElem.pause();
        videoElem.removeAttribute('src');
        videoElem.load();

        try {
            let resumeTime = 0;
            // 1. جلب السجل
            if (state.user) {
                const { data } = await db.from('watch_history').select('*').eq('user_id', state.user.id).eq('episode_link', link).maybeSingle();
                if (data && data.last_position > 5) {
                    resumeTime = data.last_position;
                    document.getElementById('last-date').innerText = new Date(data.updated_at).toLocaleDateString('ar-EG');
                    document.getElementById('last-pos-text').innerText = Math.floor(resumeTime / 60) + " دقيقة";
                    document.getElementById('history-info-box').style.display = 'flex';
                }
            }

            // 2. استخراج الرابط الحقيقي
            const html = await (await fetch(PROXY(link))).text();
            const videoId = html.match(/go\.ak\.sv\/link\/([a-zA-Z0-9]+)/)?.[1];
            
            const downloadUrl = link.includes('/episode/') ? link.replace('/episode/', '/download/') : link.replace('/movie/', '/download/');
            const dlPageHtml = await (await fetch(PROXY(downloadUrl))).text();
            
            const mp4Match = dlPageHtml.match(/href="([^"]+\.mp4)"/);
            const mp4Link = mp4Match ? mp4Match[1] : null;

            if (mp4Link) {
                document.getElementById('active-episode-title').innerText = title;
                videoElem.src = mp4Link;
                videoElem.onloadedmetadata = () => {
                    if (resumeTime > 0) videoElem.currentTime = resumeTime;
                    videoElem.play();
                };
            } else {
                throw "لم يتم العثور على ملف الفيديو";
            }

        } catch (e) {
            document.getElementById('active-episode-title').innerText = "خطأ: فشل في تشغيل الفيديو";
            console.error(e);
        }
    }

    function restartVideo() {
        videoElem.currentTime = 0;
        videoElem.play();
        document.getElementById('history-info-box').style.display = 'none';
    }

    async function saveProgress() {
        if (state.user && state.currentEpisodeLink && !videoElem.paused) {
            const pos = Math.floor(videoElem.currentTime);
            if (pos > 10) {
                await db.from('watch_history').upsert({
                    user_id: state.user.id,
                    episode_link: state.currentEpisodeLink,
                    last_position: pos,
                    updated_at: new Date()
                }, { onConflict: 'user_id, episode_link' });
            }
        }
    }

    async function checkUser() {
        const { data: { session } } = await db.auth.getSession();
        if (session?.user) {
            state.user = session.user;
            document.getElementById('google-btn').style.display = 'none';
            document.getElementById('logout-btn').style.display = 'block';
            document.getElementById('fav-list-trigger').style.display = 'block';
            loadFavorites();
            setInterval(saveProgress, 10000);
        }
    }

    // --- البحث والمفضلة والحلقات ---
    async function startSearch(q) {
        if(!q) return;
        const res = await fetch(PROXY(`${BASE}/search?q=${q}`));
        const html = await res.text();
        const doc = new DOMParser().parseFromString(html, 'text/html');
        const results = [];
        doc.querySelectorAll('a[href*="/series/"], a[href*="/movie/"]').forEach(a => {
            const img = a.querySelector('img');
            if(img) {
                results.push({ title: img.alt, link: a.href.includes('http') ? a.href : BASE + a.getAttribute('href'), img: img.src });
            }
        });
        document.getElementById('grid-search').innerHTML = results.map(item => `
            <div class="card" onclick='handleAction(${JSON.stringify(item)})'>
                <img src="${item.img}"><div class="card-label">${item.title}</div>
            </div>
        `).join('');
        document.getElementById('row-search').classList.add('visible');
    }

    async function loadEpisodes(item) {
        state.currentSeries = item;
        const grid = document.getElementById('grid-episodes');
        document.getElementById('row-episodes').classList.add('visible');
        grid.innerHTML = 'جاري جلب الحلقات...';
        
        if(state.user) { document.getElementById('fav-toggle-btn').style.display = 'block'; updateFavBtn(); }

        const html = await (await fetch(PROXY(item.link))).text();
        const doc = new DOMParser().parseFromString(html, 'text/html');
        const episodes = [];
        doc.querySelectorAll('a[href*="/episode/"]').forEach(a => {
            episodes.push({ title: a.innerText.trim(), link: a.href.includes('http') ? a.href : BASE + a.getAttribute('href'), img: item.img });
        });

        grid.innerHTML = episodes.map(ep => `
            <div class="card" onclick="fetchAndPlay('${ep.link}', '${ep.title}')">
                <img src="${ep.img}"><div class="card-label">${ep.title}</div>
            </div>
        `).join('');
        document.getElementById('episodes-label').innerText = item.title;
    }

    function handleAction(item) {
        if(item.link.includes('/series/')) loadEpisodes(item);
        else fetchAndPlay(item.link, item.title);
    }

    async function loadFavorites() {
        const { data } = await db.from('favorites').select('series_data').eq('user_id', state.user.id);
        if(data) {
            favorites = data.map(d => d.series_data);
            renderFavorites();
        }
    }

    function renderFavorites() {
        const grid = document.getElementById('grid-favs');
        if(favorites.length > 0) {
            document.getElementById('row-favs').classList.add('visible');
            grid.innerHTML = favorites.map(item => `
                <div class="card" onclick='handleAction(${JSON.stringify(item)})'>
                    <img src="${item.img}"><div class="card-label">${item.title}</div>
                </div>
            `).join('');
        }
    }

    function toggleSearch() { document.getElementById('mobile-search-row').classList.toggle('active'); }
    function updateFavBtn() { document.getElementById('fav-icon').className = favorites.some(f => f.link === state.currentSeries.link) ? "fas fa-heart" : "far fa-heart"; }
    async function toggleFavorite() {
        const isFav = favorites.some(f => f.link === state.currentSeries.link);
        if(isFav) {
            await db.from('favorites').delete().eq('user_id', state.user.id).filter('series_data->>link', 'eq', state.currentSeries.link);
            favorites = favorites.filter(f => f.link !== state.currentSeries.link);
        } else {
            await db.from('favorites').insert([{ user_id: state.user.id, series_data: state.currentSeries }]);
            favorites.push(state.currentSeries);
        }
        updateFavBtn();
        renderFavorites();
    }

    async function loginWithGoogle() { await db.auth.signInWithOAuth({ provider: 'google' }); }
    async function handleLogout() { await db.auth.signOut(); location.reload(); }

    checkUser();
</script>
</body>
</html>
